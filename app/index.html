/* ══════════ ПОЛНОЭКРАННЫЙ ПРОСМОТР ФОТО: зум, свайп, скачивание ══════════ */
const PhotoView = {
  idx:0, list:[], scale:1, ox:0, oy:0, dragging:null, pinch:null,
  open(id){
    const inFolder = S.folder && S.folder.zone==='photos';
    const list = DB.media.filter(m=>m.kind==='photo' && !m.secret && (inFolder ? m.folder===S.folder.id : !m.folder));
    if(!list.length){ toast('Фото не найдены'); return; }
    let idx = list.findIndex(m=>m.id===id); if(idx<0) idx=0;
    this.idx=idx; this.list=list;
    const o=document.getElementById('overlays');
    o.innerHTML='<div class="modal-back fullscreen" id="fvBack"><div class="modal fullview">'+
      '<img class="fv-img" id="fvImg" alt="" draggable="false">'+
      '<div class="fv-bar">'+
        '<div class="fv-title" id="fvTitle"></div>'+
        '<button class="fv-btn" title="Уменьшить" data-act="fvZoom" data-arg="-1">−</button>'+
        '<button class="fv-btn" title="Увеличить" data-act="fvZoom" data-arg="1">+</button>'+
        '<button class="fv-btn" title="1:1" data-act="fvZoom" data-arg="0">1:1</button>'+
        '<button class="fv-btn" title="Скачать" data-act="fvSave">⤓</button>'+
        '<button class="fv-btn" title="Закрыть (Esc)" data-act="modalBack" style="font-size:18px">✕</button>'+
      '</div>'+
      (list.length>1? '<button class="fv-btn fv-nav prev" data-act="fvPrev">‹</button>'+
                      '<button class="fv-btn fv-nav next" data-act="fvNext">›</button>'+
                      '<div class="fv-count" id="fvCount"></div>' : '')+
      '</div></div>';
    this.show();
    const img=document.getElementById('fvImg'), back=document.getElementById('fvBack');
    /* перетаскивание мышью/пальцем */
    const down=e=>{ const t=e.touches?e.touches[0]:e; this.dragging={x:t.clientX,y:t.clientY,ox:this.ox,oy:this.oy,moved:false}; img.classList.add('drag'); };
    const move=e=>{
      if(!this.dragging) return;
      const t=e.touches?e.touches[0]:e; const dx=t.clientX-this.dragging.x, dy=t.clientY-this.dragging.y;
      if(Math.abs(dx)+Math.abs(dy)>6) this.dragging.moved=true;
      this.ox=this.dragging.ox+dx; this.oy=this.dragging.oy+dy; this.apply();
      if(e.cancelable) e.preventDefault();
    };
    const up=()=>{ this.dragging=null; img.classList.remove('drag'); if(this.scale<=1.05){ this.ox=this.oy=0; this.apply(); } };
    /* щипок двумя пальцами */
    const tstart=e=>{
      if(e.touches.length===2){
        this.pinch={d:this.dist(e.touches), s:this.scale, ox:this.ox, oy:this.oy,
          cx:(e.touches[0].clientX+e.touches[1].clientX)/2, cy:(e.touches[0].clientY+e.touches[1].clientY)/2};
        this.dragging=null;
      }
    };
    const tmove=e=>{
      if(this.pinch && e.touches.length===2){
        const k=this.dist(e.touches)/this.pinch.d;
        this.scale=Math.max(.4,Math.min(6,this.pinch.s*k)); this.apply();
        if(e.cancelable) e.preventDefault();
      }
    };
    const tend=()=>{ this.pinch=null; };
    /* двойной клик/тап — зум 1↔2.5 в точке */
    let lastTap=0, lastX=0, lastY=0;
    const dbl=e=>{
      const t=(e.changedTouches&&e.changedTouches[0])||e, now=Date.now();
      if(now-lastTap<320 && Math.abs(t.clientX-lastX)<40 && Math.abs(t.clientY-lastY)<40){
        this.scale = this.scale>1.05 ? 1 : 2.5; this.ox=this.oy=0; this.apply();
        lastTap=0;
      } else { lastTap=now; lastX=t.clientX; lastY=t.clientY; }
    };
    /* колесо мыши — зум к курсору */
    back.addEventListener('wheel', e=>{
      e.preventDefault();
      const k=e.deltaY<0?1.15:1/1.15, ns=Math.max(.4,Math.min(6,this.scale*k));
      const r=img.getBoundingClientRect(), cx=e.clientX-(r.left+r.width/2), cy=e.clientY-(r.top+r.height/2);
      this.ox=cx+(this.ox-cx)*(ns/this.scale); this.oy=cy+(this.oy-cy)*(ns/this.scale);
      this.scale=ns; this.apply();
    }, {passive:false});
    img.addEventListener('mousedown', down);
    if(this._mm){ window.removeEventListener('mousemove', this._mm); window.removeEventListener('mouseup', this._mu); }
    this._mm=move; this._mu=up;
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    img.addEventListener('touchstart', e=>{ down(e); tstart(e); }, {passive:false});
    img.addEventListener('touchmove', e=>{ move(e); tmove(e); }, {passive:false});
    img.addEventListener('touchend', e=>{ const moved=this.dragging&&this.dragging.moved; up(); tend(); if(!moved) dbl(e); });
    img.addEventListener('dblclick', dbl);
    /* свайп (когда без зума) — переключение фото */
    let sx=null, sy=null;
    back.addEventListener('touchstart', e=>{ if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } }, {passive:true});
    back.addEventListener('touchend', e=>{
      if(sx===null || this.scale>1.05) { sx=null; return; }
      const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
      if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) this.next(); else this.prev(); }
    });
    /* стрелки клавиатуры + Esc */
    this._key = e=>{
      if(document.getElementById('fvBack')){
        if(e.key==='ArrowLeft') this.prev();
        else if(e.key==='ArrowRight') this.next();
        else if(e.key==='Escape') closeModal();
      }
    };
    window.addEventListener('keydown', this._key);
  },
  dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy)||1; },
  apply(){ const img=document.getElementById('fvImg'); if(!img) return;
    img.style.transform='translate('+this.ox+'px,'+this.oy+'px) scale('+this.scale+')'; },
  async show(){
    const g=this._gen=(this._gen||0)+1;
    const m=this.list[this.idx]; if(!m) return;
    const img=document.getElementById('fvImg'); if(!img) return;
    this.scale=1; this.ox=this.oy=0; this.apply();
    img.style.opacity='.25';
    const u=await mediaUrl(m.id);
    if(g!==this._gen || !document.getElementById('fvBack')) return;
    if(!u){ toast('Файл не найден'); img.style.opacity='1'; return; }
    img.src=u; img.style.opacity='1';
    const t=document.getElementById('fvTitle'); if(t) t.textContent=(m.name||'Фото');
    const c=document.getElementById('fvCount'); if(c) c.textContent=(this.idx+1)+' / '+this.list.length;
  },
  next(){ if(this.list.length<2) return; this.idx=(this.idx+1)%this.list.length; this.show(); },
  prev(){ if(this.list.length<2) return; this.idx=(this.idx-1+this.list.length)%this.list.length; this.show(); },
  zoom(dir){ if(dir===0){ this.scale=1; this.ox=this.oy=0; }
    else { this.scale=Math.max(.4,Math.min(6,this.scale*(dir>0?1.35:1/1.35))); }
    this.apply(); },
  async save(){
    const m=this.list[this.idx]; const b=await IDB.get(m.id); if(!b){ toast('Файл не найден'); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=(m.name||'armi-photo')+'.jpg'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Фото скачано');
  },
  /* сброс при закрытии */
  destroy(){ if(this._key){ window.removeEventListener('keydown', this._key); this._key=null; }
    if(this._mm){ window.removeEventListener('mousemove', this._mm); window.removeEventListener('mouseup', this._mu); this._mm=this._mu=null; }
    this.list=[]; }
};

const LectRec = {
  rec:null, chunks:[], stream:null, ctx:null, analyser:null, rafId:null, timerId:null, t0:0, lectureId:null, cancelled:false,
  async start(){
    if(this.rec) return;
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    }catch(e){
      const noPerm = e && (e.name==='NotAllowedError'||e.name==='SecurityError');
      toast(noPerm ? 'Доступ к микрофону запрещён. Разреши его в адресной строке браузера (иконка замка) и попробуй снова' : 'Микрофон не найден на этом устройстве');
      return;
    }
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    this.rec = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    this.chunks=[]; this.cancelled=false; this.stream=stream;
    this.rec.ondataavailable = e => { if(e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = () => this.finish();
    this.lectureId = uid('lec');
    const d=new Date();
    DB.lectures.unshift({id:this.lectureId, title:(REC_CATS[this.cat]||REC_CATS.lecture).t+' '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}), cat:this.cat||'lecture', dur:'', date:'сейчас, '+nowHM(), consp:false, text:'Записывается…', excerpt:'', recId:null, seconds:0});
    saveDB();
    this.rec.start(1000);
    this.t0 = Date.now();
    /* индикатор уровня */
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      const src = this.ctx.createMediaStreamSource(stream);
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 256;
      src.connect(this.analyser);
      const data = new Uint8Array(this.analyser.frequencyBinCount);
      const bars = 12;
      const loop = () => {
        if(!this.analyser){ return; }
        this.analyser.getByteFrequencyData(data);
        const box = document.getElementById('lvl');
        if(box){
          let html='';
          for(let i=0;i<bars;i++){
            const v = data[Math.floor(i*data.length/bars)]/255;
            html += '<span style="height:'+Math.max(3, Math.round(v*18))+'px"></span>';
          }
          box.innerHTML = html;
        }
        this.rafId = requestAnimationFrame(loop);
      };
      loop();
    }catch(e){}
    /* таймер */
    this.timerId = setInterval(()=>{
      const el = document.getElementById('rec-t');
      if(el) el.textContent = fmtSec((Date.now()-this.t0)/1000);
    }, 500);
    S.lectRec=true; render();
    toast('Запись началась — говори, всё пишется на устройство');
  },
  async stop(){
    if(!this.rec) return;
    clearInterval(this.timerId);
    cancelAnimationFrame(this.rafId);
    if(this.ctx){ try{ this.ctx.close(); }catch(e){} this.ctx=null; this.analyser=null; }
    this.rec.stop();
    this.rec=null;
  },
  cancel(){
    if(!this.rec){ return; }
    this.cancelled = true;
    this.stop();
  },
  async finish(){
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    S.lectRec=false;
    const lec = DB.lectures.find(l=>l.id===this.lectureId);
    if(this.cancelled || !this.chunks.length || !lec){
      if(lec){ DB.lectures = DB.lectures.filter(l=>l.id!==lec.id); saveDB(); }
      render(); toast('Запись отменена');
      return;
    }
    const blob = new Blob(this.chunks, {type:this.chunks[0].type||'audio/webm'});
    this.chunks=[];
    const seconds = Math.round((Date.now()-this.t0)/1000);
    try{ await IDB.put('lec_'+lec.id, blob); }catch(e){}
    lec.dur = seconds>=60 ? Math.round(seconds/60)+' мин' : seconds+' сек';
    lec.seconds = seconds;
    lec.recId = lec.id;
    lec.text = 'Записано · '+fmtSize(blob.size)+'. Нажми «Расшифровать», чтобы превратить в текст.';
    lec.excerpt = '';
    saveDB(); render();
    toast('Готово: '+lec.dur+' записи сохранены. Теперь можно расшифровать');
  },
};

/* ══════════ КНИГИ: чтение в приложении (txt / fb2 / epub) ══════════ */
const Books = {
  /* парсинг файла -> {title, chapters:[{title, html}]}. fb2 и epub разбираем DOMParser'ом, txt — по абзацам */
  async parse(file){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if(ext==='txt' || (file.type.startsWith('text/') && !['fb2','epub'].includes(ext))){
      let text=await file.text();
      /* xml-заголовок у некоторых fb2 ошибочно сохраняют как txt */
      if(text.includes('<FictionBook')) return this.parseFb2Text(text);
      const title=file.name.replace(/\.[^.]+$/,'');
      const html=esc(text).split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
      return {title, author:'', chapters:[{title:title, html}]};
    }
    if(ext==='fb2'){ return this.parseFb2Text(await file.text()); }
    if(ext==='epub'){ return this.parseEpub(file); }
    throw new Error('Понимаю txt, fb2 и epub — а это .' + ext);
  },
  parseFb2Text(text){
    const doc=new DOMParser().parseFromString(text,'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('Файл fb2 повреждён');
    const title=(doc.querySelector('book-title')||{}).textContent || 'Без названия';
    const author=[...doc.querySelectorAll('title-info author')].map(a=>{
      const f=(a.querySelector('first-name')||{}).textContent||'';
      const l=(a.querySelector('last-name')||{}).textContent||'';
      return (f+' '+l).trim();
    }).filter(Boolean).join(', ');
    const body=doc.querySelector('body');
    const chapters=[];
    if(!body) throw new Error('В fb2 нет текста');
    /* секции верхнего уровня = главы */
    const secs=[...body.children].filter(c=>c.tagName==='section');
    if(secs.length){
      secs.forEach((s,i)=>{
        const t=(s.querySelector(':scope > title > p, :scope > title')||{}).textContent||('Глава '+(i+1));
        const html=this.fb2Html(s);
        if(html.trim()) chapters.push({title:t.trim(), html});
      });
    } else {
      chapters.push({title, html:this.fb2Html(body)});
    }
    return {title, author, chapters};
  },
  fb2Html(el){
    const out=[];
    const walk=(node)=>{
      [...node.children].forEach(c=>{
        const tag=c.tagName.toLowerCase();
        if(tag==='section'){ walk(c); return; }
        if(tag==='title'){ const t=c.textContent.trim(); if(t) out.push('<h2>'+esc(t)+'</h2>'); return; }
        if(tag==='p'){ const t=c.textContent.trim(); if(t) out.push('<p>'+esc(t)+'</p>'); return; }
        if(tag==='empty-line'){ out.push('<p> </p>'); return; }
        if(tag==='poem'||tag==='stanza'||tag==='epigraph'){ walk(c); return; }
        if(tag==='v'){ out.push('<p class="verse">'+esc(c.textContent.trim())+'</p>'); return; }
        walk(c);
      });
    };
    walk(el);
    return out.join('');
  },
  async parseEpub(file){
    /* epub = zip: читаем container.xml -> opf -> spine; текст глав в xhtml */
    const zip=await JSZipLite.read(file);
    const container=await zip.text('META-INF/container.xml');
    const opfPath=new DOMParser().parseFromString(container,'text/xml').querySelector('rootfile').getAttribute('full-path');
    const opf=await zip.text(opfPath);
    const opfDoc=new DOMParser().parseFromString(opf,'text/xml');
    const title=(opfDoc.querySelector('metadata title')||{}).textContent||file.name.replace(/\.[^.]+$/,'');
    const authorEl=opfDoc.querySelector('metadata creator');
    const author=authorEl?authorEl.textContent:'';
    const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
    const manifest={};
    [...opfDoc.querySelectorAll('manifest item')].forEach(it=>manifest[it.getAttribute('id')]=it.getAttribute('href'));
    const order=[...opfDoc.querySelectorAll('spine itemref')].map(r=>manifest[r.getAttribute('idref')]).filter(Boolean);
    const chapters=[];
    for(const href of order){
      let html=null;
      try{ html=await zip.text(base+decodeURIComponent(href)); }catch(e){}
      if(!html){ try{ html=await zip.text(base+href); }catch(e){} }
      if(!html) continue;
      const doc=new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('script,style,nav,*[hidden]').forEach(n=>n.remove());
      doc.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{ if(/^on/i.test(a.name)||(a.name==='href'&&/^javascript:/i.test(a.value))) n.removeAttribute(a.name); });});
      /* убираем шапку/титул с служебным текстом */
      const inner=doc.body?doc.body.innerHTML:'';
      const textLen=(doc.body?doc.body.textContent:'').trim().length;
      if(textLen<40) continue;
      const h=doc.querySelector('h1,h2,h3');
      chapters.push({title:(h?h.textContent.trim():'Глава '+(chapters.length+1)).slice(0,80), html:inner});
    }
    if(!chapters.length) throw new Error('В epub не нашлось текста');
    return {title, author, chapters};
  },
  htmlToPlain(html){
    const d=document.createElement('div'); d.innerHTML=html;
    return d.textContent||'';
  },
  async add(file){
    const maxMB=25;
    if(file.size>maxMB*1048576){ toast('Файл больше '+maxMB+' МБ — большие книги разбивай на части'); return; }
    let book;
    try{ book=await this.parse(file); }
    catch(e){ toast(e.message||'Не удалось разобрать книгу'); return; }
    const id=uid('bk');
    const plain=this.htmlToPlain(book.chapters.map(c=>c.html).join(''));
    const words=plain.split(/\s+/).filter(Boolean).length;
    DB.books.unshift({id, title:book.title, author:book.author||'', chapters:book.chapters, chapter:0, scroll:0,
      words, added:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'}), size:file.size});
    if(DB.books.length>40) DB.books.pop();
    saveDB(); render();
    toast('«'+book.title+'» добавлена · '+words.toLocaleString('ru-RU')+' слов');
  },
  async del(id){
    DB.books=DB.books.filter(b=>b.id!==id); saveDB(); render(); toast('Книга удалена');
  },
  progress(b){
    if(!b||!b.chapters||!b.chapters.length) return 0;
    return Math.round(100*((b.chapter||0)+(b.scroll||0))/b.chapters.length);
  }
};
/* мини-читалка zip для epub — распаковка через DecompressionStream('deflate-raw') */
const JSZipLite = {
  async read(file){
    const buf=new Uint8Array(await file.arrayBuffer());
    /* центральный каталог: ищем EOCD */
    let eocd=-1;
    for(let i=buf.length-22;i>=0;i--){ if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){ eocd=i; break; } }
    if(eocd<0) throw new Error('epub повреждён (нет оглавления архива)');
    const dv=new DataView(buf.buffer);
    const count=dv.getUint16(eocd+10,true);
    let off=dv.getUint32(eocd+16,true);
    const files={};
    for(let i=0;i<count;i++){
      if(dv.getUint32(off)!==0x02014b50) break;
      const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true), usize=dv.getUint32(off+24,true);
      const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
      const lho=dv.getUint32(off+42,true);
      let name=new TextDecoder().decode(buf.slice(off+46,off+46+nlen));
      if(!name.endsWith('/')){
        files[name]={method, csize, usize, lho};
      }
      off+=46+nlen+elen+clen;
    }
    const self=this;
    return {
      names:Object.keys(files),
      async text(name){
        const f=files[name]; if(!f) return null;
        const ldv=new DataView(buf.buffer, f.lho);
        if(ldv.getUint32(0)!==0x04034b50) return null;
        const nl=ldv.getUint16(26,true), el=ldv.getUint16(28,true);
        const start=f.lho+30+nl+el;
        const raw=buf.slice(start,start+f.csize);
        let data;
        if(f.method===0){ data=raw; }
        else{
          const ds=new DecompressionStream('deflate-raw');
          const stream=new Blob([raw]).stream().pipeThrough(ds);
          data=new Uint8Array(await new Response(stream).arrayBuffer());
        }
        return new TextDecoder('utf-8').decode(data);
      }
    };
  }
};

/* ══════════ ЛОКАЛЬНЫЙ ИИ (WebLLM): модель живёт на устройстве ══════════ */
const LocalAI = (() => {
  const MODELS = [
    {id:'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', t:'Арми Мини (Qwen 0.5Б)', size:'0,9 ГБ', vram:900, desc:'для телефона и слабых ПК — быстрая', tag:'Qwen'},
    {id:'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', t:'Арми Стандарт (Qwen 1.5Б)', size:'1,6 ГБ', vram:1600, desc:'баланс качества и скорости', tag:'Qwen'},
    {id:'Qwen2.5-3B-Instruct-q4f16_1-MLC', t:'Арми Макс (Qwen 3Б)', size:'2,4 ГБ', vram:2400, desc:'самая умная локально, нужен GPU · рекомендуется для ПК', tag:'Qwen'},
    {id:'SmolLM2-360M-Instruct-q4f16_1-MLC', t:'SmolLM2 360М', size:'0,4 ГБ', vram:500, desc:'совсем крошка — самый быстрый старт', tag:'SmolLM'},
    {id:'SmolLM2-1.7B-Instruct-q4f16_1-MLC', t:'SmolLM2 1.7Б', size:'1,3 ГБ', vram:1500, desc:'шустрая английская, русский ограничен', tag:'SmolLM'},
    {id:'gemma-2-2b-it-q4f16_1-MLC', t:'Gemma 2 2Б', size:'1,8 ГБ', vram:2000, desc:'от Google, аккуратные ответы', tag:'Gemma'},
    {id:'Llama-3.2-1B-Instruct-q4f16_1-MLC', t:'Llama 3.2 1Б', size:'1,1 ГБ', vram:1200, desc:'от Meta — лёгкая и популярная', tag:'Llama'},
    {id:'Phi-3.5-mini-instruct-q4f16_1-MLC', t:'Phi 3.5 мини 3.8Б', size:'2,8 ГБ', vram:3000, desc:'от Microsoft, сильная логика', tag:'Phi'},
    {id:'Mistral-7B-Instruct-v0.3-q4f16_1-MLC', t:'Mistral 7Б', size:'4,4 ГБ', vram:5000, desc:'тяжёлая, для ПК с видеокартой', tag:'Mistral'},
    {id:'TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC', t:'TinyLlama 1.1Б', size:'0,8 ГБ', vram:900, desc:'проверенная классика, быстрый чат', tag:'TinyLlama'},
  ];
  let engine=null, loading=null, current=store.getItem('armi_local_model')||null;
  function ready(){ return !!engine; }
  function modelName(){ return current ? (MODELS.find(m=>m.id===current)||{}).t : null; }
  function hasWebGPU(){
    try{ return !!navigator.gpu; }catch(e){ return false; }
  }
  /* скачанные (кешированные браузером) модели — можно держать несколько и переключаться */
  function downloaded(){ return loadJSON('armi_local_models_saved', current?[current]:[]); }
  function markDownloaded(id){
    const d=downloaded(); if(!d.includes(id)) d.push(id);
    saveJSON('armi_local_models_saved', d);
  }
  function unmarkDownloaded(id){
    const d=downloaded().filter(x=>x!==id);
    saveJSON('armi_local_models_saved', d);
  }
  /* загрузка библиотеки: сначала локальный файл рядом, потом CDN */
  async function loadLib(){
    if(loadLib._c) return loadLib._c;
    loadLib._c = (async ()=>{
      try{ return await import('./vendor-webllm.js'); }
      catch(e){
        /* Windows/Android-сборки (127.0.0.1) и file:// никогда не ходят на CDN: файл обязан лежать рядом.
           Запасной вариант с CDN — только для веб-копии/PWA, где локального файла может не быть. */
        const localBuild = location.protocol==='file:' || /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
        if(localBuild || !navigator.onLine) throw new Error('Файл vendor-webllm.js не найден рядом с приложением. Переустанови Арми из ZIP/APK — движок ИИ лежит внутри сборки.');
        return await import('https://esm.run/@mlc-ai/web-llm@0.2.88');
      }
    })();
    try{ return await loadLib._c; }catch(e){ loadLib._c=null; throw e; }
  }
  /* загрузка модели с прогрессом; onProgress(0..1, текст) */
  async function load(modelId, onProgress){
    if(engine){ await engine.unload(); engine=null; }
    if(!hasWebGPU()) throw new Error('Браузер не поддерживает WebGPU (нужен Chrome 113+ / Edge на ПК, Chrome 121+ на Android). Обнови браузер или используй облачный режим.');
    loading = true;
    try{
      const webllm = await loadLib();
      onProgress && onProgress(0.02, 'Подключаю движок…');
      const eng = await webllm.CreateMLCEngine(modelId, {
        initProgressCallback: (r) => {
          onProgress && onProgress(Math.max(0.03, r.progress||0), r.text || 'Загружаю модель…');
        },
      });
      engine = eng; current = modelId;
      store.setItem('armi_local_model', modelId);
      markDownloaded(modelId);
      return true;
    } finally { loading = false; }
  }
  /* ответ локальной модели; null — если модели нет */
  /* то же, но с явной историей: второй контур не должен видеть публичный чат и не пишет в него */
  async function complete(history, q){
    if(!engine) return null;
    try{
      const sys = 'Ты — Арми, приватный локальный ассистент. Отвечай по-русски кратко и по делу.';
      const stream = await engine.chat.completions.create({
        messages:[{role:'system', content:sys}, ...history.slice(-8), {role:'user', content:q}],
        stream:true, temperature:0.7, max_tokens:600,
      });
      const chunks=[]; for await (const c of stream){ const d=c.choices?.[0]?.delta?.content; if(d) chunks.push(d); }
      const text=chunks.join('').trim(); return text?{text}:null;
    }catch(e){ return {text:'Локальная модель споткнулась: '+(e.message||'ошибка')}; }
  }
  async function chat(q){
    if(!engine) return null;
    try{
      const sys = 'Ты — Арми, локальный ассистент на устройстве пользователя. Отвечай по-русски кратко и по делу, без выдумок. Данные пользователя: '+buildContext();
      const chunks = [];
      const stream = await engine.chat.completions.create({
        messages: [
          {role:'system', content:sys},
          ...CHAT.filter(m=>!m.pending && !m.thinking).slice(-6).map(m=>({role:m.role==='user'?'user':'assistant', content:m.content})),
          {role:'user', content:q},
        ],
        stream:true, temperature:0.7, max_tokens:600,
      });
      for await (const c of stream){
        const d = c.choices?.[0]?.delta?.content;
        if(d) chunks.push(d);
      }
      const text = chunks.join('').trim();
      return text ? {text} : null;
    }catch(e){
      return {text:'Локальная модель споткнулась: '+(e.message||'ошибка')+'\nПопробуй ещё раз или переустанови модель в Настройках.'};
    }
  }
  /* в auto-режиме короткие вопросы можно решать локально, не гоняя облако — но пока всё в облако */
  function preferLocal(){ return false; }
  async function unload(){
    if(engine){ await engine.unload(); engine=null; }
    if(current){ unmarkDownloaded(current); }
    current=null; store.removeItem('armi_local_model');
  }
  /* переключение на уже скачанную модель без удаления других */
  async function switchTo(modelId){ return load(modelId); }
  return { MODELS, ready, modelName, hasWebGPU, load, chat, complete, preferLocal, unload, switchTo, downloaded, get current(){return current;}, get loading(){return !!loading;} };
})();

/* ══════════ ЧАТ АРМИ (настоящий ИИ: облако + локальная модель) ══════════ */
/* мульти-чаты: armi_chats = [{id, name, updated, msgs:[...]}]. Один раз мигрируем старый armi_chat */
const CHAT_WELCOME = 'Привет! Я Арми 9. Отвечаю по-настоящему: в облаке — когда есть интернет, локально — когда его нет (модель скачивается в Настройках). Вижу твои задачи, заметки и расписание. Спроси что угодно.';
let CHATS = loadJSON('armi_chats', null);
if(!CHATS){
  const old = loadJSON('armi_chat', null);
  CHATS = old && old.length ? [{id:uid('ch'), name: old.find(m=>m.role==='user')? old.find(m=>m.role==='user').content.slice(0,30) : 'Первый чат', updated: Date.now(), msgs: old}]
    : [{id:uid('ch'), name:'Новый чат', updated: Date.now(), msgs:[{id:uid('c'), role:'ai', content:CHAT_WELCOME, time:'09:00', local:true}]}];
  saveJSON('armi_chats', CHATS);
}
let CHAT_ID = store.getItem('armi_chat_current') || CHATS[0].id;
if(!CHATS.find(c=>c.id===CHAT_ID)) CHAT_ID = CHATS[0].id;
let CHAT = (CHATS.find(c=>c.id===CHAT_ID)||{}).msgs || [];
function chatSave(){
  const c = CHATS.find(x=>x.id===CHAT_ID);
  if(c){ c.msgs = CHAT; c.updated = Date.now(); }
  saveJSON('armi_chats', CHATS);
}
function chatSwitch(id){
  chatSave();
  CHAT_ID = id; store.setItem('armi_chat_current', id);
  CHAT = (CHATS.find(c=>c.id===id)||{msgs:[]}).msgs;
  S.chatMenu=false; render();
}
function chatNew(){
  chatSave();
  const c = {id:uid('ch'), name:'Новый чат', updated:Date.now(), msgs:[{id:uid('c'), role:'ai', content:CHAT_WELCOME, time:nowHM(), local:true}]};
  CHATS.unshift(c);
  CHAT_ID=c.id; store.setItem('armi_chat_current', c.id);
  CHAT=c.msgs; S.chatMenu=false;
  saveJSON('armi_chats', CHATS);
  render();
  const inp=document.getElementById('chat-in'); if(inp) inp.focus();
}
function chatAutoName(q){
  const c = CHATS.find(x=>x.id===CHAT_ID);
  if(c && c.name==='Новый чат' && q){
    c.name = q.replace(/\s+/g,' ').slice(0,32) + (q.length>32?'…':'');
  }
}
/* S.aiMode: auto | online | offline (auto = облако при интернете, иначе локально) */

  return '<div class="mt">'+esc(m.time||'')+'</div>';
}

/* контекст данных для облака: короткая выжимка того, что видит Арми */
function buildContext(){
  const d=new Date(), {w,ph}=weekOf(d);
  const open=DB.tasks.filter(t=>!t.done).slice(0,8).map(t=>'- [задача] '+t.title+' ('+t.project+', '+t.due+')');
  const evs=DB.events.filter(e=>e.day===(d.getDay()+6)%7).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>'- [событие] '+esc(e.start)+'–'+esc(e.end)+' '+e.title);
  const nts=DB.notes.slice(0,5).map(n=>'- [заметка] '+n.title+' ('+(n.topic||'Личное')+')');
  const lec=DB.lectures.slice(0,3).map(l=>'- [лекция] '+l.title);
  return ['Сегодня: '+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}), (w?('Неделя плана: '+w+'/39'):''), (ph?('Фаза: '+ph.name):'')]
    .filter(Boolean).concat(open,evs,nts,lec).join('\n');
}
/* офлайн-шаблоны без модели: короткие живые ответы (fallback) */
function localAnswer(q){
  const has = s => q.toLowerCase().includes(s);
  const d=new Date(), {w,ph}=weekOf(d), day=DAYS[d.getDay()];
  if(has('спасиб')) return 'Всегда пожалуйста.';
  if(has('как дела')) return 'По плану: '+dayLow(day.type)+'. Открытых задач: '+DB.tasks.filter(x=>!x.done).length+'. А у тебя?';
  if(has('что умеешь')||has('умеешь')) return 'Знаю время и дату, веду план дня («что сегодня?», «неделя и фаза»), задачи, расписание, подбираю книги и идеи на вечер, считаю проценты и примеры. Без интернета отвечаю шаблонами — скачай локальную модель в Настройках, и я начну думать по-настоящему даже офлайн.';
  if(has('факт')){
    const f = FACTS[Math.floor(Math.random()*FACTS.length)];
    return 'Держи факт:\n'+f+'\n\nЕщё — в разделе «Развитие», там их '+FACTS.length+'.';
  }
  if(has('книг')){
    const p = pickBook();
    return 'Под твою неделю подойдёт:\n«'+p.book.t+'» — '+p.book.a+'.\n'+p.book.why+'\nПолная подборка — раздел «Развитие».';
  }
  if(has('идея')){
    const i = IDEAS[Math.floor(Math.random()*IDEAS.length)];
    return 'Идея на вечер:\n'+i+'\nЕщё — в разделе «Развитие».';
  }
  const _ex = _PP.chat && _PP.chat.extra && _PP.chat.extra(has, d, w, ph, day);
  if(_ex) return _ex;
  if(has('сегодня')||has('план на день')){
    return 'Сегодня '+dayLow(day.type)+'.'+(day.train.length ? '\n'+day.train.map(x=>'— '+x).join('\n')+'\n\nСерия сегодня: '+streak()+' дн.' : ' Открытых задач: '+DB.tasks.filter(x=>!x.done).length+'.');
  }
  if(has('недел')||has('фаз')){
    return HAS_PLAN ? 'Неделя '+(w||'–')+' из '+PLAN_WEEKS+' · '+(ph?ph.name:'между фазами')+'.\nСегодня: '+dayLow(day.type)+'.' : 'План по неделям не задан. Сегодня: '+dayLow(day.type)+'.';
  }
  if(has('привет')||has('здрав')){
    return 'Привет! План на сегодня: '+dayLow(day.type)+'. Открытых задач: '+DB.tasks.filter(x=>!x.done).length+'. Спроси «что сегодня?» или открой «Тренировки».';
  }
  if(has('задач')){
    const open = DB.tasks.filter(x=>!x.done);
    return 'Открытых задач: '+open.length+'.\n'+open.slice(0,5).map(t=>'— '+t.title+' ('+t.project+')').join('\n')+(open.length>5?'\n…и ещё '+(open.length-5):'')+'\nРаздел «Задачи» — там же управление своими разделами.';
  }
  if(has('расписан')){
    return 'Расписание на сегодня:\n'+DB.events.filter(e=>e.day===(d.getDay()+6)%7).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>esc(e.start)+'–'+esc(e.end)+' '+e.title).join('\n')+'\nТеперь его можно править: нажми на событие в разделе «Расписание».';
  }
  return 'Интернета нет, а локальная модель ещё не скачана — отвечаю заготовками.\nУверенно умею офлайн:\n— время и дата: «который час», «какое число»\n— план дня: «что сегодня?», «неделя и фаза»\n— задачи, расписание, факты, книги, идеи\nСкачай модель в Настройках → Локальный ИИ — и я буду отвечать по-настоящему без интернета.';
}
/* ══════════ НАСТОЯЩИЙ ИИ: конвейер ответа ══════════
   1) быстрый агент: калькулятор/время/дата — мгновенно, офлайн
   2) облако (/api/chat) — в режимах online и auto (когда есть сеть)
   3) локальная модель (WebLLM) — offline, а в auto — когда сети нет;
      если модель не скачана, честный фолбэк на локальные шаблоны */
function fastAgent(q){
  const calc = calcAnswer(q);
  if(calc) return {text:calc, agent:'fast'};
  const ql = q.toLowerCase();
  const d=new Date();
  if(/который час|сколько времени/.test(ql)) return {text:'Сейчас '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'.', agent:'fast'};
  if(/какое числ|какая дат/.test(ql)) return {text:'Сегодня '+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.', agent:'fast'};
  return null;
}
/* файл открыт как file:// (двойной клик) — сервера нет, значит нет /api */
function isStandalone(){ return location.protocol === 'file:'; }

async function aiAsk(q){
  const mode = aiEffMode();
  const net = navigator.onLine && !isStandalone();
  /* 1) быстрый агент всегда первый: математика и время — мгновенно, без сети и облака */
  const fast = fastAgent(q);
  if(fast) return fast;
  const useCloud = mode==='online' || (mode==='auto' && net && !LocalAI.preferLocal(q));
  if(useCloud){
    try{
      const hist = CHAT.filter(m=>!m.thinking).slice(-10).map(m=>({role:m.role==='user'?'user':'assistant', content:m.content}));
      const r = await fetch('/api/chat/',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:hist, context:buildContext(), deep:!!S.deepThink})});
      if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); }
      const data = await r.json();
      if(data.error || !data.reply) throw new Error(data.error || 'пустой ответ облака');
      return {text:data.reply, cloud:true, deep:!!S.deepThink};
    }catch(err){
      /* облако недоступно — падаем на локальную модель */
      const loc = await LocalAI.chat(q);
      if(loc) return {text:loc.text, local:true};
      const why = isStandalone()
        ? 'Открыт один файл без сервера — облако и расшифровка недоступны.\nСкачай ZIP-версию Арми или пользуйся онлайн-копией, чтобы включить облако.'
        : 'Облако не отвечает ('+ (err.message||'ошибка сети') +').';
      return {text: why + '\nЛокальная модель не скачана — включи её в Настройках, или попробуй ещё раз, когда появится интернет.', fallback:true};
    }
  }
  /* офлайн-режим: локальная модель, затем заготовки */
  const loc = await LocalAI.chat(q);
  if(loc) return {text:loc.text, local:true};
  return {text: localAnswer(q), fallback:true};
}
async function doChatSend(preset){
  const inp = document.getElementById('chat-in');
  const q = (preset!==undefined? preset : (inp?inp.value.trim():''));
  if(!q) return;
  const th=CHATS.find(x=>x.id===CHAT_ID)||CHATS[0]; const arr=th.msgs;
  chatAutoName(q);
  arr.push({id:uid('c'), role:'user', content:q, time:nowHM()});
  chatSave();
  if(inp) inp.value='';
  /* сообщение-заглушка «Арми печатает…» */
  const stub = {id:uid('c'), role:'ai', content:'', time:nowHM(), pending:true};
  arr.push(stub);
  render();
  const ans = await aiAsk(q);
  const i = arr.findIndex(m=>m.id===stub.id);
  const out = {id:stub.id, role:'ai', content:ans.text, time:nowHM()};
  if(ans.agent==='fast') out.agent='fast';
  if(ans.cloud) out.cloud=true;
  if(ans.local) out.local=true;
  if(ans.deep) out.thinking=true;
  if(ans.fallback) out.fallback=true;
  if(i>=0) arr[i]=out; else arr.push(out);
  chatSave();
  render();
}

  async lectAsr(arg){
    const l = DB.lectures.find(x=>x.id===arg); if(!l || l.busy) return;
    if(!cloudGuard('расшифровка лекции')) return;
    if(isStandalone()){ toast('Расшифровка работает в онлайн-копии Арми (открытой по ссылке) — один файл без сервера её не умеет'); return; }
    const b = await IDB.get('lec_'+arg);
    if(!b){ toast('Аудио не найдено — запись не сохранилась'); return; }
    l.busy='asr'; saveDB(); render();
    try{
      const fd = new FormData();
      fd.append('audio', b, 'lecture.webm');
      const r = await fetch('/api/asr/', {method:'POST', body:fd});
      const data = await r.json();
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      const text = (data.text||'').trim();
      if(!text) throw new Error('Речь не распознана');
      l.excerpt = text;
      l.text = text.length>160 ? text.slice(0,160).trim()+'…' : text;
      l.busy=null; saveDB(); render();
      toast('Расшифровано: '+text.split(/\s+/).length+' слов. Можно собирать конспект');
    }catch(e){
      l.busy=null; saveDB(); render();
      toast('Расшифровка не удалась: '+(e.message||'ошибка'));
    }
  },
  async lectSum(arg){
    const l = DB.lectures.find(x=>x.id===arg); if(!l || l.busy || !l.excerpt) return;
    if(!cloudGuard('конспект лекции')) return;
    if(isStandalone()){ toast('Конспект собирается в онлайн-копии Арми — один файл без сервера его не умеет'); return; }
    l.busy='sum'; saveDB(); render();
    try{
      const r = await fetch('/api/summary/', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({transcript:l.excerpt, title:l.title})});
      const data = await r.json();
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      l.summary = (data.notes||'').trim();
      l.consp = true;
      l.busy=null; saveDB(); render();
      toast('Конспект готов');
    }catch(e){
      l.busy=null; saveDB(); render();
      toast('Конспект не собрался: '+(e.message||'ошибка'));
    }

  /* интернет-поиск фактов и книг */
  async funWebSearch(kind){
    const inp=document.getElementById('web-topic');
    const topic=(inp&&inp.value.trim()) || (S.funWeb&&S.funWeb.topic) || '';
    if(!topic){ toast('Введи тему — о чём найти'); if(inp) inp.focus(); return; }
    if(!cloudGuard('поиск в интернете')) return;
    if(isStandalone()){ toast('Поиск в интернете работает в онлайн-копии Арми — один файл без сервера его не умеет'); return; }
    if(!navigator.onLine){ toast('Интернета нет — поищи, когда появится сеть. Встроенные факты и книги работают офлайн'); return; }
    S.funWeb={topic, busy:true, digest:'', items:[], error:'', saved:false, kind};
    render();
    try{
      const r=await fetch('/api/search/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:topic, kind})});
      const data=await r.json();
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      S.funWeb={topic, busy:false, digest:data.digest||'', items:data.items||[], error:data.digest?'':'(нейронка не собрала пересказ — но источники ниже)', saved:false, kind};
    }catch(err){
      S.funWeb={topic, busy:false, digest:'', items:[], error:'Поиск не удался: '+(err.message||'ошибка сети')+'. Попробуй ещё раз — или почитай встроенные факты и книги, они работают офлайн.', saved:false, kind};
    }
    render();
  },
  funWebSave(){
    const w=S.funWeb; if(!w||!w.digest){ toast('Нечего сохранять'); return; }
    FUN_WEB_SAVED.unshift({topic:w.topic+' · '+(w.kind==='book'?'книги':'факты'), digest:w.digest, date:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'}), items:w.items});
    if(FUN_WEB_SAVED.length>30) FUN_WEB_SAVED.pop();
    saveJSON('armi_web_saved', FUN_WEB_SAVED);
    w.saved=true; render(); toast('Сохранено — читай офлайн во «Всё сохранённое»');
  },
  funNext(arg){

/* ══════════ СЕКРЕТНЫЙ РЕЖИМ ══════════
   Закрытые разделы живут в том же интерфейсе, что и открытый Арми: после входа
   в меню рядом с обычными появляются «Чаты», «Заметки», «Фото», «Музыка»,
   «Второй контур» и «Синхронизация» закрытой зоны. Отдельного окна нет.
   Шифрование: AES-256-GCM, ключ из пароля (PBKDF2, 150k итераций).
   Мастер-ключ хранится в двух слотах (пароль + код восстановления) — как в LUKS.
   Пароль-приманка открывает правдоподобную «пустую» зону.
   Синхронизация ПК↔телефон — отдельным ключом, только по явному разрешению. */
const Secret = (() => {
const B = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
};
async function derive(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sha(s){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return B.enc(d);
}
/* Проверочный хэш пароля-приманки: тот же PBKDF2 (150k), что и у основных слотов.
   Раньше был голый SHA-256 → приманку подбирали на порядки быстрее основного пароля. */
async function kdfHash(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode('decoy:'+salt), iterations:150000, hash:'SHA-256'}, km, 256);
  return B.enc(bits);
}
async function mkDecoyMeta(decoyPass){
  const salt = crypto.randomUUID();
  /* Приманка есть ВСЕГДА: если пользователь её не задал, кладём случайный хэш — по метаданным не видно, настроена ли она */
  const vhash = decoyPass ? await kdfHash(decoyPass, salt) : B.enc(crypto.getRandomValues(new Uint8Array(32)));
  return {salt, vhash, kdf:'pbkdf2'};
}
async function decoyMatches(m, pass){
  if(!m.decoy) return false;
  if(m.decoy.kdf==='pbkdf2') return (await kdfHash(pass, m.decoy.salt)) === m.decoy.vhash;
  /* старый формат (SHA-256): проверяем и сразу переводим на PBKDF2 */
  if((await sha(m.decoy.salt + pass)) === m.decoy.vhash){
    try{ const m2 = meta(); if(m2 && m2.decoy){ m2.decoy.kdf='pbkdf2'; m2.decoy.vhash = await kdfHash(pass, m2.decoy.salt); saveJSON(META_K, m2); } }catch(e){}
    return true;
  }
  return false;
}
const META_K='armi_sec_meta', DATA_K='armi_sec_data', DECOY_K='armi_decoy_data', SYNC_K='armi_sec_sync';
function meta(){ return loadJSON(META_K, null); }
function status(){ return {configured: !!meta()}; }

let MK=null;            /* мастер-ключ в памяти после разблокировки */
let DATA=null;          /* расшифрованные секретные данные */
let MODE='real';        /* real | decoy */
let LOCK_T=null;

const DECOY_DEFAULT = {
  notes:[{id:'d1', title:'Пароль от вайфая', content:'home_2026_net', tags:['дом'], updatedAt:'окт'}],
  chats:[{id:'dc1', title:'Личное', msgs:[{role:'ai', content:'Привет! Это закрытая зона.', time:'09:00'}]}],

function freshData(){
  return { notes:[], chats:[{id:uid('sc'), title:'Личное', msgs:[{role:'ai', content:'Секретный чат. История хранится только в зашифрованном контуре и не покидает устройство.', time:nowHM()}]}],
    photos:[], music:[{id:'sm1', title:'Ночной плейлист', artist:'закрытая зона', seconds:240}], contour:{model:'local', key:'', msgs:[]}, created:new Date().toISOString() };
}
function data(){ return MODE==='decoy' ? loadJSON(DECOY_K, DECOY_DEFAULT) : DATA; }
async function persistData(){
  if(MODE!=='real' || !MK) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey('raw', MK, 'AES-GCM', false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(DATA)));
  saveJSON(DATA_K, {iv:B.enc(iv), ct:B.enc(ct)});
}
async function decryptData(mk){
  const blob = loadJSON(DATA_K, null); if(!blob) return freshData();
  const key = await crypto.subtle.importKey('raw', mk, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(blob.iv)}, key, B.dec(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function openSlot(secret, slot){
  try{
    const key = await derive(secret, B.dec(slot.salt));
    const mk = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(slot.iv)}, key, B.dec(slot.ct));
    return new Uint8Array(mk);
  }catch(e){ return null; }
}

}

/* ── ЭКСПОРТ / ИМПОРТ (синхронизация) ── */
async function exportBackup(){
  if(MODE!=='real'){ toast('Экспорт недоступен'); return; }
  const syncKey = store.getItem(SYNC_K); if(!syncKey){ toast('Ключ синхронизации не найден'); return; }
  await persistData();
  const m = meta();
  const payload = { meta:m, data: loadJSON(DATA_K, null) };
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await derive(syncKey, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(payload)));
  const out = { app:'armi', v:3, kind:'secret-backup', salt:B.enc(salt), iv:B.enc(iv), ct:B.enc(ct) };
  const blob = new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='armi-secret-backup.armisecret'; a.click();
  toast('Зашифрованный бэкап скачан');
}
function importModal(){
  modal('<h3>'+ic('up')+' Импорт секретного бэкапа</h3>'+
  '<div class="tiny" style="margin:4px 0 12px">Файл .armisecret с другого устройства + ключ синхронизации. Текущие секретные данные будут заменены.</div>'+
  '<input type="file" id="si-file" accept=".armisecret,.json" style="padding:7px">'+
  '<input id="si-key" placeholder="Ключ синхронизации" style="margin-top:8px" autocomplete="off">'+
  '<div id="si-err" class="banner red mt10" style="display:none"></div>'+
  '<div class="row mt14" style="gap:8px"><button class="btn btn-amber" style="flex:1" onclick="Secret.importRun()">Расшифровать и заменить</button><button class="btn" onclick="modalBack()">Отмена</button></div>');
}
async function importRun(){
  const err=document.getElementById('si-err');
  const f=document.getElementById('si-file').files[0], keyStr=document.getElementById('si-key').value.trim();
  const fail=t=>{ err.style.display='block'; err.textContent=t; };
  if(!f) return fail('Выбери файл');
  if(!keyStr) return fail('Введи ключ синхронизации');
  let out; try{ out = JSON.parse(await f.text()); }catch(e){ return fail('Файл повреждён'); }
  if(out.kind!=='secret-backup') return fail('Это не бэкап закрытого режима');
  try{
    const key = await derive(keyStr, B.dec(out.salt));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(out.iv)}, key, B.dec(out.ct));
    const payload = JSON.parse(new TextDecoder().decode(pt));
    saveJSON(META_K, payload.meta); saveJSON(DATA_K, payload.data);
    closeModal(); toast('Импортировано. Войди паролем с того устройства');
    loginModal();
  }catch(e){ return fail('Ключ не подходит или файл повреждён'); }
}

async function photoAdd(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  try{
    const rd = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    const img = await new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=rd; });
    if(!img){ toast('Не удалось прочитать файл'); return; }
    const max=1280, k=Math.min(1, max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    data().photos.unshift({id:uid('p'), d:cv.toDataURL('image/jpeg',0.72), t:new Date().toISOString()});
    await persistData(); render(); toast('Фото зашифровано и сохранено');
  }catch(e){ toast('Слишком большой файл'); }
}

/* ═══ V7 MODULE: 20-data-v7.js ═══ */
/* ═══════════════════════════════════════════════════════════════════
   V7 · СЛОЙ ДАННЫХ: мягкое удаление + секретная корзина (30 дней)
   ─────────────────────────────────────────────────────────────────
   Подход поверх v6.6 (без смены схемы IndexedDB — блобы не трогаем):
   • каждый удаляемый элемент получает deletedAt (timestamp) —
     он остаётся в DB.media / DB.lectures / DB.notes / DB.myvideos,
     но все обычные выборки отфильтровывают deletedAt
   • корзина — раздел strash в секретной зоне: показывает всё
     с deletedAt, восстановление в 1 клик, авто-удаление через 30 дней
   • при полном удалении (авто-очистка) — убираем запись и блоб из IDB
   Хранение: DB.trashMeta (localStorage, armi_trash) для записей без
   места в схеме; сами объекты помечаем полем deletedAt и храним
   отдельный массив удалённых копий (чтобы восстановить даже после
   перезаписи основного массива) — см. TRASH.
   ═══════════════════════════════════════════════════════════════════ */

const TRASH_DAYS = 30;

/* копии удалённых объектов по типам:
   media | lecture | note | video | folder */
const TRASH = loadJSON('armi_trash', []);

function trashPush(kind, obj, from){
  TRASH.unshift({
    kind, obj: JSON.parse(JSON.stringify(obj)),
    from: from || '',                  /* откуда удалено: раздел */
    deletedAt: Date.now(),
  });
  saveJSON('armi_trash', TRASH);
}
function trashDaysLeft(ts){
  return Math.max(0, Math.ceil((ts + TRASH_DAYS * 864e5 - Date.now()) / 864e5));
}
function trashIsExpired(ts){ return Date.now() - ts >= TRASH_DAYS * 864e5; }

/* ── фильтры для обычных выборок (скрывают удалённое) ── */
/* медиа: DB.media, но без тех, чей id лежит в корзине */
const trashMediaIds = () => new Set(TRASH.filter(t => t.kind === 'media').map(t => t.obj.id));
const trashLectureIds = () => new Set(TRASH.filter(t => t.kind === 'lecture').map(t => t.obj.id));
const trashNoteIds = () => new Set(TRASH.filter(t => t.kind === 'note').map(t => t.obj.id));
const trashVideoIds = () => new Set(TRASH.filter(t => t.kind === 'video').map(t => t.obj.id));
/* live-выборки v7 (используются проводником и экранами) */
const liveMediaV7 = kind => DB.media.filter(m => m.kind === kind && !trashMediaIds().has(m.id));
const liveLecturesV7 = () => DB.lectures.filter(l => !trashLectureIds().has(l.id));
const liveNotesV7 = () => DB.notes.filter(n => !trashNoteIds().has(n.id));
const liveVideosV7 = () => DB.myvideos.filter(v => !trashVideoIds().has(v.id));

/* ── МЯГКОЕ УДАЛЕНИЕ (из любого раздела → корзина секретной зоны) ── */
async function trashMedia(arg){
  const m = DB.media.find(x => x.id === arg);
  if(!m) return;
  /* остановить плеер, если играет этот файл */
  if(PLAYER.fileId === arg){ PLAYER.stopAll(); PLAYER.mode = null; PLAYER.fileId = null; S.music.playing = false; S.music.progress = 0; }
  if(PLAYER.queue){ PLAYER.queue = PLAYER.queue.filter(x => x !== arg); }
  if(PLAYER.custom && PLAYER.custom.id === arg){ PLAYER.stopAll(); PLAYER.mode = null; PLAYER.custom = null; }
  trashPush('media', m, 'Медиа');
  /* вычистить из плейлистов */
  DB.playlists.forEach(p => { p.items = (p.items || []).filter(i => i !== arg); });
  /* убрать из основного массива: блоб остаётся в IndexedDB до авто-очистки */
  DB.media = DB.media.filter(x => x.id !== arg);
  saveDB();
  if(MEDIA_URLS[arg]){ try{ URL.revokeObjectURL(MEDIA_URLS[arg]); }catch(e){} delete MEDIA_URLS[arg]; }
  render();
  toast('В корзину (закрытая зона) · возврат в течение 30 дней');
}
async function trashLecture(arg){
  const l = DB.lectures.find(x => x.id === arg);
  if(!l) return;
  trashPush('lecture', l, 'Записи');
  DB.lectures = DB.lectures.filter(x => x.id !== arg);
  saveDB(); render();
  toast('Запись в корзине · возврат в течение 30 дней');
}
async function trashNote(arg){
  const n = DB.notes.find(x => x.id === arg);
  if(!n) return;
  trashPush('note', n, 'Заметки');
  DB.notes = DB.notes.filter(x => x.id !== arg);
  if(S.noteOpen === arg) S.noteOpen = null;
  saveDB(); render();
  toast('Заметка в корзине · возврат в течение 30 дней');
}
async function trashVideo(arg){
  const v = DB.myvideos.find(x => x.id === arg);
  if(!v) return;
  trashPush('video', v, 'Видео');
  DB.myvideos = DB.myvideos.filter(x => x.id !== arg);
  saveDB(); render();
  toast('Ссылка в корзине · возврат в течение 30 дней');
}
/* папка целиком (зона Folders): все элементы папки + сама папка */
async function trashFolderZone(zone, fid){
  const z = Folders.zones[zone];
  if(!z) return;
  const folder = Folders.list(zone).find(f => f.id === fid);
  if(!folder) return;
  /* элементы папки — по одному в корзину */
  const items = z.items().filter(o => (o.folder || null) === (fid || null));
  const kindMap = { lectures:'lecture', photos:'media', notes:'note', music:'media', books:'book', videos:'video' };
  for(const o of items){
    trashPush(kindMap[zone] || 'media', o, folder.name);
    if(zone === 'lectures') DB.lectures = DB.lectures.filter(x => x.id !== o.id);
    else if(zone === 'notes') DB.notes = DB.notes.filter(x => x.id !== o.id);
    else if(zone === 'photos' || zone === 'music') DB.media = DB.media.filter(x => x.id !== o.id);
    else if(zone === 'books') DB.books = DB.books.filter(x => x.id !== o.id);
    else if(zone === 'videos') DB.myvideos = DB.myvideos.filter(x => x.id !== o.id);
  }
  /* сама папка */
  trashPush('folder', { zone, folder }, folder.name);
  Folders.save(zone, Folders.list(zone).filter(f => f.id !== fid));
  if(S.folder && S.folder.id === fid) S.folder = null;
  saveDB(); render();
  toast('Папка в корзине · ' + items.length + ' эл. · 30 дней');
}

/* ── ВОССТАНОВЛЕНИЕ ── */
async function trashRestore(idx){
  const t = TRASH[idx];
  if(!t) return;
  if(t.kind === 'media'){ DB.media.unshift(t.obj); }
  else if(t.kind === 'lecture'){ DB.lectures.unshift(t.obj); }
  else if(t.kind === 'note'){ DB.notes.unshift(t.obj); }
  else if(t.kind === 'video'){ DB.myvideos.unshift(t.obj); }
  else if(t.kind === 'book'){ DB.books.unshift(t.obj); }
  else if(t.kind === 'folder'){
    const list = Folders.list(t.obj.zone);
    if(!list.some(f => f.id === t.obj.folder.id)) list.push(t.obj.folder);
    Folders.save(t.obj.zone, list);
  }
  TRASH.splice(idx, 1);
  saveDB(); saveJSON('armi_trash', TRASH);
  render();
  toast('Восстановлено: «' + (t.obj.name || t.obj.title || t.obj.folder && t.obj.folder.name || 'элемент') + '»');
}

/* ── АВТООЧИСТКА: запускать при старте и раз в час ── */
async function trashAutoPurge(){
  const expired = TRASH.filter(t => trashIsExpired(t.deletedAt));
  if(!expired.length) return 0;
  /* удалить блобы медиа из IndexedDB навсегда */
  for(const t of expired){
    if(t.kind === 'media'){
      try{ await IDB.del(t.obj.id); }catch(e){}
      if(MEDIA_URLS[t.obj.id]){ try{ URL.revokeObjectURL(MEDIA_URLS[t.obj.id]); }catch(e){} delete MEDIA_URLS[t.obj.id]; }
    }
    if(t.kind === 'lecture' && t.obj.recId){
      try{ await IDB.del('lec_' + t.obj.id); }catch(e){}
    }
  }
  const ids = new Set(expired.map(t => t));
  for(let i = TRASH.length - 1; i >= 0; i--){
    if(expired.includes(TRASH[i])) TRASH.splice(i, 1);
  }
  saveJSON('armi_trash', TRASH);
  return expired.length;
}
/* фоновая проверка: раз в час */
setInterval(() => { trashAutoPurge().then(n => { if(n) toast('Корзина: безвозвратно удалено ' + n); }); }, 3600e3);

/* ── подмена жёстких удалений v6.6 на мягкие ── */
/* mediaDel (фото/музыка/видео-файлы) → корзина */
const _mediaDelV66 = mediaDel;
mediaDel = async function(arg){
  const inTrash = TRASH.some(t => t.kind === 'media' && t.obj.id === arg);
  if(inTrash){ _mediaDelV66(arg); return; }   /* уже в корзине — удаляем как раньше */
  await trashMedia(arg);                       /* первый раз — мягко, в корзину */
};

/* ═══ V7 MODULE: 30-expl.js ═══ */
/* ═══════════════════════════════════════════════════════════════════
   V7 · EXPL — ДВИЖОК ПРОВОДНИКА (Windows Explorer style) поверх v6.6
   ─────────────────────────────────────────────────────────────────
   Один движок на все медиа-разделы. Использует существующие:
   • Folders-зоны v6.6 (armi_folders_photos/music/lectures/books/notes)
     — плоские папки с цветом; расширяем до вложенности через
     parentId у папок (обратно совместимо: без parentId — корень)
   • DB.media / DB.lectures / DB.myvideos — элементы с полем folder
   • IDB-блобы и MEDIA_URLS для превью
   Возможности: дерево слева, сетка/список, сортировка, мультивыделение
   (Ctrl/Shift/лассо), DnD в папки (мышь + long-press на тач), контекстное
   меню (открыть/переименовать/переместить/редактировать/в корзину),
   перемещение элементов между папками, массовое удаление в корзину.
   ═══════════════════════════════════════════════════════════════════ */

const EXPL = {
  state: {},   /* zone -> {cwd, view, sort, sel[], anchor, expanded{}} */
  st(zone){
    if(!this.state[zone]) this.state[zone] = {
      cwd: null, view: 'grid', sort: 'date', sel: [], anchor: null, expanded: {},
    };
    return this.state[zone];
  },
};

/* ── конфиги зон (заполняются в 40-screens-v7) ── */
const EXPL_CFG = {};

/* ═══ УТИЛИТЫ ПАПОК (расширение Folders v6.6 до вложенности) ═══ */
function exFolders(zone){ return Folders.list(zone); }
/* дети папки (null = корень) */
function exChildren(zone, parentId){
  return exFolders(zone).filter(f => (f.parentId || null) === (parentId || null) && f.id !== parentId);
}
/* путь папки вверх */
function exPath(zone, id){
  const path = [];
  let cur = id ? exFolders(zone).find(f => f.id === id) : null;
  let guard = 0;
  while(cur && guard++ < 50){ path.unshift(cur); cur = cur.parentId ? exFolders(zone).find(f => f.id === cur.parentId) : null; }
  return path;
}
/* количество элементов в папке напрямую */
function exCount(zone, fid){
  const z = Folders.zones[zone];
  const target = fid || null;
  return z ? z.items().filter(o => (o.folder || null) === target).length : 0;
}
/* элементы папки (элементы зоны с folder===fid), без удалённых в корзину.
   folder может быть undefined (легаси v6.6) — нормализуем к null */
function exItems(zone, fid){
  const z = Folders.zones[zone];
  let items = z ? z.items() : [];
  const target = fid || null;
  const dead = zone === 'lectures' ? trashLectureIds() : (zone === 'photos' || zone === 'music') ? trashMediaIds()
    : zone === 'notes' ? trashNoteIds() : zone === 'videos' ? trashVideoIds() : new Set();
  return items.filter(o => (o.folder || null) === target && !dead.has(o.id));
}
/* сортированное содержимое: папки + элементы */
function exContents(zone, folderId){
  const st = EXPL.st(zone);
  const folders = exChildren(zone, folderId);
  const items = exItems(zone, folderId);
  const byName = (a, b) => (a.name || a.title || '').localeCompare(b.name || b.title || '', 'ru');
  const added = o => o.dateTs || o.t || 0;
  const cmp = {
    name: byName,
    date: (a, b) => (b.dateTs || added(b)) - (a.dateTs || added(a)),
    type: (a, b) => String(a.ext || a.kind || '').localeCompare(String(b.ext || b.kind || '')) || byName(a, b),
    size: (a, b) => (b.size || 0) - (a.size || 0),
  }[st.sort] || (() => 0);
  folders.sort(byName);
  items.sort(cmp);
  return { folders, items };
}

/* ═══ РЕНДЕР ПРОВОДНИКА ═══ */

/* ── ДЕРЕВО ── */
function exTreeHTML(zone, parentId, depth){
  const st = EXPL.st(zone);
  const kids = exChildren(zone, parentId);
  let html = '';
  /* корневая кнопка */
  if(depth === 0){
    html += '<button class="tnode' + (!st.cwd ? ' act' : '') + '" data-expl="goRoot">' +
      '<span class="tn-tw leaf">' + ic('chevR') + '</span>' + ic('grid') +
      '<span class="tn-lbl">Все ' + (EXPL_CFG[zone].rootLabel || 'файлы') + '</span>' +
      '<span class="tn-cnt">' + exItems(zone, null).length + '</span></button>';
  }
  for(const f of kids){
    const open = !!st.expanded[f.id];
    const hasKids = exChildren(zone, f.id).length > 0;
    html += '<button class="tnode' + (st.cwd === f.id ? ' act' : '') + (open ? ' open' : '') + '" ' +
      'data-expl="treeGo" data-fid="' + f.id + '" style="padding-left:' + (8 + depth * 14) + 'px">' +
      '<span class="tn-tw' + (hasKids ? '' : ' leaf') + '">' + ic('chevR') + '</span>' +
      '<span style="display:flex;align-items:center;gap:6px;min-width:0;flex:1"><span class="dot" style="background:' + (f.c || '#fbbf24') + '"></span>' +
      '<span class="tn-lbl">' + esc(f.name) + '</span></span>' +
      '<span class="tn-cnt">' + exCount(zone, f.id) + '</span>' +
      '<span class="tn-x" data-expl="folderMenu" data-fid="' + f.id + '" title="Меню папки">' + ic('pen') + '</span>' +
    '</button>';
    if(open) html += exTreeHTML(zone, f.id, depth + 1);
  }
  return html;
}

}

/* ═══ ВЫДЕЛЕНИЕ ═══ */
function exOrderedIds(zone){
  const { folders, items } = exContents(zone, EXPL.st(zone).cwd);
  return [...folders.map(f => 'f:' + f.id), ...items.map(o => o.id)];
}
function exClick(zone, oid, ev){
  const st = EXPL.st(zone);
  if(ev && (ev.ctrlKey || ev.metaKey)){
    st.sel = st.sel.includes(oid) ? st.sel.filter(x => x !== oid) : [...st.sel, oid];
    st.anchor = oid;
  } else if(ev && ev.shiftKey && st.anchor){
    const ids = exOrderedIds(zone);
    const a = ids.indexOf(st.anchor), b = ids.indexOf(oid);
    if(a >= 0 && b >= 0){
      const [lo, hi] = a < b ? [a, b] : [b, a];
      st.sel = ids.slice(lo, hi + 1);
    }
  } else {
    st.sel = (st.sel.length === 1 && st.sel[0] === oid) ? [] : [oid];
    st.anchor = oid;
  }
  render();
}

/* ═══ КОНТЕКСТНОЕ МЕНЮ ═══ */
let EXCTX = null;   /* {x, y, zone, oid, fid, items[]} */

function exCtxHTML(){

function exCtxClose(){ if(EXCTX){ EXCTX = null; } }

/* ═══ DnD ═══ */
const EXDRAG = { ids:[], over:null, ghost:null, longT:null, startX:0, startY:0, fromLongPress:false, moved:false };

function activeZoneV7(){
  const el = document.querySelector('.expl[data-zone]');
  return el ? el.getAttribute('data-zone') : null;
}
function exFindItem(zone, id){
  if(!zone || !id) return null;
  const z = Folders.zones[zone];
  return z ? z.items().find(o => o.id === id) : null;
}
function exDragStart(ids, x, y){
  EXDRAG.ids = ids.slice();
  if(!EXDRAG.ghost){
    EXDRAG.ghost = document.createElement('div');
    EXDRAG.ghost.className = 'drag-ghost';
    document.body.appendChild(EXDRAG.ghost);
  }
  const first = ids[0];
  const zone = activeZoneV7();
  const label = ids.length > 1 ? ('Выбрано: ' + ids.length)
    : first && first.startsWith('f:')
      ? ((exFolders(zone).find(f => f.id === first.slice(2)) || {}).name || 'Папка')
      : exTileLabel(exFindItem(zone, first) || {});
  EXDRAG.ghost.innerHTML = ic('folder') + esc(String(label)).slice(0, 42);
  EXDRAG.ghost.style.display = 'flex';
  exDragMove(x, y);
}
function exDragMove(x, y){
  if(!EXDRAG.ghost) return;
  EXDRAG.ghost.style.left = (x + 14) + 'px';
  EXDRAG.ghost.style.top = (y + 12) + 'px';
  const under = document.elementFromPoint(x, y);
  const target = under && (under.closest('.tnode[data-fid]') || under.closest('.etile'));
  document.querySelectorAll('.droptarget').forEach(el => el.classList.remove('droptarget'));
  EXDRAG.over = null;
  if(target){
    let fid = target.getAttribute('data-fid');
    if(!fid){
      const oid = target.getAttribute('data-oid') || '';
      if(oid.startsWith('f:')) fid = oid.slice(2);
    }
    if(fid && !EXDRAG.ids.includes('f:' + fid)){
      target.classList.add('droptarget');
      EXDRAG.over = fid;
    }
  }
}
function exDragEnd(){
  if(EXDRAG.ghost){ EXDRAG.ghost.remove(); EXDRAG.ghost = null; }
  document.querySelectorAll('.droptarget').forEach(el => el.classList.remove('droptarget'));
  EXDRAG.over = null; EXDRAG.ids = [];
}
/* ядро перемещения: список oid → папка toFid (null = корень) */
async function exMoveIds(zone, ids, toFid){
  if(!ids.length) return 0;
  const z = Folders.zones[zone];
  let moved = 0;
  for(const oid of ids){
    if(oid.startsWith('f:')){
      const f = exFolders(zone).find(x => x.id === oid.slice(2));
      /* защита от цикла: цель не внутри переносимой папки */
      if(f && f.id !== toFid && f.parentId !== toFid && !exPath(zone, toFid).some(p => p.id === f.id)){
        f.parentId = toFid; moved++;
      }
    } else {
      const o = z ? z.items().find(x => x.id === oid) : null;
      if(o){ o.folder = toFid; moved++; }
    }
  }
  Folders.save(zone, exFolders(zone));
  saveDB();
  const st = EXPL.st(zone);
  if(toFid) st.expanded[toFid] = true;
  return moved;
}
async function exMoveSel(zone, toFid){
  const st = EXPL.st(zone);
  const moved = await exMoveIds(zone, st.sel.slice(), toFid);
  st.sel = [];
  render();
  if(moved) toast(moved > 1 ? ('Перемещено: ' + moved) : 'Перемещено в папку');
}
/* массовое удаление выделения в корзину */
async function exTrashSel(zone){
  const st = EXPL.st(zone);
  const ids = st.sel.slice();
  if(!ids.length) return;
  let n = 0;
  for(const oid of ids){
    if(oid.startsWith('f:')){ await trashFolderZone(zone, oid.slice(2)); n++; }
    else if(zone === 'lectures'){ await trashLecture(oid); n++; }
    else if(zone === 'photos' || zone === 'music'){ await trashMedia(oid); n++; }
    else if(zone === 'notes'){ await trashNote(oid); n++; }
    else if(zone === 'videos'){ const o = DB.myvideos.find(v => v.id === oid); if(o){ await trashVideo(oid); n++; } }
  }
  st.sel = [];
  render();
  toast('В корзине: ' + n + ' · 30 дней на возврат');
}

function exRenameSave(zone, oid){

function exBgMenu(zone, x, y){

    x, y, zone, oid: null,
    items: [
      { t:'Новая папка', ic:'folder', act:'folderNew' },

/* выполнение пункта контекстного меню */
function exCtxRun(zone, i){
  const ctx = EXCTX;
  if(!ctx) return;
  const it = ctx.items[Number(i)];
  const oid = ctx.oid;
  exCtxClose();
  if(!it) return;
  if(it.act === 'open'){ exOpen(zone, oid); return; }
  if(it.act === 'openFolder'){ const st = EXPL.st(zone); st.cwd = ctx.fid || (oid ? oid.slice(2) : null); st.sel = []; render(); return; }
  if(it.act === 'renameFolder'){ exRenameModal(zone, oid); return; }
  if(it.act === 'folderColor'){ exFolderColorModal(zone, oid.slice(2)); return; }
  if(it.act === 'rename'){ exRenameModal(zone, oid); return; }
  if(it.act === 'move'){ exMoveDialog(zone); return; }
  if(it.act === 'edit'){ const cfg = EXPL_CFG[zone]; if(cfg && cfg.onEdit) cfg.onEdit(oid); return; }
  if(it.act === 'trash'){
    if(oid.startsWith('f:')) trashFolderZone(zone, oid.slice(2));
    else if(zone === 'lectures') trashLecture(oid);
    else if(zone === 'photos' || zone === 'music') trashMedia(oid);
    else if(zone === 'notes') trashNote(oid);
    else if(zone === 'videos') trashVideo(oid);
    return;
  }
  if(it.act === 'trashFolder'){ trashFolderZone(zone, ctx.fid || oid.slice(2)); return; }
  if(it.act === 'folderNew'){ exFolderNewModal(zone); return; }
  if(it.act === 'selAll'){ const st = EXPL.st(zone); st.sel = exOrderedIds(zone); render(); return; }
  if(it.act === 'selClear'){ const st = EXPL.st(zone); st.sel = []; render(); return; }
}

/* открытие элемента (двойной клик / меню) */
function exOpen(zone, oid){
  const cfg = EXPL_CFG[zone];
  if(!cfg || !oid) return;
  if(oid.startsWith('f:')){
    const st = EXPL.st(zone);
    st.cwd = oid.slice(2);
    st.expanded[st.cwd] = true;
    st.sel = [];
    render();
    return;
  }
  const st = EXPL.st(zone);
  st.sel = [];
  if(cfg.onOpen) cfg.onOpen(oid, exItems(zone, st.cwd || null));
  else render();
}

/* ═══ ПРИВЯЗКА СОБЫТИЙ (вызывается из afterRender) ═══ */
function explBindV7(){
  const root = document.querySelector('.expl[data-zone]');
  if(!root) return;
  const zone = root.getAttribute('data-zone');
  const area = root.querySelector('.expl-area');
  const tree = root.querySelector('.expl-tree');

  /* делегированный обработчик data-expl на document — вешаем один раз.
     ВАЖНО: слушатель регистрируется с capture=true, чтобы срабатывать
     ДО базового делегата v6.6 (иначе modalBack на бэкдропе закрывает
     модалку раньше, чем наш обработчик увидит кнопку) */
  if(!window.__explDelegated){
    window.__explDelegated = true;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-expl]');
      if(!el) return;
      const act = el.getAttribute('data-expl');
      if(['tile','area'].includes(act)) return;   /* плитки обрабатывает area */
      /* не давать базовому делегату data-act сработать по этому клику */
      e.stopPropagation();
      const z = el.getAttribute('data-zone') || activeZoneV7();
      const fid = el.getAttribute('data-fid');
      if(act === 'sort'){ const st = EXPL.st(z); st.sort = el.value; render(); }
      else if(act === 'viewToggle'){ const st = EXPL.st(z); st.view = st.view === 'grid' ? 'list' : 'grid'; render(); }
      else if(act === 'folderNew'){ exFolderNewModal(z); }
      else if(act === 'folderNewSave'){ exFolderNewSave(z); }
      else if(act === 'goRoot'){ const st = EXPL.st(z); st.cwd = null; st.sel = []; render(); }
      else if(act === 'treeGo'){
        const st = EXPL.st(z);
        if(e.target.closest('.tn-tw') && !e.target.closest('.tn-tw.leaf')){
          st.expanded[fid] = !st.expanded[fid];
          render(); return;
        }
        st.cwd = fid; st.sel = []; st.expanded[fid] = true; render();
      }
      else if(act === 'folderMenu'){ e.preventDefault(); exFolderMenu(z, fid, e.clientX, e.clientY); }
      else if(act === 'rename'){ exRenameModal(z, el.getAttribute('data-oid')); }
      else if(act === 'renameSave'){ exRenameSave(z, el.getAttribute('data-oid')); }
      else if(act === 'moveDialog'){ exMoveDialog(z); }
      else if(act === 'moveTo'){ exMoveSel(z, fid || null); closeModal(); }
      else if(act === 'selAll'){ const st = EXPL.st(z); st.sel = exOrderedIds(z); render(); }
      else if(act === 'selClear'){ const st = EXPL.st(z); st.sel = []; render(); }
      else if(act === 'trashSel'){ exTrashSel(z); }
      else if(act === 'ctxItem'){ exCtxRun(z, el.getAttribute('data-i')); }
      else if(act === 'folderColor'){ exFolderColorModal(z, fid); }
      else if(act === 'folderColorSet'){
        const f = exFolders(z).find(x => x.id === fid);
        if(f){ f.c = el.getAttribute('data-c'); Folders.save(z, exFolders(z)); }
        closeModal(); render();
      }
    }, true);   /* capture — раньше базового */
    /* закрытие контекстного меню по клику мимо */
    document.addEventListener('mousedown', e => {
      const m = document.getElementById('exctx');
      if(m && !m.contains(e.target) && !e.target.closest('[data-expl="folderMenu"]')){ exCtxClose(); render(); }
    }, true);
  }

  if(!area) return;

  /* правый клик: плитка → меню элемента, фон → меню раздела */
  area.oncontextmenu = e => {
    e.preventDefault();
    const tile = e.target.closest('[data-expl="tile"]');
    if(tile) exCtxOpen(e.clientX, e.clientY, zone, tile.getAttribute('data-oid'));
    else exBgMenu(zone, e.clientX, e.clientY);
  };
  /* одиночный клик — выбор (после drag — пропуск); двойной клик — открыть.
     клик откладываем на 220мс, чтобы даблклик не «мигал» выделением */
  let clickT = null;
  area.onclick = e => {
    const tile = e.target.closest('[data-expl="tile"]');
    if(!tile) return;
    if(EXDRAG.moved){ EXDRAG.moved = false; return; }
    const oid = tile.getAttribute('data-oid');
    const ev = e;
    clearTimeout(clickT);
    clickT = setTimeout(() => exClick(zone, oid, ev), 220);
  };
  area.ondblclick = e => {
    const tile = e.target.closest('[data-expl="tile"]');
    if(!tile) return;
    clearTimeout(clickT);
    exOpen(zone, tile.getAttribute('data-oid'));
  };

  /* лассо (мышь, десктоп) */
  area.onmousedown = e => {
    if(e.button !== 0 || e.target.closest('[data-expl="tile"]')) return;
    if(resolveView() === 'phone') return;
    const st = EXPL.st(zone);
    if(!e.ctrlKey && !e.shiftKey && st.sel.length){ st.sel = []; render(); }
    const x0 = e.clientX, y0 = e.clientY;
    let started = false, lassoEl = null;
    const move = ev => {
      if(!started && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) > 7){
        started = true;
        lassoEl = document.createElement('div');
        lassoEl.className = 'lasso';
        document.body.appendChild(lassoEl);
      }
      if(!started) return;
      const x1 = Math.min(x0, ev.clientX), y1 = Math.min(y0, ev.clientY);
      const x2 = Math.max(x0, ev.clientX), y2 = Math.max(y0, ev.clientY);
      Object.assign(lassoEl.style, { left:x1 + 'px', top:y1 + 'px', width:(x2 - x1) + 'px', height:(y2 - y1) + 'px' });
      area.querySelectorAll('[data-expl="tile"]').forEach(t => {
        const r = t.getBoundingClientRect();
        const hit = !(r.right < x1 || r.left > x2 || r.bottom < y1 || r.top > y2);
        const oid = t.getAttribute('data-oid');
        if(hit && !st.sel.includes(oid)) st.sel.push(oid);
        if(!hit) st.sel = st.sel.filter(x => x !== oid);
      });
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if(lassoEl) lassoEl.remove();
      if(started) render();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };

  /* HTML5 DnD мышью */
  area.ondragstart = e => {
    const tile = e.target.closest('[data-expl="tile"]');
    if(!tile) return;
    const st = EXPL.st(zone);
    const oid = tile.getAttribute('data-oid');
    EXDRAG.ids = st.sel.includes(oid) ? st.sel.slice() : [oid];
    EXDRAG.moved = true;
    tile.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain', EXDRAG.ids.join(',')); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
  };
  const dropHandler = async e => {
    e.preventDefault();
    if(!EXDRAG.ids.length) return;
    const to = EXDRAG.over;
    const ids = EXDRAG.ids.slice();
    EXDRAG.ids = [];
    const moved = await exMoveIds(zone, ids, to);
    render();
    if(moved) toast(moved > 1 ? ('Перемещено: ' + moved) : 'Перемещено в папку');
  };
  const overHandler = e => {
    e.preventDefault();
    const host = e.currentTarget;
    let target = e.target;
    let fid = null;
    if(host === tree){
      const node = target.closest('.tnode[data-fid]');
      if(node) fid = node.getAttribute('data-fid');
    } else {
      const tile = target.closest('.etile');
      if(tile){
        const oid = tile.getAttribute('data-oid') || '';
        if(oid.startsWith('f:')) fid = oid.slice(2);
      }
    }
    document.querySelectorAll('.droptarget').forEach(el => el.classList.remove('droptarget'));
    EXDRAG.over = null;
    if(fid && !EXDRAG.ids.includes('f:' + fid)){
      const el = host === tree
        ? host.querySelector('.tnode[data-fid="' + fid + '"]')
        : host.querySelector('.etile[data-oid="f:' + fid + '"]');
      if(el){ el.classList.add('droptarget'); EXDRAG.over = fid; }
    }
  };
  area.ondragover = overHandler;
  area.ondrop = dropHandler;
  area.ondragend = () => {
    area.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.droptarget').forEach(el => el.classList.remove('droptarget'));
  };
  if(tree){
    tree.ondragover = overHandler;
    tree.ondrop = dropHandler;
  }

  /* тач: долгое нажатие → выделение + перенос.
     Используем addEventListener (не on*-свойства): надёжнее после
     перерендеров и совместимо с синтетическими событиями */
  const TS = { passiv:false };
  area.addEventListener('touchstart', e => {
    const tile = e.target.closest('[data-expl="tile"]');
    if(!tile || e.touches.length !== 1) return;
    const st = EXPL.st(zone);
    const oid = tile.getAttribute('data-oid');
    const t0 = e.touches[0];
    EXDRAG.startX = t0.clientX; EXDRAG.startY = t0.clientY; EXDRAG.fromLongPress = false;
    clearTimeout(EXDRAG.longT);
    EXDRAG.longT = setTimeout(() => {
      if(!st.sel.includes(oid)){ st.sel = [oid]; render(); }
      EXDRAG.fromLongPress = true; EXDRAG.moved = true;
      if(navigator.vibrate) navigator.vibrate(25);
      exDragStart(st.sel, t0.clientX, t0.clientY);
    }, 430);
  }, TS);
  area.addEventListener('touchmove', e => {
    if(!e.touches.length) return;
    const t0 = e.touches[0];
    if(!EXDRAG.fromLongPress && Math.abs(t0.clientX - EXDRAG.startX) + Math.abs(t0.clientY - EXDRAG.startY) > 12){
      clearTimeout(EXDRAG.longT);
    }
    if(EXDRAG.ghost){ e.preventDefault(); exDragMove(t0.clientX, t0.clientY); }
  }, TS);
  area.addEventListener('touchend', e => {
    clearTimeout(EXDRAG.longT);
    if(EXDRAG.ghost && EXDRAG.fromLongPress){
      const over = EXDRAG.over;
      const ids = EXDRAG.ids.slice();
      exDragEnd();
      if(over !== null && ids.length){
        exMoveIds(zone, ids, over).then(moved => {
          render();
          if(moved) toast(moved > 1 ? ('Перемещено: ' + moved) : 'Перемещено в папку');
        });
      } else {
        render();   /* выделение осталось — можно добавлять тапами */
      }
      e.preventDefault();
    }
  }, TS);
}
