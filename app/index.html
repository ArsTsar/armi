<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="description" content="Арми 9 — ИИ-ассистент и органайзер: чат, задачи, заметки, запись лекций с расшифровкой, музыка, видео. Данные — на устройстве.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Арми">
<title>Арми 9</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d11; --panel:#0d0f13; --panel2:#12151c; --panel3:#151922; --panel4:#1c212b;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --amber:#fbbf24; --amber2:#f59e0b; --amber3:#fcd34d;
  --t1:#e4e4e7; --t2:#a1a1aa; --t3:#71717a; --t4:#52525b;
  --red:#f87171; --em:#34d399; --teal:#2dd4bf; --rose:#fb7185; --blue:#60a5fa; --violet:#a78bfa;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--t1);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s}
select{background:var(--panel3);cursor:pointer}
select option,select optgroup{background:var(--panel3);color:var(--t1)}
input:focus,textarea:focus,select:focus{border-color:rgba(251,191,36,.5)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
::placeholder{color:var(--t4)}
a{color:var(--amber3);text-decoration:none}
a:hover{text-decoration:underline}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── layout ── */
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:240px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;user-select:none}
.logo-tile{width:36px;height:36px;border-radius:12px;background:var(--amber);color:#0b0d11;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none}
.logo-tile.sm{width:28px;height:28px;font-size:15px;border-radius:9px}
.sb-nav{flex:1;overflow-y:auto;padding:0 10px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;color:var(--t2);text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--panel3);color:var(--t1)}
.nav-item.act{background:var(--panel4);color:var(--t1)}
.nav-item span:nth-child(2){flex:1}
.group-label{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--t4);text-transform:uppercase;padding:14px 10px 6px}
.cnt{font-size:10.5px;background:var(--panel4);color:var(--t2);border-radius:99px;padding:1px 7px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.pcheader{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.narrow{max-width:860px;margin:0 auto}
.fade-in{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}
/* дашборд «Сегодня»: сетка 2 колонки, брифинг на всю ширину */
.dash{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
.dash-span{grid-column:1/-1}
.dash .card{margin:0}
.brief-ic{width:46px;height:46px;border-radius:14px;background:var(--amber);color:#0b0d11;display:grid;place-items:center;flex:none}
.brief-ic .ic{width:20px;height:20px}
.h-link{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--t3);background:none;border:none;cursor:pointer;padding:0}
.h-link:hover{color:var(--amber)}
.cal-row{gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.cal-row:last-child{border-bottom:none}
.cal-row::before{content:'';width:3px;align-self:stretch;border-radius:2px;background:var(--ec, var(--amber));flex:none}
.cal-t{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t1)}
.cal-n{font-size:13.5px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lect-mini{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px}
.deep-ic{width:46px;height:46px;border-radius:14px;background:rgba(45,212,191,.14);color:var(--teal);display:grid;place-items:center;flex:none}
.deep-ic .ic{width:20px;height:20px}
@media(max-width:799px){ .dash{grid-template-columns:1fr} }
.app.phone .dash{grid-template-columns:1fr}

/* ── общие ── */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.card.dash-brief{background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(251,191,36,.08) 45%,var(--panel2) 80%);border-color:rgba(251,191,36,.45)}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
/* цветная боковая рамка карточки — разделы на «Сегодня» и в списке навигации */
.card.acc{border-left:none;padding-left:18px}
.card.acc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:var(--acc,--line2)}
.card.acc::after{content:'';position:absolute;left:0;top:0;bottom:0;width:26px;border-radius:4px 0 0 4px;background:var(--acc,var(--t4));opacity:.07;pointer-events:none}
.acc-amber{--acc:#fbbf24}.acc-red{--acc:#f87171}.acc-em{--acc:#34d399}.acc-teal{--acc:#2dd4bf}
.acc-rose{--acc:#fb7185}.acc-blue{--acc:#60a5fa}.acc-violet{--acc:#a78bfa}.acc-gray{--acc:#71717a}
.h-note{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--t2);background:var(--panel3);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--line2);color:var(--t1)}
.pill.on{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.4);color:var(--amber3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--t1);background:var(--panel4);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#0b0d11}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px}
.tab{flex:none;font-size:12.5px;font-weight:600;color:var(--t2);padding:6px 11px;border-radius:8px}
.tab:hover{color:var(--t1)}
.tab.on{background:var(--panel4);color:var(--t1)}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .ckb{width:20px;height:20px;flex:none;border-radius:7px;border:1.5px solid var(--t4);display:grid;place-items:center;color:transparent;transition:all .15s}
.item.done .ckb{background:var(--em);border-color:var(--em);color:#0b0d11}
.item.done .tx{color:var(--t3);text-decoration:line-through}
/* вид задач «компактно»: чекбокс + текст в одну строку, плотно */
.tasks-compact .item{padding:4px 2px;gap:8px}
.tasks-compact .item .tx{font-size:13px}
.tasks-compact .sect-h{display:flex;align-items:center;gap:8px;margin:14px 0 2px}
.tasks-compact .sect-h .cnt{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
/* вид задач «строки»: тонкие строки с меткой раздела и приоритетом */
.tasks-rows .trow-line{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);border-left:3px solid var(--prc,var(--t4))}
.tasks-rows .trow-line.done{opacity:.5}
.tasks-rows .trow-line.done .tx{text-decoration:line-through}
.tasks-rows .trow-line .tx{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasks-rows .trow-line .sect-tag{font-size:10.5px;font-weight:600;color:var(--t3);background:var(--panel3);border:1px solid var(--line);border-radius:99px;padding:2px 8px;flex:none}
.tasks-rows .trow-line .due-tag{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none;width:74px;text-align:right}
/* мини-чекбокс для строк */
.ckb-s{width:16px;height:16px;flex:none;border-radius:5px;border:1.5px solid var(--t4);display:grid;place-items:center;color:transparent;background:none;cursor:pointer;padding:0}
.ckb-s.on{background:var(--em);border-color:var(--em);color:#0b0d11}
/* контекстное меню правого клика (папки) */
.ctxmenu{position:fixed;z-index:400;min-width:210px;background:var(--panel3);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.55);animation:fi .12s ease-out}
.ctxmenu .ctx-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.ctxmenu .ctx-i:hover{background:var(--panel4)}
.ctxmenu .ctx-sep{height:1px;background:var(--line);margin:5px 4px}
.ctxmenu .ctx-h{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;padding:6px 10px 3px}
/* папки */
.folder-card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--fc,var(--teal));border-radius:var(--r);padding:12px 14px;cursor:pointer}
.folder-card:hover{border-color:var(--line2)}
.folder-card .f-ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb, var(--fc,var(--teal)) 16%, transparent);display:grid;place-items:center;flex:none}
.folder-card .f-n{font-size:13.5px;font-weight:700}
.folder-card .f-c{font-size:11px;color:var(--t3)}
.fdrop{outline:2px dashed rgba(251,191,36,.55);outline-offset:-4px;border-radius:var(--r)}
/* перетаскивание треков */
.trow.dragging{opacity:.35}
.trow.drag-over{border-top:2px solid var(--amber);margin-top:-2px}
.drag-h:active{cursor:grabbing}
.item .tx{font-size:13.5px;color:var(--t1)}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--t4));border-radius:3px 0 0 3px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--t3);margin-top:2px}
.banner{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--t2);line-height:1.55}
.banner.red{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fca5a5}
.note{font-size:12px;color:var(--t3);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tiny{font-size:11px;color:var(--t3)}
.dim{font-size:12.5px;color:var(--t2);line-height:1.6}
.sub{font-size:13px;color:var(--t2);line-height:1.6}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.empty{padding:26px 14px;text-align:center;color:var(--t3);font-size:13px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;word-break:break-all;color:var(--t2)}
kbd{font-family:inherit;font-size:10.5px;background:rgba(255,255,255,.07);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--t2)}

/* таблицы */
.tw{width:100%;border-collapse:collapse;font-size:12.5px}
.tw th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t4);padding:6px 8px;border-bottom:1px solid var(--line2)}
.tw td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--t2);vertical-align:top}
.tw td:first-child{color:var(--t1)}
.tw tr:last-child td{border-bottom:none}

/* раскрывающиеся блоки */
details{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--t1);display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
.dbody{padding:0 16px 14px}
.ic.chev{margin-left:auto;width:14px;height:14px;transition:transform .15s;color:var(--t3)}
details[open] .ic.chev{transform:rotate(90deg)}

/* заметки-плитки */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ntile{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:12px;padding:12px 12px 10px;min-height:122px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.ntile:hover{border-color:var(--line2)}
.ntile .nt-t{font-size:13px;font-weight:700;line-height:1.35;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntile .nt-b{font-size:11.5px;color:var(--t3);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ntile .nt-m{margin-top:auto;padding-top:8px;font-size:10.5px;color:var(--t4);display:flex;align-items:center;gap:5px}
.ntile .nt-dot{width:7px;height:7px;border-radius:99px;flex:none}
.group-label.sec{color:var(--amber);display:flex;align-items:center;gap:5px}
.group-label.sec .ic{width:11px;height:11px}
.sheet-tile.sec{color:var(--amber3)}

/* видео */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.vthumb{position:relative;cursor:pointer;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:var(--panel4);display:block}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;background:rgba(0,0,0,.25);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vname{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.45}
.vframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;display:block}

/* фото (закрытая зона) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pgrid .ph{position:relative}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line2);cursor:pointer;display:block}
.pgrid .phdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;background:rgba(11,13,17,.75);color:var(--t2);display:grid;place-items:center;font-size:12px}
.pgrid .phdel:hover{color:var(--red)}

/* чат */
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;min-height:0}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{margin-left:auto;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.25)}
.msg.ai{background:var(--panel3);border:1px solid var(--line)}
.mt{font-size:10.5px;color:var(--t4);margin-top:6px}
.chatbar{padding:12px 16px 14px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
/* список чатов */
.clst{width:230px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.clst-scroll{flex:1;overflow-y:auto;padding:0 8px 8px}
.clst-i{position:relative;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.clst-i:hover{background:var(--panel3)}
.clst-i.on{background:var(--panel3);border-color:var(--line2)}
.clst-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.clst-p{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.clst-x{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:6px;color:var(--t4);font-size:11px;display:none;place-items:center}
.clst-i:hover .clst-x{display:grid}
.clst-x:hover{color:var(--red);background:var(--panel4)}
/* телефон: сайдбар спрятан, открывается поверх (media или режим «Как телефон») */
@media(max-width:799px){
  .clst{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-102%);transition:transform .18s ease;box-shadow:8px 0 30px rgba(0,0,0,.45);width:250px}
  .clst.open{transform:none}
}
.app.phone .clst{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-102%);transition:transform .18s ease;box-shadow:8px 0 30px rgba(0,0,0,.45);width:250px}
.app.phone .clst.open{transform:none}
.chatbar input{flex:1}
.chip{font-size:12px;color:var(--t2);background:var(--panel3);border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--t1);border-color:var(--line2)}

/* ИИ: стриминг, метки, индикаторы */
.mt{font-size:10.5px;color:var(--t3);margin-top:5px}
.mt .tag{display:inline-flex;align-items:center;gap:4px}
.msg .typing{display:inline-flex;gap:4px;padding:2px 0}
.msg .typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:tdot 1.2s ease-in-out infinite}
.msg .typing i:nth-child(2){animation-delay:.2s}
.msg .typing i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.chip.on{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.4);color:var(--amber3)}
.dlbar{height:8px;background:var(--panel4);border-radius:99px;overflow:hidden;margin-top:8px}
.dlbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
.mdl-btn{position:relative;overflow:hidden}
.mdl-btn.busy{pointer-events:none;opacity:.75}
.mdl-btn .pct{font-size:11px;color:var(--amber3);font-variant-numeric:tabular-nums}
/* запись лекции */
.recbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:99px;padding:6px 14px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:recp 1.4s ease-out infinite}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}100%{box-shadow:0 0 0 12px rgba(248,113,113,0)}}
.lvl{display:flex;align-items:flex-end;gap:3px;height:18px}
.lvl span{width:4px;background:var(--red);border-radius:2px;height:3px;transition:height .1s}
.md{line-height:1.6}
.md b{color:var(--t1)}
.md ul{margin:6px 0 6px 18px;display:flex;flex-direction:column;gap:3px}

/* музыка */
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:16px;flex:none}
.eq span{width:3px;background:var(--amber);border-radius:2px;height:4px}
.eq.play span:nth-child(1){animation:eq .9s ease-in-out infinite}
.eq.play span:nth-child(2){animation:eq .9s .2s ease-in-out infinite}
.eq.play span:nth-child(3){animation:eq .9s .4s ease-in-out infinite}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:none}
.trow .eq{cursor:pointer}
.bar{height:3px;background:var(--panel4);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
/* ридер книг */
.rd-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.rd-body{padding:6px 18px 40px;overflow-y:auto;flex:1}
.rd-text{max-width:680px;margin:0 auto;line-height:1.75;color:var(--t1)}
.rd-text p{margin:0 0 .9em}
.rd-text h1,.rd-text h2,.rd-text h3{font-size:1.15em;font-weight:700;margin:1.4em 0 .5em;line-height:1.4}
.rd-serif{font-family:Georgia,'Times New Roman',serif}
.rd-sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.rd-text .verse{color:var(--t2);font-style:italic}
.rd-text a{color:var(--teal)}
/* промотка: полоса-скраббер для музыки */
.bar.seek{height:22px;background:transparent;overflow:visible;position:relative;cursor:pointer;touch-action:none}
.bar.seek::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:var(--panel4);border-radius:99px}
.bar.seek i{height:4px;top:50%;transform:translateY(-50%);position:absolute;left:0}
.bar.seek i::after{content:'';position:absolute;top:50%;left:100%;width:13px;height:13px;border-radius:99px;background:var(--amber3);box-shadow:0 0 0 3px rgba(251,191,36,.18);transform:translate(-50%,-50%);pointer-events:none}
.bar.seek .scrub-b{position:absolute;inset:0;z-index:2}

/* модалки/тосты */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{width:min(460px,100%);max-height:86vh;overflow-y:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:18px;animation:fi .15s ease-out}
/* полноэкранный просмотр фото: чёрный фон, зум, свайп */
.modal-back.fullscreen{background:rgba(0,0,0,.96);padding:0;align-items:stretch;justify-content:stretch}
.modal.fullview{width:100%;max-height:100vh;max-height:100dvh;height:100vh;height:100dvh;background:transparent;border:none;border-radius:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.fv-img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .12s ease-out;touch-action:none;cursor:grab;user-select:none;-webkit-user-drag:none}
.fv-img.drag{cursor:grabbing;transition:none}
.fv-bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.72),transparent);color:#fff}
.fv-title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.fv-btn{width:38px;height:38px;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:rgba(15,17,23,.72);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent}
.fv-btn:active{background:rgba(40,44,54,.9)}
.fv-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:5}
.fv-nav.prev{left:10px}.fv-nav.next{right:10px}
.fv-count{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(15,17,23,.72);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 12px}
.modal h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--panel4);border:1px solid var(--line2);color:var(--t1);font-size:13px;font-weight:500;border-radius:12px;padding:9px 16px;z-index:200;opacity:0;transition:all .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* телефон */
.pwrap{flex:1;display:flex;flex-direction:column;height:100vh;height:100dvh;min-width:0;position:relative}
.statusbar{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12.5px;color:var(--t2);padding-top:env(safe-area-inset-top)}
.pheader{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.pcontent{flex:1;overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain}
.bottomnav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--panel);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--t3);font-size:10px;border-radius:10px}
.bn-item.act{color:var(--amber)}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel2);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--t4);margin:4px auto 10px;opacity:.5}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sheet-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;color:var(--t2);font-size:11px}
.sheet-tile.act{background:var(--panel4);color:var(--t1)}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  .pcontent .stack{gap:10px}
}
@media (pointer:coarse){
  input,textarea,select{font-size:16px}
  .phdel{width:34px;height:34px}
  .clst-x{display:grid;width:36px;height:36px}
  .btn-sm{min-height:38px}
}
.overscroll-contain{overscroll-behavior:contain}
/* ═══════════ V7 CSS: проводник, редакторы, корзина, акценты разделов ═══════════ */

/* ── акцентные цвета разделов (полоса + активный пункт меню) ── */
.acc-band{position:sticky;top:0;z-index:5;height:3px;border-radius:99px;margin:-2px 0 10px;background:var(--acc,#fbbf24)}
.nav-item.act{background:color-mix(in srgb, var(--acc,#fbbf24) 13%, transparent)}
.pcheader{position:relative}
.ph-band{position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc,#fbbf24)}
.app[data-accent]{--acc:var(--ac)}

/* ═══ ПРОВОДНИК (Explorer) ═══ */
.expl{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2);min-height:420px}
.expl-side{width:216px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;max-height:62vh}
.expl-side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 8px;flex:none}
.expl-side-head .tiny{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4)}
.expl-tree{flex:1;overflow-y:auto;padding:0 6px 10px;min-height:0}
/* узел дерева */
.tnode{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border-radius:8px;color:var(--t2);font-size:12.5px;text-align:left;position:relative;border:none;background:none}
.tnode:hover{background:var(--panel3);color:var(--t1)}
.tnode.act{background:var(--panel4);color:var(--t1)}
.tnode .tn-tw{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--t4);transition:transform .15s}
.tnode.open .tn-tw, .tnode.act .tn-tw{transform:rotate(90deg)}
.tnode .tn-tw svg.ic{width:12px;height:12px}
.tnode .tn-tw.leaf{visibility:hidden}
.tnode.droptarget{box-shadow:inset 0 0 0 2px var(--amber);background:rgba(251,191,36,.08)}
.tnode .tn-lbl{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .tn-cnt{font-size:10px;color:var(--t4)}
.tnode .tn-x{width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--t4);opacity:0;transition:opacity .12s}
.tnode:hover .tn-x{opacity:1}
.tnode .tn-x:hover{color:var(--red);background:rgba(248,113,113,.12)}
.tnode .tn-x svg.ic{width:13px;height:13px}

/* основная область */
.expl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.expl-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.expl-crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:12.5px;color:var(--t2);flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;border:none;background:none}
.crumb:hover{background:var(--panel3);color:var(--t1)}
.crumb.cur{color:var(--t1);font-weight:600;cursor:default}
.crumb svg.ic{width:12px;height:12px;color:var(--t4)}
.expl-area{flex:1;overflow-y:auto;padding:12px;position:relative;min-height:0;touch-action:pan-y}
/* сетка плиток */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.etile{position:relative;border-radius:12px;border:1px solid transparent;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .12s, background .12s}
.etile:hover{background:var(--panel3)}
.etile.sel{border-color:var(--amber);background:rgba(251,191,36,.09)}
.etile.dragging{opacity:.35}
.etile.droptarget{border-color:var(--em);box-shadow:inset 0 0 0 2px var(--em)}
.etile .et-thumb{width:100%;aspect-ratio:1;border-radius:9px;background:var(--panel4);display:grid;place-items:center;overflow:hidden;position:relative}
.etile .et-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.etile .et-thumb svg.ic{width:26px;height:26px;color:var(--t3)}
.etile .et-name{font-size:11.5px;line-height:1.3;color:var(--t1);text-align:center;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etile .et-sub{font-size:10px;color:var(--t4);text-align:center}
.etile .et-check{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:7px;border:1.5px solid rgba(255,255,255,.35);background:rgba(11,13,17,.6);display:grid;place-items:center;color:transparent;opacity:0;transition:opacity .12s}
.etile.sel .et-check{opacity:1;border-color:var(--amber);background:var(--amber);color:#0b0d11}
.etile:hover .et-check{opacity:.85}
.etile .et-check svg.ic{width:12px;height:12px}
.etile .et-badge{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:7px;background:rgba(11,13,17,.6);display:grid;place-items:center;color:var(--t2)}
.etile .et-badge svg.ic{width:12px;height:12px}
/* строка списка */
.elist{display:flex;flex-direction:column;gap:2px}
.erow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;user-select:none;-webkit-user-select:none}
.erow:hover{background:var(--panel3)}
.erow.sel{background:rgba(251,191,36,.10);box-shadow:inset 0 0 0 1px var(--amber)}
.erow.dragging{opacity:.35}
.erow.droptarget{box-shadow:inset 0 0 0 2px var(--em)}
.erow .er-ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--panel4);display:grid;place-items:center;overflow:hidden}
.erow .er-ic img{width:100%;height:100%;object-fit:cover}
.erow .er-ic svg.ic{width:17px;height:17px;color:var(--t3)}
.erow .er-name{min-width:0;flex:1;font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .er-sub{font-size:11px;color:var(--t4);white-space:nowrap;flex:none}
.erow .er-dur{font-variant-numeric:tabular-nums}
/* рамка-лассо */
.lasso{position:fixed;border:1px solid var(--amber);background:rgba(251,191,36,.14);border-radius:4px;z-index:90;pointer-events:none}
/* призрак при перетаскивании */
.drag-ghost{position:fixed;z-index:95;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--panel4);border:1px solid var(--amber);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--t1);box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:70vw}
.drag-ghost svg.ic{width:14px;height:14px;color:var(--amber)}
/* панель выделения */
.selbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(251,191,36,.08);border-top:1px solid rgba(251,191,36,.22);flex:none;flex-wrap:wrap}
.expl-empty{display:grid;place-items:center;height:100%;min-height:180px;color:var(--t3);font-size:13px;text-align:center;padding:20px}

/* ═══ РЕДАКТОР ФОТО (кроп/поворот/фильтры) ═══ */
.phed-stage{background:repeating-conic-gradient(#14171e 0% 25%, #10131a 0% 50%) 50%/16px 16px;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;touch-action:none}
.phed-stage img{max-width:100%;max-height:52vh;display:block;user-select:none;-webkit-user-drag:none}
.phed-crop{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(5,6,8,.66);cursor:move}
.phed-crop .pc-h{position:absolute;background:rgba(255,255,255,.55)}
.phed-crop .pc-h.h{left:0;right:0;height:1px}
.phed-crop .pc-h.v{top:0;bottom:0;width:1px}
.phed-crop .pc-h:nth-child(1){top:33.3%}
.phed-crop .pc-h:nth-child(2){top:66.6%}
.phed-crop .pc-h.v:nth-child(3){left:33.3%}
.phed-crop .pc-h.v:nth-child(4){left:66.6%}
.phed-crop .pc-k{position:absolute;width:16px;height:16px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none}
.phed-crop .pc-k.tl{left:-8px;top:-8px;cursor:nwse-resize}
.phed-crop .pc-k.tr{right:-8px;top:-8px;cursor:nesw-resize}
.phed-crop .pc-k.bl{left:-8px;bottom:-8px;cursor:nesw-resize}
.phed-crop .pc-k.br{right:-8px;bottom:-8px;cursor:nwse-resize}
.phed-preview{max-height:120px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}

/* ═══ РЕДАКТОР АУДИО (тримминг по волне) ═══ */
.wave-wrap{position:relative;height:96px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;touch-action:none}
.wave-cv{width:100%;height:100%;display:block}
.wave-sel{position:absolute;top:0;bottom:0;background:rgba(251,191,36,.16);border-left:2px solid var(--amber);border-right:2px solid var(--amber);pointer-events:none}
.wave-sel .ws-h{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;pointer-events:auto;display:grid;place-items:center;color:var(--amber)}
.wave-sel .ws-h.l{left:-6px}
.wave-sel .ws-h.r{right:-6px}
.wave-play{position:absolute;top:0;bottom:0;width:2px;background:var(--em);pointer-events:none}
.wave-time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:11px;color:var(--t3);margin-top:6px}

/* ═══ КОРЗИНА (секретная зона) ═══ */
.tr-grid{display:flex;flex-direction:column;gap:8px}
.tr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);flex-wrap:wrap}
.tr-item .tr-ic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--panel4);display:grid;place-items:center;overflow:hidden}
.tr-item .tr-ic img{width:100%;height:100%;object-fit:cover}
.tr-item .tr-ic svg.ic{width:17px;height:17px;color:var(--t3)}
.tr-item .tr-body{min-width:0;flex:1}
.tr-item .tr-name{font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-item .tr-sub{font-size:11px;color:var(--t3);margin-top:1px}
.tr-days{font-size:11px;color:var(--t2);background:var(--panel4);border-radius:99px;padding:2px 9px;white-space:nowrap;flex:none}
.tr-days.warn{color:var(--red);background:rgba(248,113,113,.12)}

/* мобильная адаптация проводника */
@media (max-width:560px){
  .expl{flex-direction:column;min-height:0}
  .expl-side{width:100%;max-height:168px;border-right:none;border-bottom:1px solid var(--line)}
  .egrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .erow .er-sub{display:none}
  .crumb{padding:2px 6px}
  .tnode{padding:7px 8px}
}

/* ═══ AURORA THEME (редизайн Клода) — только оформление, логика не тронута ═══ */
html.aurora{
  --bg:#0a0e1f; --panel:#0d1226; --panel2:#121833; --panel3:#182042; --panel4:#212a54;
  --line:rgba(180,200,255,.08); --line2:rgba(180,200,255,.16);
  --amber:#7dd3fc; --amber2:#38bdf8; --amber3:#bae6fd;
  --t1:#eef1ff; --t2:#b4bbdc; --t3:#7f88b0; --t4:#586088;
  --r:18px;
  --grad:linear-gradient(135deg,#7dd3fc 0%,#a78bfa 100%);
}
html.aurora body{
  font:14.5px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(167,139,250,.18),transparent 60%),
    radial-gradient(800px 480px at 100% 0%,rgba(125,211,252,.12),transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
html.aurora .logo-tile,html.aurora .brief-ic,html.aurora .btn-amber{background:var(--grad)!important;border-color:transparent!important;color:#0a0e1f!important}
html.aurora .btn-amber{font-weight:700;box-shadow:0 6px 18px -6px rgba(125,211,252,.55)}
html.aurora .btn-amber:hover{filter:brightness(1.07)}
html.aurora .card{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--panel2);
  border:1px solid var(--line2);
  box-shadow:0 10px 30px -18px rgba(0,0,0,.7);
}
html.aurora .card.dash-brief{
  background:linear-gradient(135deg,rgba(167,139,250,.28),rgba(125,211,252,.12) 50%,var(--panel2) 90%);
  border-color:rgba(167,139,250,.5);
}
html.aurora .nav-item{border-radius:12px;transition:background .15s,color .15s}
html.aurora .nav-item.act{background:linear-gradient(90deg,rgba(125,211,252,.18),rgba(167,139,250,.10));color:#fff;box-shadow:inset 3px 0 0 #7dd3fc}
html.aurora .tab.on{background:rgba(125,211,252,.16);color:var(--amber3)}
html.aurora .pill.on{background:rgba(125,211,252,.14);border-color:rgba(125,211,252,.45);color:var(--amber3)}
html.aurora .chip.on{background:rgba(125,211,252,.13);border-color:rgba(125,211,252,.4);color:var(--amber3)}

function pickBook(){
  const ctx = funContextTags();
  const seen = loadJSON('armi_fun_books', []);
  let pool = BOOKS.map(b=>{
    let s = b.tags.filter(t=>ctx.includes(t)).length;
    if(seen.includes(b.id)) s -= 0.6;
    return {b, s: s + Math.random()*0.9};
  }).sort((x,y)=>y.s-x.s);
  const pick = pool[0].b;
  const nx = [...seen.filter(id=>id!==pick.id), pick.id].slice(-5);
  saveJSON('armi_fun_books', nx);
  const reason = 'под твой контекст: ' + ctx.map(c=>({дисциплина:'твой план', тело:'тренировки и восстановление', деньги:'твои финансовые цели', учёба:'учёба и повторение'}[c])).join(' · ');
  return {book:pick, reason};
}

/* ══════════ ХРАНИЛИЩЕ И УТИЛИТЫ ══════════ */
const store = (function(){
  /* Хранилище с честной диагностикой. Раньше при недоступном localStorage данные молча уходили в память
     и пропадали при закрытии. Теперь: флаг volatile, счётчик сбоев, overlay в памяти и баннер (см. Durable). */
  let real=null;
  try{ const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t); real=localStorage; }catch(e){}
  const mem={};
  const w = {
    volatile: !real,
    failed: 0,
    onChange: null,
    getItem:k=>(k in mem)?mem[k]:(real?real.getItem(k):null),
    setItem:(k,v)=>{
      v=String(v);
      try{ if(!real) throw new Error('no-storage'); real.setItem(k,v); delete mem[k]; }
      catch(e){ mem[k]=v; w.failed++; }
      if(w.onChange) w.onChange(k);
    },
    removeItem:k=>{ delete mem[k]; try{ if(real) real.removeItem(k); }catch(e){} if(w.onChange) w.onChange(k); },
    keys:()=>{ const o={}; try{ if(real) for(let i=0;i<real.length;i++) o[real.key(i)]=1; }catch(e){} Object.keys(mem).forEach(k=>o[k]=1); return Object.keys(o); },
  };
  return w;
})();

function saveJSON(k, v){ try{ store.setItem(k, JSON.stringify(v)); }catch(e){ toast('Не удалось сохранить данные'); } }

/* ══════════ МЕДИА-ХРАНИЛИЩЕ (IndexedDB: файлы музыки/видео/фото) ══════════ */
const IDB = {
  async ok(){ return !!(await this.open()); },
  _p:null,
  open(){ if(!this._p) this._p = new Promise((res)=>{ try{ const rq=indexedDB.open('armi_files',2);
    rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains('files')) rq.result.createObjectStore('files'); };
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); }catch(e){ res(null); } }); return this._p; },
  async _tx(mode,fn){ const db=await this.open(); if(!db) return new Promise(r=>r(undefined));
    return new Promise((res)=>{ try{ const tx=db.transaction('files',mode); const q=fn(tx.objectStore('files'));
      tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>res(undefined); tx.onabort=()=>res(undefined); }catch(e){ res(undefined); } }); },
  put(k,b){ return this._tx('readwrite',st=>st.put(b,k)); },
  get(k){ return this._tx('readonly',st=>st.get(k)); },
  del(k){ return this._tx('readwrite',st=>st.delete(k)); },
  clear(){ return this._tx('readwrite',st=>st.clear()); },
};

/* ══════════ ДОЛГОВЕЧНОСТЬ ДАННЫХ (v9.1) ══════════
   1) запрос «постоянного» хранилища у браузера (navigator.storage.persist)
   2) зеркало всех ключей в IndexedDB (другая квота и другая «судьба», чем у localStorage)
   3) автовосстановление из зеркала, если localStorage очистили
   4) баннер, если данные не сохраняются или место заканчивается */
const Durable = (function(){
  const SNAP = '__snapshot', LIMIT = 5*1024*1024;
  let timer = null, dismissed = false, restored = false;
  function usage(){ let n=0; try{ store.keys().forEach(k=>{ const v=store.getItem(k); n += (k.length + (v?v.length:0))*2; }); }catch(e){} return n; }
  async function snapshot(){
    try{
      const o={}; store.keys().forEach(k=>{ if(k!=='__t') o[k]=store.getItem(k); });
      if(Object.keys(o).length) await IDB.put(SNAP, {ts:Date.now(), data:o});
    }catch(e){}
  }
  function schedule(){ if(timer) clearTimeout(timer); timer=setTimeout(()=>{ timer=null; snapshot(); warn(); }, 900); }
  async function restoreIfWiped(){
    try{
      const hasData = store.getItem('armi_tasks')!==null || store.getItem('armi_notes')!==null || store.getItem('armi_sec_data')!==null;
      if(hasData || store.volatile) return false;
      const snap = await IDB.get(SNAP);
      if(!snap || !snap.data) return false;
      if(!(snap.data.armi_tasks || snap.data.armi_notes)) return false;
      try{ if(sessionStorage.getItem('armi_restored')) return false; sessionStorage.setItem('armi_restored','1'); }catch(e){}
      Object.keys(snap.data).forEach(k=>store.setItem(k, snap.data[k]));
      restored = true;
      return true;
    }catch(e){ return false; }
  }
  function problem(){
    if(store.volatile) return 'Хранилище браузера недоступно — всё, что ты вводишь, пропадёт при закрытии. Открой Арми обычным окном (не приватным) и сделай бэкап: Настройки → Экспорт.';
    if(store.failed>0) return 'Не удалось сохранить часть данных — место закончилось. Сделай бэкап (Настройки → Экспорт) и удали лишнее.';
    if(usage() > LIMIT*0.8) return 'Хранилище заполнено на '+Math.round(usage()/LIMIT*100)+'%. Сделай бэкап (Настройки → Экспорт), пока ничего не потерялось.';
    return '';
  }
  function warn(){
    if(typeof document==='undefined' || !document.body) return;
    let el = document.getElementById('storage-warn');
    const msg = problem();
    if(!msg || dismissed){ if(el) el.remove(); return; }
    if(!el){
      el = document.createElement('div'); el.id='storage-warn'; el.setAttribute('role','alert');
      el.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#7f1d1d;color:#fff;border:1px solid #fca5a5;border-radius:12px;padding:10px 12px;font:13px/1.4 system-ui,sans-serif;display:flex;gap:10px;align-items:flex-start;box-shadow:0 6px 24px rgba(0,0,0,.4)';
      document.body.appendChild(el);
    }
    el.innerHTML = '<span style="flex:1"></span><button type="button" style="background:transparent;color:#fff;border:1px solid #fca5a5;border-radius:8px;padding:2px 8px;cursor:pointer">Понятно</button>';
    el.firstChild.textContent = msg;
    el.lastChild.onclick = ()=>{ dismissed=true; el.remove(); };
  }
  async function init(){
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    store.onChange = schedule;
    const did = await restoreIfWiped();
    if(did){ location.reload(); return; }
    await snapshot(); warn();
  }
  return {init, usage, snapshot, warn, problem, get restored(){ return restored; }, LIMIT};
})();
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>Durable.init()); else Durable.init();
const MEDIA_URLS = {};
async function mediaUrl(id){
  if(MEDIA_URLS[id]) return MEDIA_URLS[id];
  const b=await IDB.get(id); if(!b) return null;
  return MEDIA_URLS[id]=URL.createObjectURL(b);
}
async function compressImage(file, max=1600, q=.82){
  const bmp = await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*k)), h=Math.max(1,Math.round(bmp.height*k));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
  return blob||file;
}
const probeDur=blob=>new Promise(r=>{ try{
  const u=URL.createObjectURL(blob); const a=new Audio();
  const done=v=>{ try{a.src='';}catch(e){} URL.revokeObjectURL(u); r(v); };
  a.onloadedmetadata=()=>done(isFinite(a.duration)?Math.round(a.duration):0);
  a.onerror=()=>done(0);
  a.src=u;
}catch(e){ r(0); } });
async function mediaAdd(inp, kind, maxMB){
  const files=[...(inp.files||[])]; inp.value=''; if(!files.length) return;
  let n=0;
  for(const f of files){
    if(f.size>(maxMB||200)*1048576){ toast('«'+f.name+'» больше '+(maxMB||200)+' МБ — пропущен'); continue; }
    try{
      let blob=f;
      if(kind==='photo') blob=await compressImage(f);
      const id=uid(kind==='audio'?'aud':kind==='video'?'vid':'img');
      await IDB.put(id, blob);
      if(!await IDB.ok()) throw new Error('хранилище недоступно');
      const dur=(kind==='audio')?await probeDur(blob):0;
      DB.media.unshift({id, kind, name:f.name.replace(/\.[^.]+$/,''), size:blob.size, type:blob.type||'', added:'сегодня', dur});
      n++;
    }catch(e){ toast('Не удалось добавить «'+f.name+'» — '+(e.message||'ошибка')); }
  }
  saveDB(); render();
  toast(n>1?('Добавлено файлов: '+n):n?(kind==='audio'?'Трек добавлен — жми по нему':'Добавлено — файл на устройстве'):'Ничего не добавлено');
}

/* конвертация Blob <-> base64 для синхронизации медиа */function blobToB64(blob){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=()=>res('');
    r.readAsDataURL(blob);
  });
}
function b64ToBlob(b64, type){
  const bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u], {type:type||'application/octet-stream'});
}

/* ══════════ ПЛЕЕР: демо-треки (WebAudio-синтезатор) + файлы пользователя ══════════ */
function currentTrack(){ const t=PLAYER.track(); return t||TRACKS[0]; }
const PLAYER = {
  audio:null, ctx:null, master:null, beatT:null, progT:null, mode:null, fileId:null, custom:null,
  queue:null, queuePos:0,
  track(){
    if(this.mode==='file'){ const m=DB.media.find(x=>x.id===this.fileId); return m?{id:m.id,title:m.name,artist:'мой файл · '+fmtSize(m.size),seconds:m.dur||0}:TRACKS[0]; }
    if(this.mode==='custom') return this.custom||TRACKS[0];
    return TRACKS.find(t=>t.id===S.music.trackId)||TRACKS[0];
  },
  ensureAudio(){
    if(this.audio) return this.audio;
    const a=new Audio();
    a.addEventListener('timeupdate',()=>{ S.music.progress=a.currentTime; this.paint(); });
    a.addEventListener('loadedmetadata',()=>{ const m=DB.media.find(x=>x.id===this.fileId);
      if(m&&a.duration&&isFinite(a.duration)&&Math.abs((m.dur||0)-a.duration)>1){ m.dur=a.duration; saveDB(); this.paint(); } });
    a.addEventListener('ended',()=>{ S.music.progress=0; this.next(true); });
    this.audio=a; return a;
  },
  playFile(id){
    this.stopAll(); this.mode='file'; this.fileId=id; this.custom=null; S.music.trackId=null;
    if(!this.queue || !this.queue.includes(id)) this.setQueue(DB.media.filter(m=>m.kind==='audio'&&!m.secret).map(m=>m.id));
    this.queuePos = this.queue ? this.queue.indexOf(id) : 0;
    S.music.progress=0; S.music.playing=true; render();
    mediaUrl(id).then(u=>{ if(!u){ toast('Файл не найден'); S.music.playing=false; this.mode=null; this.fileId=null; render(); return; }
      const a=this.ensureAudio(); a.src=u; a.play().catch(()=>toast('Нажми «Слушать» ещё раз — браузер просит жест')); this.paint(); });
  },
  /* очередь треков: список id медиа-файлов */
  setQueue(list){
    if(!list || !list.length){ this.queue=null; this.queuePos=0; return; }
    this.queue = S.music.shuffle ? this.shuffled(list.slice()) : list.slice();
    if(this.fileId) this.queuePos = Math.max(0, this.queue.indexOf(this.fileId));
  },
  shuffled(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; },
  playDemo(id){ this.stopAll(); this.mode=null; this.fileId=null; this.custom=null; this.queue=null; S.music.trackId=id; S.music.progress=0; S.music.playing=true; this.startEngine(); render(); },
  playCustom(tr){ this.stopAll(); this.mode='custom'; this.custom=tr; this.fileId=null; this.queue=null; S.music.trackId=null; S.music.progress=0; S.music.playing=true; this.startEngine(); render(); },
  /* следующий/предыдущий трек в очереди */
  next(auto){
    if(this.mode!=='file' || !this.queue || !this.queue.length){
      if(this.mode===null){ /* демо: следующий по списку TRACKS */
        const i=TRACKS.findIndex(t=>t.id===S.music.trackId);
        this.playDemo(TRACKS[(i+1)%TRACKS.length].id);
      } else { S.music.playing=false; S.music.progress=0; this.paint(); render(); }
      return;
    }
    if(this.queuePos >= this.queue.length-1){
      if(S.music.repeat){ this.queuePos=0; }
      else if(auto){ S.music.playing=false; S.music.progress=0; this.paint(); render(); return; }
      else this.queuePos=0;
    } else this.queuePos++;
    this.playFile(this.queue[this.queuePos]);
  },
  prev(){
    if(this.mode==='custom'){ this.playCustom(this.custom); return; }
    if(this.mode!=='file' || !this.queue || !this.queue.length){ this.playDemo(S.music.trackId||TRACKS[0].id); return; }
    if(this.queuePos>0) this.queuePos--;
    else this.queuePos=this.queue.length-1;
    this.playFile(this.queue[this.queuePos]);
  },
  seekTo(frac){
    const tr=this.track(); const dur=(tr&&(tr.seconds||tr.dur))||0; if(!dur) return;
    const pos=Math.max(0, Math.min(1, frac))*dur;
    S.music.progress=pos;
    if(this.mode==='file'&&this.audio&&this.audio.src&&isFinite(this.audio.duration)){ this.audio.currentTime=Math.min(pos,this.audio.duration-.1); }
    else if(this.mode==='custom'||this.mode===null){ this.startEngine(); }
    this.paint();
  },
  toggle(){
    if(S.music.playing){ S.music.playing=false; if(this.mode==='file'&&this.audio) this.audio.pause(); this.stopEngine(); }
    else{
      if(this.mode==='file'&&this.audio&&this.audio.src){ S.music.playing=true; this.audio.play().catch(()=>{}); }
      else if(this.mode==='custom'&&this.custom){ S.music.playing=true; this.startEngine(); }
      else if(this.mode===null&&S.music.trackId){ S.music.playing=true; this.startEngine(); }
      else { this.playDemo(S.music.trackId||TRACKS[0].id); return; }
    }
    render();
  },
  stopAll(){ if(this.audio) this.audio.pause(); this.stopEngine(); },
  startEngine(){
    const tr=this.track(); this.stopEngine(); this.synthStart(tr);
    clearInterval(this.progT);
    this.progT=setInterval(()=>{ if(!S.music.playing) return;
      const t=this.track(); const dur=(t&&(t.seconds||t.dur))||180;
      S.music.progress=(S.music.progress||0)+1;
      if(S.music.progress>=dur){
        if(this.mode==='file'&&this.queue&&this.queue.length){ clearInterval(this.progT); this.next(true); return; }
        S.music.progress=0;
      }
      this.paint(); },1000);
  },
  stopEngine(){
    clearInterval(this.progT); this.progT=null; clearInterval(this.beatT); this.beatT=null;
    if(this.master){ try{ const m=this.master, ctx=this.ctx; m.gain.setTargetAtTime(0, ctx.currentTime, .06); setTimeout(()=>{try{m.disconnect();}catch(e){}},300); }catch(e){} this.master=null; }
  },
  synthStart(tr){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=this.ctx||new AC(); if(this.ctx.state==='suspended') this.ctx.resume();
      const seed=[...(tr.id||'x')].reduce((a,c)=>a+c.charCodeAt(0),0)+(tr.title||'').length;
      const base=174+((seed%6)*11);
      const penta=[0,3,5,7,10];
      const master=this.ctx.createGain(); master.gain.value=.14; master.connect(this.ctx.destination);
      const flt=this.ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=1500; flt.connect(master);
      this.master=master;
      const note=(f,t,d,v,ty)=>{ const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type=ty; o.frequency.value=f;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
        o.connect(g); g.connect(flt); o.start(t); o.stop(t+d+.05); };
      const beat=.36; let step=0;
      const tick=()=>{
        if(!S.music.playing||this.master!==master) return;
        const t=this.ctx.currentTime+.06, i=step%32;
        if(i%8===0) note(base/2, t, beat*7, .26, 'sine');
        if(i%16===8) note(base/2*1.335, t, beat*7, .18, 'sine');
        if(i%16===0) [0,3,7].forEach(s=>note(base*Math.pow(2,s/12), t, beat*15, .05, 'sine'));
        if(i%2===0&&(seed+step)%3) note(base*2*Math.pow(2,penta[(step*3+seed)%5]/12), t, beat*1.6, .07, 'triangle');
        step++;
      };
      tick(); this.beatT=setInterval(tick, beat*1000);
    }catch(e){}
  },
  paint(){
    const tr=this.track(); const dur=(tr&&(tr.seconds||tr.dur))||0;
    const mp=document.getElementById('mp-sub'); if(mp) mp.textContent=(S.music.playing?'играет':'на паузе')+' · '+fmtSec(S.music.progress||0);
    const mpt=document.getElementById('mp-title'); if(mpt&&tr) mpt.textContent=tr.title;
    const bar=document.getElementById('mbar'); if(bar) bar.style.width=dur?Math.min(100,Math.round(100*(S.music.progress||0)/dur))+'%':'0%';
    const pos=document.getElementById('mpos'); if(pos) pos.textContent=fmtSec(S.music.progress||0);
    const tot=document.getElementById('mtot'); if(tot&&dur) tot.textContent=fmtSec(dur);
  },
};

/* ══════════ КАЛЬКУЛЯТОР ДЛЯ ЧАТА ══════════ */
function pf(x){ return parseFloat(String(x).replace(',','.')); }
function fmtNum(v){ const r=Math.round(v*1e6)/1e6; return r.toLocaleString('ru-RU'); }
function calcAnswer(qRaw){
  let q=' '+qRaw.toLowerCase().replace(/\s+/g,' ')+' ';
  q=q.replace(/(\d)\s(?=\d{3}\b)/g,'$1');
  q=q.replace(/сколько будет|сколько|посчитай|реши|чему равно|посчитать|=|\?/g,' ');
  let m=q.match(/(\d+(?:[.,]\d+)?)\s*(?:%|процент[а-я]*)\s*от\s*(\d+(?:[.,]\d+)?)/);
  if(m){ const a=pf(m[1]), b=pf(m[2]); return fmtNum(a)+'% от '+fmtNum(b)+' = '+fmtNum(a*b/100); }
  m=q.match(/(\d+(?:[.,]\d+)?)\s+на\s+(\d+(?:[.,]\d+)?)/);
  if(m && !/[+\-*/:×÷%]/.test(q)){
    const a=pf(m[1]), b=pf(m[2]);
    return fmtNum(a)+' : '+fmtNum(b)+' = '+fmtNum(a/b)+'\n(если про умножение: '+fmtNum(a)+' × '+fmtNum(b)+' = '+fmtNum(a*b)+')';
  }
  let s=q.replace(/умножить на|умножить|умножь на|умножь|произведение/g,'*')
    .replace(/разделить на|поделить на|делить на|разделить|поделить|раздели|подели|частное/g,'/')
    .replace(/плюс|прибавить/g,'+').replace(/минус|отнять/g,'-')
    .replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/:/g,'/').replace(/\^/g,'**');
  if(/^[\d+\-*/().%\s]+$/.test(s.trim()) && /\d/.test(s) && /[+\-*/]/.test(s)){
    try{
      const v=Function('"use strict";return('+s+')')();
      if(typeof v==='number'&&isFinite(v)) return qRaw.trim()+' = '+fmtNum(v);
    }catch(e){}
  }
  return null;
}
function weekOf(d){
  const days = Math.floor((d - START)/864e5);
  if(!HAS_PLAN || days < 0) return {w:0, ph:null};
  const w = Math.floor(days/7)+1;
  if(w > PLAN_WEEKS) return {w:PLAN_WEEKS, ph:PHASES[PHASES.length-1]};
  for(const p of PHASES) if(d >= p.a && d <= p.b) return {w, ph:p};
  return {w, ph:null};
}
function streak(){
  let s=0;
  for(let i=0;i<400;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const done = MIN5.filter((_,j)=>chkGet('m_'+dkey(d)+'_'+j)).length;
    if(done>=4) s++; else if(i>0) break; else continue;
  }
  return s;
}
function weekMatch(label,w){
  const m = label.match(/^Нед\.\s*([\d–]+)/); if(!m) return false;
  const p = m[1].split('–').map(Number);
  return w>=p[0] && w<=(p[1]||p[0]);
}

/* перетаскивание «Мои треки»: HTML5 drag-and-drop, порядок в DB.media */
function initTrackDrag(){
  /* палец: long-press → перетаскивание (HTML5 DnD не работает на тач) */
  (function(){
    const rows=[...document.querySelectorAll('[data-drag-track]')];
    if(rows.length<2) return;
    let dragRow=null, ghost=null, started=false, t0=null, sx=0, sy=0;
    const applyVisibleOrder=()=>{
      const inFolder = S.folder && S.folder.zone==='music';
      const ordered=[...document.querySelectorAll('[data-drag-track]')].map(r=>r.getAttribute('data-drag-track'));
      let k=0;
      DB.media=DB.media.map(m=>(m.kind==='audio'&&ordered.includes(m.id))?ordered2obj(ordered)[k++]:m);
      function ordered2obj(a){ return a.map(id=>DB.media.find(m=>m.id===id)); }
      saveDB(); render(); toast('Порядок треков обновлён');
    };
    const hoverIdx=e=>{
      const list=dragRow?dragRow.parentElement:null; if(!list) return -1;
      const rs=[...list.querySelectorAll('[data-drag-track]')];
      for(let i=0;i<rs.length;i++){ const r=rs[i].getBoundingClientRect(); if(e.clientY<r.top+r.height/2) return i; }
      return rs.length;
    };
    const paintMarker=e=>{
      const list=dragRow?dragRow.parentElement:null; if(!list) return;
      const idx=hoverIdx(e);
      let mk=document.getElementById('tr-drag-mk');
      if(!mk){ mk=document.createElement('div'); mk.id='tr-drag-mk'; mk.style.cssText='height:3px;background:var(--amber);border-radius:2px;margin:1px 0'; list.appendChild(mk); }
      const rs=[...list.querySelectorAll('[data-drag-track]')];
      if(idx>=rs.length) list.appendChild(mk); else list.insertBefore(mk, rs[idx]);
    };
    const clearMarker=()=>{ const mk=document.getElementById('tr-drag-mk'); if(mk) mk.remove(); };
    rows.forEach(row=>{
      row.addEventListener('touchstart', e=>{
        if(e.touches.length!==1) return;
        dragRow=row; started=false; t0=Date.now();
        const tt=e.touches[0]; sx=tt.clientX; sy=tt.clientY;
      }, {passive:true});
      row.addEventListener('touchmove', e=>{
        if(!dragRow) return;
        const tt=e.touches[0];
        if(!started){
          if(Date.now()-t0<220) return;
          if(Math.abs(tt.clientY-sy)<12 || Math.abs(tt.clientX-sx)>Math.abs(tt.clientY-sy)) return;
          started=true;
          dragRow.classList.add('dragging');
          ghost=dragRow.cloneNode(true);
          ghost.style.cssText='position:fixed;left:'+dragRow.getBoundingClientRect().left+'px;width:'+dragRow.getBoundingClientRect().width+'px;z-index:999;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          document.body.appendChild(ghost);
        }
        e.preventDefault();
        ghost.style.top=(tt.clientY-24)+'px';
        paintMarker(tt);
      }, {passive:false});
      row.addEventListener('touchend', ()=>{
        if(!started||!dragRow){ dragRow=null; return; }
        dragRow.classList.remove('dragging');
        if(ghost){ ghost.remove(); ghost=null; }
        clearMarker();
        applyVisibleOrder();
        dragRow=null;
      });
    });
  })();
  document.querySelectorAll('[data-drag-track]').forEach(row=>{
    row.addEventListener('dragstart', e=>{
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', row.getAttribute('data-drag-track'));
    });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over')); });
    row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', ()=>row.classList.remove('drag-over'));
    row.addEventListener('drop', e=>{
      e.preventDefault(); row.classList.remove('drag-over');
      const from=e.dataTransfer.getData('text/plain'), to=row.getAttribute('data-drag-track');
      if(!from||from===to) return;
      const inFolder = S.folder && S.folder.zone==='music';
      let ids = DB.media.filter(m=>m.kind==='audio' && (inFolder ? m.folder===S.folder.id : !m.folder)).map(m=>m.id);
      const fi=ids.indexOf(from), ti=ids.indexOf(to);
      if(fi<0||ti<0) return;
      ids.splice(ti,0,ids.splice(fi,1)[0]);
      /* пересобираем порядок ТОЛЬКО видимых треков, остальные записи не трогаем */
      let k=0;
      DB.media=DB.media.map(m=>(m.kind==='audio'&&ids.includes(m.id))?ids2obj(ids)[k++]:m);
      function ids2obj(a){ return a.map(id=>DB.media.find(m=>m.id===id)); }
      saveDB(); render(); toast('Порядок треков обновлён');
    });
  });
}
/* перетаскивание треков внутри плейлиста (открытого в модалке) — мышью и пальцем */
function initPlaylistDrag(plId){
  const rows=[...document.querySelectorAll('[data-pldrag]')];
  if(rows.length<2) return;
  let dragRow=null, ghost=null, started=false;
  const rowH=()=>rows[0].getBoundingClientRect().height+6;
  const applyOrder=()=>{
    const ordered=[...document.querySelectorAll('[data-pldrag]')].map(r=>r.getAttribute('data-pldrag').split('|')[1]);
    const p=DB.playlists.find(x=>x.id===plId); if(!p) return;
    p.items=ordered; saveDB();
  };
  const hoverIdx=e=>{
    const list=document.getElementById('pl-drag'); if(!list) return -1;
    const rows2=[...list.querySelectorAll('[data-pldrag]')];
    for(let i=0;i<rows2.length;i++){ const r=rows2[i].getBoundingClientRect(); const y=e.clientY; if(y<r.top+r.height/2) return i; }
    return rows2.length;
  };
  const paintMarker=e=>{
    const idx=hoverIdx(e); const list=document.getElementById('pl-drag'); if(!list) return;
    let mk=document.getElementById('pl-drag-mk');
    if(!mk){ mk=document.createElement('div'); mk.id='pl-drag-mk'; mk.style.cssText='height:3px;background:var(--amber);border-radius:2px;margin:1px 0'; list.appendChild(mk); }
    const rows2=[...list.querySelectorAll('[data-pldrag]')];
    if(idx>=rows2.length) list.appendChild(mk);
    else list.insertBefore(mk, rows2[idx]);
  };
  const clearMarker=()=>{ const mk=document.getElementById('pl-drag-mk'); if(mk) mk.remove(); };
  /* мышь: HTML5 drag-and-drop */
  rows.forEach(row=>{
    row.addEventListener('dragstart', e=>{ dragRow=row; started=true; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', row.getAttribute('data-pldrag')); });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); dragRow=null; clearMarker(); document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over')); });
    row.addEventListener('dragover', e=>{ e.preventDefault(); paintMarker(e); });
    row.addEventListener('dragleave', ()=>clearMarker());
    row.addEventListener('drop', e=>{
      e.preventDefault(); clearMarker();
      if(!dragRow||dragRow===row) return;
      const from=dragRow.getAttribute('data-pldrag').split('|')[1];
      const idx=hoverIdx(e);
      const p=DB.playlists.find(x=>x.id===plId); if(!p) return;
      p.items=(p.items||[]).filter(x=>x!==from);
      let target=row.getAttribute('data-pldrag').split('|')[1];
      let ti=p.items.indexOf(target);
      if(idx>rows.findIndex(r=>r===row)+0 && p.items.indexOf(from)<ti) ti=ti+1; /* простая поправка, ниже пересчёт по маркеру не нужен */
      p.items.splice(ti<0?p.items.length:ti,0,from);
      saveDB(); ACTIONS.plOpen(plId); toast('Порядок в плейлисте обновлён');
    });
  });
  /* палец: touch-перетаскивание */
  rows.forEach(row=>{
    row.addEventListener('touchstart', e=>{
      if(e.touches.length!==1) return;
      dragRow=row; started=false;
      const t=e.touches[0];
      row._sx=t.clientX; row._sy=t.clientY;
    }, {passive:true});
    row.addEventListener('touchmove', e=>{
      if(!dragRow) return;
      const t=e.touches[0];
      if(!started){
        if(Math.abs(t.clientY-dragRow._sy)<12 || Math.abs(t.clientX-dragRow._sx)>Math.abs(t.clientY-dragRow._sy)) { return; }
        started=true;
        dragRow.classList.add('dragging');
        ghost=dragRow.cloneNode(true);
        ghost.style.cssText='position:fixed;left:'+dragRow.getBoundingClientRect().left+'px;width:'+dragRow.getBoundingClientRect().width+'px;z-index:999;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.5)';
        document.body.appendChild(ghost);
      }
      e.preventDefault();
      ghost.style.top=(t.clientY-24)+'px';
      paintMarker(t);
    }, {passive:false});
    row.addEventListener('touchend', ()=>{
      if(!started||!dragRow){ dragRow=null; return; }
      const from=dragRow.getAttribute('data-pldrag').split('|')[1];
      const list=document.getElementById('pl-drag');
      const mk=document.getElementById('pl-drag-mk');
      let idx=-1;
      if(list&&mk){ idx=[...list.children].filter(c=>c.hasAttribute('data-pldrag')).length; let before=false; for(const c of list.children){ if(c===mk) break; if(c.hasAttribute('data-pldrag')) before++; } idx=before; }
      dragRow.classList.remove('dragging'); if(ghost){ ghost.remove(); ghost=null; }
      clearMarker();
      const p=DB.playlists.find(x=>x.id===plId);
      if(p&&idx>=0){
        p.items=(p.items||[]).filter(x=>x!==from);
        p.items.splice(Math.min(idx,p.items.length),0,from);
        saveDB(); ACTIONS.plOpen(plId); toast('Порядок в плейлисте обновлён');
      }
      dragRow=null;
    });
  });
}

  /* скраббер музыки: перетаскивание полосы промотки */

  if(seek && !seek._seekInit){
    seek._seekInit=true;
    if(window.__seekCtl){ try{window.__seekCtl.abort();}catch(e){} }
    const ctl=window.__seekCtl=new AbortController();
    let drag=false;
    const frac=e=>{ const p=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e; const r=seek.getBoundingClientRect(); const x=p.clientX-r.left; return Math.max(0,Math.min(1,x/r.width)); };
    const paintLive=f=>{ const b=document.getElementById('mbar'); const tr=PLAYER.track(); const dur=(tr&&(tr.seconds||tr.dur))||0;
      if(b) b.style.width=Math.round(f*100)+'%'; const p=document.getElementById('mpos'); if(p&&dur) p.textContent=fmtSec(f*dur); };
    seek.addEventListener('mousedown', e=>{ drag=true; paintLive(frac(e)); });
    window.addEventListener('mousemove', e=>{ if(drag) paintLive(frac(e)); }, {signal:ctl.signal});
    window.addEventListener('mouseup', e=>{ if(drag){ drag=false; PLAYER.seekTo(frac(e)); } }, {signal:ctl.signal});
    seek.addEventListener('touchstart', e=>{ drag=true; paintLive(frac(e)); }, {passive:true});
    seek.addEventListener('touchmove', e=>{ if(drag) paintLive(frac(e)); }, {passive:true});
    seek.addEventListener('touchend', e=>{ if(drag){ drag=false; PLAYER.seekTo(frac(e)); } });
    seek.addEventListener('touchcancel', ()=>{ if(drag){ drag=false; const t=PLAYER.track(); const dur=(t&&(t.seconds||t.dur))||1; paintLive((S.music.progress||0)/dur); } });
  }
  const inst=document.getElementById('pwa-install');
  if(inst){
    inst.addEventListener('click', async ()=>{
      if(!window.__pwaPrompt){ toast('Браузер пока не предложил установку: открой Арми в отдельной вкладке и подожди пару секунд, либо ставь через меню ⋮'); return; }
      try{ await window.__pwaPrompt.prompt(); const r = await window.__pwaPrompt.userChoice; if(r && r.outcome==='accepted') toast('Арми устанавливается…'); }catch(e){ toast('Не получилось — поставь через меню браузера ⋮'); }
      window.__pwaPrompt=null;
    });
  }
}

function briefingText(){
  const d=new Date(), {w,ph}=weekOf(d), day=DAYS[d.getDay()];
  const open=DB.tasks.filter(t=>!t.done);

  const next=ev.find(e=>e.start>=nowHM())||ev[0];

  parts.push('Активных задач: '+open.length+(important.length?', из них важных: '+important.length:'')+'.');

  const orphan = list.filter(t=>!DB.sections.some(s=>s.name===t.project));
  const showEmpty = (f==='all' && !sect);
  /* ── вид «компактно»: без карточек, заголовки-строки, задачи по одной линии ── */
  const compactBody =
    '<div class="tasks-compact">'+
    groups.filter(g=>g.items.length).map(g=>
      '<div class="sect-h"><span class="dot" style="background:'+g.s.c+'"></span><b style="font-size:13px">'+esc(g.s.name)+'</b><span class="cnt">'+g.items.filter(t=>!t.done).length+' открытых</span></div>'+
      g.items.map(t=>'<div class="item'+(t.done?' done':'')+'" data-act="taskEdit" data-arg="'+t.id+'">'+
        '<button class="ckb" data-act="taskToggle" data-arg="'+t.id+'" aria-label="Отметить">'+ic('check')+'</button>'+
        '<span class="tx">'+esc(t.title)+'</span>'+
        (t.priority==='high'&&!t.done?'<span style="color:var(--red);font-size:10px;flex:none">▲</span>':'')+
        (t.due?'<span class="tiny" style="flex:none;font-size:10.5px">'+esc(t.due)+'</span>':'')+
      '</div>').join('')
    ).join('')+
    (orphan.length?'<div class="sect-h"><span class="dot" style="background:var(--t4)"></span><b style="font-size:13px">Без раздела</b></div>'+orphan.map(t=>'<div class="item'+(t.done?' done':'')+'" data-act="taskEdit" data-arg="'+t.id+'"><button class="ckb" data-act="taskToggle" data-arg="'+t.id+'">'+ic('check')+'</button><span class="tx">'+esc(t.title)+'</span>'+(t.due?'<span class="tiny" style="flex:none;font-size:10.5px">'+esc(t.due)+'</span>':'')+'</div>').join(''):'')+
    (!list.length?'<div class="empty">Пусто. Создай задачу или смени фильтр.</div>':'')+
    '</div>';
  /* ── вид «строки»: единый список, слева полоса приоритета, справа раздел ── */
  const rowsBody =
    '<div class="tasks-rows" style="background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden">'+
    list.map(t=>{
      const pr=PRIO[t.priority]||PRIO.normal;
      return '<div class="trow-line'+(t.done?' done':'')+'" style="--prc:'+pr.c+'" data-act="taskEdit" data-arg="'+t.id+'">'+
        '<button class="ckb-s'+(t.done?' on':'')+'" data-act="taskToggle" data-arg="'+t.id+'" aria-label="Отметить">✓</button>'+
        '<span class="tx">'+esc(t.title)+'</span>'+
        '<span class="sect-tag" style="color:'+((DB.sections.find(s=>s.name===t.project)||{}).c||'var(--t3)')+'">'+esc(t.project||'без раздела')+'</span>'+
        '<span class="due-tag">'+esc(t.due||'')+'</span>'+
      '</div>';
    }).join('')+
    (!list.length?'<div class="empty">Пусто. Создай задачу или смени фильтр.</div>':'')+
    '</div>';
  const body = v==='compact' ? compactBody : v==='rows' ? rowsBody :
    (groups.filter(g=>g.items.length||showEmpty).map(g=>
      '<div class="card"><h3><span class="dot" style="background:'+g.s.c+'"></span>'+esc(g.s.name)+'<span class="h-note">'+(g.items.length||'пусто')+'</span></h3>'+
      (g.items.length?g.items.map(taskItem).join(''):'<div class="tiny" style="padding:4px 2px;color:var(--t4)">Задачи из этого раздела появятся здесь</div>')+'</div>'
    ).join('')+(orphan.length?'<div class="card"><h3>Без раздела</h3>'+orphan.map(taskItem).join('')+'</div>':'')+
    (!list.length&&!showEmpty?'<div class="empty">Пусто. Создай задачу или смени фильтр.</div>':''));
  return '<div class="stack">'+
    '<div class="row between wrap"><div style="font-size:19px;font-weight:800">Задачи</div><div class="row" style="gap:8px"><span class="pill">'+DB.tasks.filter(t=>!t.done).length+' открытых</span>'+
    '<button class="btn btn-amber btn-sm" data-act="taskNew">'+ic('plus')+'Задача</button></div></div>'+
    '<div class="row wrap" style="gap:6px">'+
      [['all','Все'],['active','Активные'],['done','Готово']].map(x=>'<button class="pill click'+(f===x[0]?' on':'')+'" data-act="taskFilter" data-arg="'+x[0]+'">'+x[1]+'</button>').join('')+
      '<button class="pill click" style="'+(sect?'':'opacity:.45;')+'" data-act="taskSect" data-arg="">Разделы: '+esc(sect||'все')+'</button>'+
      '<button class="tiny" data-act="sectMng" title="Добавить или убрать раздел" style="color:var(--t3);padding:4px 6px;font-size:11px">＋ раздел</button>'+
    '</div>'+
    '<div class="row wrap" style="gap:6px">'+TASK_VIEWS.map(x=>'<button class="pill click'+(v===x[0]?' on':'')+'" data-act="taskView" data-arg="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
    body+
  '</div>';
}

  const evByDay = i => DB.events.filter(e=>e.day===i).sort((a,b)=>a.start.localeCompare(b.start));
  let body='';

    body = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">'+
      WEEKDAYS.map((wd,i)=>'<div style="min-width:0"><div class="row" style="gap:5px;padding:2px 4px 6px"><span style="font-size:12px;font-weight:700;color:'+(i===today?'var(--amber)':'var(--t2)')+'">'+wd+'</span>'+(i===today?'<span class="tiny" style="color:var(--amber)">·сегодня</span>':'')+'</div>'+

      (evByDay(S.schedDay).length? evByDay(S.schedDay).map(e=>evtRow(e)).join('') : '<div class="empty">В этот день пусто</div>');
