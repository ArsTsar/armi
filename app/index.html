/* ═══ V7 MODULE: 45-editors.js ═══ */
/* ═══════════════════════════════════════════════════════════════════
   V7 · РЕДАКТОРЫ МЕДИА (без внешних библиотек)
   ─────────────────────────────────────────────────────────────────
   Фото: обрезка (кроп с рамкой и ручками), поворот 90°, зеркалирование,
   фильтры (яркость/контраст/насыщенность/чб/сепия). Результат — НОВЫЙ
   файл в IndexedDB (оригинал не трогаем без отдельного подтверждения).
   Аудио: тримминг по волне (декодируем в WebAudio, рисуем волну,
     выделяем диапазон ручками) → вырезаем диапазус → кодируем WAV →
     новый файл в IDB. Работает и для музыки (DB.media), и для записей
     (DB.lectures, blob-ключ lec_<id>).
   ═══════════════════════════════════════════════════════════════════ */

/* ═════════════ РЕДАКТОР ФОТО ═════════════ */
const PHED = {
  id:null, img:null, rot:0, flip:false,
  crop:null,            /* {x,y,w,h} в долях 0..1 */
  filt:{ bri:100, con:100, sat:100, sep:0, gray:0 },
  stageW:0, stageH:0,
  async open(id){
    const m = DB.media.find(x => x.id === id);
    if(!m){ toast('Файл не найден'); return; }
    const url = await mediaUrl(id);
    if(!url){ toast('Не удалось открыть файл'); return; }
    this.id = id; this.rot = 0; this.flip = false;
    this.crop = null;
    this.filt = { bri:100, con:100, sat:100, sep:0, gray:0 };
    this.img = new Image();
    this.img.onload = () => this.render();
    this.img.src = url;
    modal(this.html());
  },
  html(){
    return '<h3>' + ic('pen') + 'Редактор фото</h3>' +
      '<div class="tiny" style="margin:2px 0 10px">Результат сохранится как новая копия — оригинал останется нетронутым</div>' +
      '<div class="phed-stage" id="phed-stage"></div>' +
      '<div class="row mt10" style="gap:6px;flex-wrap:wrap">' +
        '<button class="btn btn-sm" data-phed="rotL">↺ 90°</button>' +
        '<button class="btn btn-sm" data-phed="rotR">↻ 90°</button>' +
        '<button class="btn btn-sm" data-phed="flip">⇋ Зеркало</button>' +
        '<button class="btn btn-sm" data-phed="cropOn">✂ Кроп</button>' +
        '<button class="btn btn-sm" data-phed="reset">Сброс</button>' +
      '</div>' +
      '<div class="mt10" style="display:flex;flex-direction:column;gap:6px">' +
        this.slider('bri','Яркость',0,200) +
        this.slider('con','Контраст',0,200) +
        this.slider('sat','Насыщенность',0,200) +
        this.slider('sep','Сепия',0,100) +
        this.slider('gray','Ч/Б',0,100) +
      '</div>' +
      '<div class="row mt14" style="gap:8px">' +
        '<button class="btn" style="flex:1" data-act="modalBack">Отмена</button>' +
        '<button class="btn btn-amber" style="flex:1" data-phed="save">Сохранить копию</button>' +
      '</div>';
  },
  slider(k, label, min, max){
    const v = this.filt[k];
    return '<div class="row" style="gap:8px;align-items:center">' +
      '<span class="tiny" style="width:92px;flex:none">' + label + '</span>' +
      '<input type="range" min="' + min + '" max="' + max + '" value="' + v + '" data-phed-filt="' + k + '" style="flex:1;padding:0" oninput="PHED.filtChange(this)">' +
      '<span class="tiny" style="width:32px;text-align:right;flex:none" id="phed-v-' + k + '">' + v + '%</span></div>';
  },
  filtChange(inp){
    const k = inp.getAttribute('data-phed-filt');
    this.filt[k] = Number(inp.value);
    const lbl = document.getElementById('phed-v-' + k);
    if(lbl) lbl.textContent = inp.value + '%';
    this.paintImg();
  },
  cssFilt(){
    const f = this.filt;
    return 'filter:brightness(' + f.bri + '%) contrast(' + f.con + '%) saturate(' + f.sat + '%) sepia(' + f.sep + '%) grayscale(' + f.gray + '%)';
  },
  render(){
    const stage = document.getElementById('phed-stage');
    if(!stage || !this.img) return;
    /* размеры вписывания */
    const maxW = stage.clientWidth || 480, maxH = Math.round(window.innerHeight * 0.52);
    const iw = this.img.width, ih = this.img.height;
    const swap = this.rot % 180 !== 0;
    const dw0 = swap ? ih : iw, dh0 = swap ? iw : ih;
    const k = Math.min(maxW / dw0, maxH / dh0, 1);
    this.stageW = Math.round(dw0 * k); this.stageH = Math.round(dh0 * k);
    stage.style.height = this.stageH + 'px';
    let inner = '<img src="' + this.img.src + '" id="phed-img" style="width:' + this.stageW + 'px;height:' + this.stageH + 'px;' +
      'transform:rotate(' + this.rot + 'deg)' + (this.flip ? ' scaleX(-1)' : '') + ';' + this.cssFilt() + '">';
    if(this.crop) inner += this.cropHTML();
    stage.innerHTML = inner;
    if(this.crop) this.bindCrop();
  },
  cropHTML(){
    const c = this.crop;
    const x = c.x * this.stageW, y = c.y * this.stageH;
    const w = c.w * this.stageW, h = c.h * this.stageH;
    return '<div class="phed-crop" id="phed-crop" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px">' +
      '<div class="pc-h h"></div><div class="pc-h h"></div><div class="pc-h v"></div><div class="pc-h v"></div>' +
      '<span class="pc-k tl" data-k="tl"></span><span class="pc-k tr" data-k="tr"></span>' +
      '<span class="pc-k bl" data-k="bl"></span><span class="pc-k br" data-k="br"></span></div>';
  },
  toggleCrop(){
    this.crop = this.crop ? null : { x:0.12, y:0.12, w:0.76, h:0.76 };
    this.render();
  },
  bindCrop(){
    const box = document.getElementById('phed-crop');
    const stage = document.getElementById('phed-stage');
    if(!box || !stage) return;
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const startDrag = (e, mode) => {
      e.preventDefault(); e.stopPropagation();
      const p0 = (e.touches && e.touches[0]) || e;
      const c0 = Object.assign({}, this.crop);
      const move = ev => {
        const p = (ev.touches && ev.touches[0]) || ev;
        const dx = (p.clientX - p0.clientX) / this.stageW;
        const dy = (p.clientY - p0.clientY) / this.stageH;
        let c = this.crop;
        if(mode === 'move'){
          c.x = clamp01(c0.x + dx); c.y = clamp01(c0.y + dy);
          c.x = Math.min(c.x, 1 - c0.w); c.y = Math.min(c.y, 1 - c0.h);
        } else {
          if(mode.includes('l')){ const nx = clamp01(c0.x + dx); c.x = nx; c.w = c0.w + (c0.x - nx); }
          if(mode.includes('r')){ c.w = clamp01(c0.w + dx); }
          if(mode.includes('t')){ const ny = clamp01(c0.y + dy); c.y = ny; c.h = c0.h + (c0.y - ny); }
          if(mode.includes('b')){ c.h = clamp01(c0.h + dy); }
          c.w = Math.max(0.05, c.w); c.h = Math.max(0.05, c.h);
        }
        /* перерисовать рамку без полного render */
        box.style.left = (c.x * this.stageW) + 'px';
        box.style.top = (c.y * this.stageH) + 'px';
        box.style.width = (c.w * this.stageW) + 'px';
        box.style.height = (c.h * this.stageH) + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, { passive:false });
      document.addEventListener('touchend', up);
    };
    box.addEventListener('mousedown', e => startDrag(e, 'move'));
    box.addEventListener('touchstart', e => startDrag(e, 'move'), { passive:false });
    box.querySelectorAll('.pc-k').forEach(k => {
      const mode = k.getAttribute('data-k');
      k.addEventListener('mousedown', e => startDrag(e, mode));
      k.addEventListener('touchstart', e => startDrag(e, mode), { passive:false });
    });
  },
  paintImg(){
    const img = document.getElementById('phed-img');
    if(img) img.style.cssText = img.style.cssText.replace(/filter:[^;]+/, this.cssFilt());
  },
  rotate(dir){
    this.rot = (this.rot + (dir === 'r' ? 90 : -90) + 360) % 360;
    this.crop = null;
    this.render();
  },
  reset(){
    this.rot = 0; this.flip = false; this.crop = null;
    this.filt = { bri:100, con:100, sat:100, sep:0, gray:0 };
    /* обновить слайдеры в DOM */
    for(const k of Object.keys(this.filt)){
      const inp = document.querySelector('[data-phed-filt="' + k + '"]');
      if(inp){ inp.value = this.filt[k]; }
      const lbl = document.getElementById('phed-v-' + k);
      if(lbl) lbl.textContent = this.filt[k] + '%';
    }
    this.render();
  },
  /* собрать результат на canvas и сохранить как НОВЫЙ файл */
  async save(){
    const src = this.img;
    /* область источника с учётом поворота */
    let sx = 0, sy = 0, sw = src.width, sh = src.height;
    if(this.crop){
      const swap = this.rot % 180 !== 0;
      /* кроп в координатах показа → в координатах источника */
      const cw = this.crop.w * (swap ? sh : sw);
      const ch = this.crop.h * (swap ? sw : sh);
      const cx = this.crop.x * (swap ? sh : sw);
      const cy = this.crop.y * (swap ? sw : sh);
      sx = cx; sy = cy; sw = cw; sh = ch;
    }
    const swap = this.rot % 180 !== 0;
    const outW = Math.round(swap ? sh : sw);
    const outH = Math.round(swap ? sw : sh);
    const cv = document.createElement('canvas');
    cv.width = outW; cv.height = outH;
    const ctx = cv.getContext('2d');
    ctx.filter = this.cssFilt().replace('filter:', '');
    ctx.save();
    ctx.translate(outW / 2, outH / 2);
    ctx.rotate(this.rot * Math.PI / 180);
    if(this.flip) ctx.scale(-1, 1);
    const dw = swap ? outH : outW, dh = swap ? outW : outH;
    ctx.drawImage(src, sx, sy, sw, sh, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
    if(!blob){ toast('Не удалось сохранить'); return; }
    const id = uid('img');
    await IDB.put(id, blob);
    const orig = DB.media.find(x => x.id === this.id);
    const nm = (orig ? orig.name : 'фото') + ' (правка)';
    DB.media.unshift({ id, kind:'photo', name:nm, size:blob.size, type:'image/jpeg', added:'сегодня',
      dur:0, folder: orig ? orig.folder : null });
    saveDB();
    closeModal(); render();
    toast('Сохранена копия: «' + nm + '»');
  },
};

/* ═════════════ РЕДАКТОР АУДИО (тримминг) ═════════════ */
const AUED = {
  mode:null,           /* 'media' | 'lecture' */
  mediaId:null, lectId:null,
  blob:null, buf:null, /* AudioBuffer */
  dur:0, sel:{ a:0, b:1 },   /* выделение в долях */
  audio:null, playing:false, playT:0, playFrom:0, playTimer:null,
  async open(blobKey, mode, id, title){
    let blob = null;
    try{ blob = await IDB.get(blobKey); }catch(e){}
    if(!blob){ toast('Аудио не найдено'); return; }
    this.mode = mode; this.mediaId = mode === 'media' ? id : null; this.lectId = mode === 'lecture' ? id : null;
    this.blob = blob; this.sel = { a:0, b:1 }; this.playing = false;
    modal('<h3>' + ic('pen') + 'Обрезка аудио</h3>' +
      '<div class="tiny" style="margin:2px 0 10px" id="aued-title">' + esc(title || 'Аудио') + ' · читаю и строю волну…</div>' +
      '<div class="wave-wrap" id="aued-wrap"><canvas class="wave-cv" id="aued-cv"></canvas></div>' +
      '<div class="wave-time"><span id="aued-a">0:00</span><span id="aued-b">–:––</span></div>' +
      '<div class="row mt10" style="gap:6px;flex-wrap:wrap">' +
        '<button class="btn btn-sm" data-aued="play">' + ic('play') + 'Прослушать выделение</button>' +
        '<button class="btn btn-sm" data-aued="all">Всё целиком</button>' +
      '</div>' +
      '<div class="tiny mt10">Ручки по краям выделения двигай мышью или пальцем. Результат — новая дорожка, оригинал останется.</div>' +
      '<div class="row mt14" style="gap:8px">' +
        '<button class="btn" style="flex:1" data-act="modalBack">Отмена</button>' +
        '<button class="btn btn-amber" style="flex:1" data-aued="save">Сохранить отрывок</button>' +
      '</div>');
    /* декодируем */
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const arr = await blob.arrayBuffer();
      this.buf = await ctx.decodeAudioData(arr);
      ctx.close();
    }catch(e){
      toast('Этот формат не удалось декодировать в браузере');
      closeModal(); return;
    }
    this.dur = this.buf.duration;
    const t = document.getElementById('aued-title');
    if(t) t.textContent = esc(title || 'Аудио') + ' · ' + fmtSec(this.dur);
    this.draw();
    this.bindSel();
  },
  draw(){
    const cv = document.getElementById('aued-cv');
    if(!cv || !this.buf) return;
    const wrap = cv.parentElement;
    const W = wrap.clientWidth || 460, H = wrap.clientHeight || 96;
    cv.width = W * 2; cv.height = H * 2;   /* retina */
    const ctx = cv.getContext('2d');
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W, H);
    /* отрисовка волны: min/max по столбцам */
    const data = this.buf.getChannelData(0);
    const cols = Math.max(60, Math.floor(W / 3));
    const step = Math.floor(data.length / cols) || 1;
    const mid = H / 2;
    ctx.fillStyle = 'rgba(161,161,170,.55)';
    for(let i = 0; i < cols; i++){
      let mn = 1, mx = -1;
      const off = i * step;
      for(let j = 0; j < step; j += Math.max(1, Math.floor(step / 40))){
        const v = data[off + j] || 0;
        if(v < mn) mn = v; if(v > mx) mx = v;
      }
      const x = (i / cols) * W;
      const y1 = mid + mn * (mid - 4), y2 = mid + mx * (mid - 4);
      ctx.fillRect(x, Math.min(y1, y2), 2, Math.max(2, Math.abs(y2 - y1)));
    }
    /* затемнение вне выделения */
    ctx.fillStyle = 'rgba(5,6,8,.62)';
    ctx.fillRect(0, 0, this.sel.a * W, H);
    ctx.fillRect(this.sel.b * W, 0, W - this.sel.b * W, H);
    /* рамки выделения */
    ctx.fillStyle = themeGet()==='aurora' ? '#7dd3fc' : '#fbbf24';
    ctx.fillRect(this.sel.a * W - 1, 0, 2, H);
    ctx.fillRect(this.sel.b * W - 1, 0, 2, H);
    /* подписи времени */
    const a = document.getElementById('aued-a'), b = document.getElementById('aued-b');
    if(a) a.textContent = fmtSec(this.sel.a * this.dur);
    if(b) b.textContent = fmtSec(this.sel.b * this.dur);
  },
  bindSel(){
    const wrap = document.getElementById('aued-wrap');
    if(!wrap) return;
    const frac = p => { const r = wrap.getBoundingClientRect(); return Math.max(0, Math.min(1, (p.clientX - r.left) / r.width)); };
    const near = f => (Math.abs(f - this.sel.a) < Math.abs(f - this.sel.b)) ? 'a' : 'b';
    let drag = null;
    const start = e => {
      const p = (e.touches && e.touches[0]) || e;
      const f = frac(p);
      /* за пределами выделения — начать новое выделение с этого места */
      if(f < this.sel.a || f > this.sel.b){
        this.sel.a = f; this.sel.b = f;
        drag = 'b';
      } else {
        drag = near(f);
      }
      this.draw();
      e.preventDefault();
    };
    const move = e => {
      if(!drag) return;
      const p = (e.touches && e.touches[0]) || e;
      const f = frac(p);
      if(drag === 'a') this.sel.a = Math.min(f, this.sel.b - 0.005);
      else this.sel.b = Math.max(f, this.sel.a + 0.005);
      this.draw();
      e.preventDefault();
    };
    const end = () => { drag = null; };
    wrap.addEventListener('mousedown', start);
    wrap.addEventListener('touchstart', start, { passive:false });
    document.addEventListener('mousemove', move);
    wrap.addEventListener('touchmove', move, { passive:false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  },
  stopPlay(){
    if(this.audio){ this.audio.pause(); this.audio = null; }
    clearInterval(this.playTimer); this.playing = false;
    const b = document.querySelector('[data-aued="play"]');
    if(b) b.innerHTML = ic('play') + 'Прослушать выделение';
    const p = document.getElementById('aued-playline');
    if(p) p.remove();
  },
  async playSel(){
    if(this.playing){ this.stopPlay(); return; }
    /* играем выделение через WebAudio: буфер-сегмент */
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const a = Math.floor(this.sel.a * this.buf.duration * this.buf.sampleRate);
    const b = Math.floor(this.sel.b * this.buf.duration * this.buf.sampleRate);
    const seg = ctx.createBuffer(this.buf.numberOfChannels, Math.max(1, b - a), this.buf.sampleRate);
    for(let ch = 0; ch < this.buf.numberOfChannels; ch++){
      seg.copyToChannel(this.buf.getChannelData(ch).subarray(a, b), ch);
    }
    const srcNode = ctx.createBufferSource();
    srcNode.buffer = seg;
    srcNode.connect(ctx.destination);
    srcNode.onended = () => { this.stopPlay(); ctx.close(); };
    srcNode.start();
    this.playing = true;
    const btn = document.querySelector('[data-aued="play"]');
    if(btn) btn.innerHTML = ic('pause') + 'Стоп';
  },
  selectAll(){ this.sel = { a:0, b:1 }; this.draw(); },
  /* WAV-кодер: AudioBuffer → Blob (PCM 16 бит) */
  encodeWAV(buffer){
    const numCh = Math.min(2, buffer.numberOfChannels);
    const sr = buffer.sampleRate;
    const len = buffer.length;
    const bytes = 44 + len * numCh * 2;
    const ab = new ArrayBuffer(bytes);
    const dv = new DataView(ab);
    const str = (o, s) => { for(let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); str(8, 'WAVE');
    str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, numCh, true); dv.setUint32(24, sr, true);
    dv.setUint32(28, sr * numCh * 2, true); dv.setUint16(32, numCh * 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, len * numCh * 2, true);
    let off = 44;
    const chans = [];
    for(let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
    for(let i = 0; i < len; i++){
      for(let c = 0; c < numCh; c++){
        let v = Math.max(-1, Math.min(1, chans[c][i]));
        dv.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
        off += 2;
      }
    }
    return new Blob([ab], { type:'audio/wav' });
  },
  async save(){
    const a = Math.floor(this.sel.a * this.buf.duration * this.buf.sampleRate);
    const b = Math.floor(this.sel.b * this.buf.duration * this.buf.sampleRate);
    if(b - a < this.buf.sampleRate / 4){ toast('Слишком коротко — расширь выделение'); return; }
    const seg = (this.buf.context || new (window.AudioContext || window.webkitAudioContext)()).createBuffer(
      this.buf.numberOfChannels, b - a, this.buf.sampleRate);
    for(let ch = 0; ch < this.buf.numberOfChannels; ch++){
      seg.copyToChannel(this.buf.getChannelData(ch).subarray(a, b), ch);
    }
    const wav = this.encodeWAV(seg);
    const id = uid('aud');
    await IDB.put(id, wav);
    if(this.mode === 'media'){
      const orig = DB.media.find(x => x.id === this.mediaId);
      const nm = (orig ? orig.name : 'трек') + ' (отрывок)';
      DB.media.unshift({ id, kind:'audio', name:nm, size:wav.size, type:'audio/wav', added:'сегодня',
        dur:(b - a) / this.buf.sampleRate, folder: orig ? orig.folder : null });
      saveDB();
      toast('Сохранён отрывок: «' + nm + '»');
    } else {
      /* запись-лекция: прикрепим отрывок как отдельный медиафайл */
      const orig = DB.lectures.find(x => x.id === this.lectId);
      const nm = (orig ? orig.title : 'запись') + ' (отрывок)';
      DB.media.unshift({ id, kind:'audio', name:nm, size:wav.size, type:'audio/wav', added:'сегодня',
        dur:(b - a) / this.buf.sampleRate, folder:null });
      saveDB();
      toast('Отрывок сохранён в Музыку: «' + nm + '»');
    }
    closeModal(); render();
  },
};
function audioEditorOpen(blobKey, lectId){
  if(lectId){
    const l = DB.lectures.find(x => x.id === lectId);
    AUED.open(blobKey, 'lecture', lectId, l ? l.title : 'Запись');
  } else {
    const m = DB.media.find(x => x.id === blobKey);
    AUED.open(blobKey, 'media', blobKey, m ? m.name : 'Трек');
  }
}

            '<div class="tr-sub">' + sub + '</div></div>' +

            '<button class="btn btn-amber btn-sm tr-undo" data-expl="trashRestore" data-i="' + i + '">' + ic('up') + 'Вернуть</button>' +
          '</div>';
        }).join('') + '</div>') +
    (expiring ? '<div class="tiny">Скоро исчезнут без возврата: ' + expiring + ' элем. (через ≤7 дней) — верни, если нужны.</div>' : '') +
    '<div class="tiny">Автоочистка запускается при открытии приложения и раз в час. Восстановление возвращает файл в ту же папку, откуда он был удалён.</div>' +
  '</div>';
}

/* ═══ V7 MODULE: 60-chat-v7.js ═══ */
/* ═══════════════════════════════════════════════════════════════════
   V7 · ЧАТ: чистка подсказок
   ─────────────────────────────────────────────────────────────────
   Основная правка (чипы и тексты «что умеешь») уже в 15-patches.json.
   Здесь — дополнительные места, где упоминаются бессмысленные примеры
   («100 на 5», «2+2×2»): тексты-подсказки в welcome-сообщении чата
   и заголовок чипов, если он ссылается на счёт.

/* приветственная подсказка над чипами: убираем «счётные» примеры,
   оставляем осмысленные действия — как просил владелец */
(function cleanChatHints(){
  /* сам список чипов патчится в базе; здесь чистим welcome-тексты,
     если они содержат примеры-вычисления */
  const hintsToDrop = /(100 на 5|2\+2×2|2\+2 \+2|сколько будет 2\+2)/gi;
  const origPush = ChatWelcomeText => ChatWelcomeText;
  /* патчим CHATS-заглушки при первом рендере не нужно — тексты чипов
     уже заменены. Дополнительно: фильтр чипов на случай бэкапов со
     старыми настройками */

/* ═══════════════════════════════════════════════════════════════════
   V7 · СЕКРЕТНАЯ ЗОНА: корзина в меню + soft-delete секретных фото/музыки
   ─────────────────────────────────────────────────────────────────
   Раздел strash добавлен в SECRET_IDS патчем базы. Здесь:
   • удаление секретных фото/треков тоже становится мягким 
     (секретные данные лежат в зашифрованном DATA, поэтому корзина
     для них — отдельный зашифрованный список trash внутри DATA)
   • кнопки удаления секретных фото/музыки перехватываются
   ═══════════════════════════════════════════════════════════════════ */

/* soft-delete для секретной зоны: копия в DATA.trash с deletedAt */
async function secretTrashPush(kind, obj, from){
  const d = data();
  if(!d.trash) d.trash = [];
  d.trash.unshift({ kind, obj: JSON.parse(JSON.stringify(obj)), from: from || '', deletedAt: Date.now() });
  await persistData();
  render();
  toast('В корзину закрытой зоны · 30 дней');
}
async function secretTrashRestore(idx){
  const d = data();
  if(!d.trash || !d.trash[idx]) return;
  const t = d.trash[idx];
  if(t.kind === 'photo') d.photos.unshift(t.obj);
  else if(t.kind === 'track') d.music.push(t.obj);
  else if(t.kind === 'note') d.notes.unshift(t.obj);
  d.trash.splice(idx, 1);
  await persistData();
  render();
  toast('Восстановлено в закрытой зоне');
}
async function secretTrashPurge(){
  const d = data();
  if(!d.trash) return 0;
  const keep = d.trash.filter(t => !trashIsExpired(t.deletedAt));
  const gone = d.trash.length - keep.length;
  if(gone){ d.trash = keep; await persistData(); }
  return gone;
}
/* дни до удаления для секрета — тот же TRASH_DAYS */
function secretTrashDays(ts){ return trashDaysLeft(ts); }

/* перехват удалений в секретной зоне (фото/трек) */
const _secretPhotoDelV66 = Secret.photoDel;
Secret.photoDel = async function(arg){
  const d = data();
  const p = (d.photos || []).find(x => x.id === arg);
  if(!p) return;
  await secretTrashPush('photo', p, 'Секретные фото');
  d.photos = d.photos.filter(x => x.id !== arg);
  await persistData(); render();
};
const _secretTrackDelV66 = Secret.trackDel;
Secret.trackDel = async function(arg){
  const d = data();
  const t = (d.music || []).find(x => x.id === arg);
  if(!t) return;
  await secretTrashPush('track', t, 'Секретная музыка');
  d.music = d.music.filter(x => x.id !== arg);
  await persistData(); render();
};

/* восстановление секретного — рабочая версия (v7.0 звала приватную data()) */
window.__secTrashRestoreV71 = async function(idx){
  if(!secAvailable()) return;
  const d = Secret.secData();
  if(!d.trash || !d.trash[idx]) return;
  const t = d.trash[idx];
  if(t.kind === 'photo') d.photos.unshift(t.obj);
  else if(t.kind === 'track') d.music.push(t.obj);
  else if(t.kind === 'note') d.notes.unshift(t.obj);
  d.trash.splice(idx, 1);
  await Secret.persist(); render();
  toast('Восстановлено в закрытой зоне');
};

  window.__secTrashRestoreV71(Number(s.getAttribute('data-i')));
}, true);

   Объявлены как function-декларации — переприсваивание безопасно. */
secretTrashPush = async function(kind, obj, from){
  if(!secAvailable()) return;
  const d = Secret.secData();
  if(!d.trash) d.trash = [];
  d.trash.unshift({ kind, obj: JSON.parse(JSON.stringify(obj)), from: from || '', deletedAt: Date.now() });
  await Secret.persist(); render();

};

secretTrashPurge = async function(){
  if(!secAvailable()) return 0;
  const d = Secret.secData();
  if(!d.trash) return 0;
  const keep = d.trash.filter(t => !trashIsExpired(t.deletedAt));
  const gone = d.trash.length - keep.length;
  if(gone){ d.trash = keep; await Secret.persist(); }
  return gone;
};

  function focusStats(){
    const log = focusLog(), byDay = {};
    log.forEach(s => { const k = dayKey(new Date(s.t)); byDay[k] = (byDay[k]||0) + s.m; });
    const today = byDay[dayKey()] || 0;
    let streak = 0; const d = new Date();
    if(!byDay[dayKey(d)]) d.setDate(d.getDate()-1);   /* сегодня ещё можно успеть — серия не рвётся */
    while(byDay[dayKey(d)]){ streak++; d.setDate(d.getDate()-1); }
    const weeks = [];
    const mon = new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
    for(let i = 7; i >= 0; i--){
      const a = new Date(mon); a.setDate(a.getDate() - i*7);
      let sum = 0; for(let k = 0; k < 7; k++){ const x = new Date(a); x.setDate(x.getDate()+k); sum += byDay[dayKey(x)] || 0; }
      weeks.push({label: a.getDate()+'.'+String(a.getMonth()+1).padStart(2,'0'), v: sum});
    }
    const hours = new Array(24).fill(0); log.forEach(s => { hours[new Date(s.t).getHours()] += s.m; });
    const bestH = hours.indexOf(Math.max.apply(null, hours));
    return {today, streak, weeks, hours, bestH: Math.max.apply(null, hours) > 0 ? bestH : null, total: log.reduce((a,s)=>a+s.m, 0), sessions: log.length};
  }

  function cardsDueList(){ const n = Date.now(); return cards().filter(c => c.due <= n).sort((a,b)=>a.due-b.due); }
  const STOP = new Set(['который','которые','которая','которое','также','потому','можно','нужно','когда','чтобы','после','перед','между','через','более','очень','всегда','иногда','только','именно','каждый','каждая','такой','таким','этого','этому','этой','этих','такие','будет','будут','может','могут','если','либо','чтобы','является','называется']);
  function genCloze(text){
    const sents = String(text||'').replace(/\s+/g,' ').split(/(?<=[.!?…])\s+/).map(s=>s.trim()).filter(s=>s.length>=35 && s.length<=240);
    const out = [], seen = new Set();
    for(const s of sents){
      const words = (s.match(/[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё0-9\-]{3,}/g) || []).filter(w => !STOP.has(w.toLowerCase()));
      if(!words.length) continue;
      /* ключевой термин: латиница/аббревиатура важнее, иначе самое длинное слово */
      const latin = words.filter(w => /^[A-Za-z]/.test(w));
      const term = (latin.length ? latin : words).sort((a,b)=>b.length-a.length)[0];
      const q = s.replace(term, '_____');
      if(q === s || seen.has(q)) continue;
      seen.add(q); out.push({q, a:term});
      if(out.length >= 12) break;
    }
    return out;
  }

    saveCards(all); return n;
  }

        const m = r && r.text && r.text.match(/\[[\s\S]*\]/);
        if(m){ const arr = JSON.parse(m[0]); pairs = arr.filter(x => x && x.q && x.a).map(x => ({q:String(x.q).slice(0,240), a:String(x.a).slice(0,240)})); viaAI = pairs.length > 0; }

  function lineChart(pts){
    if(pts.length < 2) return '<div class="dim">Для графика нужно хотя бы две записи веса (раздел «Тренировки»).</div>';
    const ws = pts.map(p=>p.w), min = Math.min.apply(null, ws), max = Math.max.apply(null, ws), span = Math.max(0.5, max-min);
    const xy = pts.map((p, i) => [4 + i*(92/(pts.length-1)), 6 + (1-(p.w-min)/span)*38]);
    const delta = (pts[pts.length-1].w - pts[0].w);
    return '<svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%;height:120px;display:block"><polyline fill="none" stroke="var(--amber)" stroke-width="1.2" vector-effect="non-scaling-stroke" points="'+xy.map(p=>p.join(',')).join(' ')+'"/>'+
      xy.map((p, i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.1" fill="var(--amber)"><title>'+esc(pts[i].d)+': '+pts[i].w+' кг</title></circle>').join('')+'</svg>'+
      '<div class="row between tiny"><span>'+esc(pts[0].d)+' · '+pts[0].w+' кг</span><span>'+(delta>0?'+':'')+delta.toFixed(1)+' кг</span><span>'+esc(pts[pts.length-1].d)+' · '+pts[pts.length-1].w+' кг</span></div>';
  }
  function scrCompare(){
    const ph = livePhotos(), c = S.cmp = S.cmp || {a:null, b:null};
    if(!ph.some(p=>p.id===c.a)) c.a = ph.length ? ph[0].id : null;
    if(!ph.some(p=>p.id===c.b)) c.b = ph.length ? ph[ph.length-1].id : null;
    const sel = (key, label) => '<label class="tiny" style="flex:1;min-width:140px">'+label+'<select data-v9cmp="'+key+'" style="width:100%;margin-top:4px">'+ph.map((p, i)=>'<option value="'+p.id+'"'+(c[key]===p.id?' selected':'')+'>'+(i+1)+'. '+esc(p.name||'фото')+'</option>').join('')+'</select></label>';
    const weights = (DB.weights||[]).slice(-12);
    return '<div class="stack">'+
      '<div class="row between wrap"><div style="font-size:19px;font-weight:800">Прогресс</div><button class="btn btn-sm" data-act="go" data-arg="photos">'+ic('img')+'К фото</button></div>'+
      (ph.length < 2
        ? '<div class="card"><div style="font-size:15px;font-weight:700">Нужно минимум два фото</div><div class="tiny" style="margin-top:6px">Добавь снимки в разделе «Фото» — например, в начале плана и через несколько недель. Здесь появится слайдер «до / после».</div></div>'
        : '<div class="card"><div class="row wrap" style="gap:10px;margin-bottom:12px">'+sel('a','До')+sel('b','После')+'</div>'+
          '<div id="cmp-box" style="position:relative;width:100%;aspect-ratio:3/4;max-height:70vh;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--panel3);touch-action:pan-y;user-select:none">'+
            '<img id="cmp-a" alt="До" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">'+
            '<img id="cmp-b" alt="После" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(0 0 0 50%)">'+
            '<div id="cmp-line" style="position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--amber);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none"></div>'+
            '<span class="pill" style="position:absolute;left:8px;top:8px">До</span><span class="pill" style="position:absolute;right:8px;top:8px">После</span>'+
          '</div>'+
          '<input id="cmp-r" type="range" min="0" max="100" value="50" style="width:100%;margin-top:12px" aria-label="Положение слайдера">'+
          '<div class="tiny" style="margin-top:6px;text-align:center">Двигай ползунок: слева «до», справа «после»</div></div>')+
      '<div class="card"><h3>'+ic('chart')+'Вес по записям<span class="h-note">последние '+weights.length+'</span></h3>'+lineChart(weights)+'</div>'+
    '</div>';
  }
  async function hydrateCompare(){
    const a = document.getElementById('cmp-a'), b = document.getElementById('cmp-b'), r = document.getElementById('cmp-r');
    if(!a || !b || !r) return;
    const c = S.cmp;
    const [ua, ub] = await Promise.all([photoUrl(c.a), photoUrl(c.b)]);
    if(ua) a.src = ua; if(ub) b.src = ub;
    const apply = () => { b.style.clipPath = 'inset(0 0 0 '+r.value+'%)'; const l = document.getElementById('cmp-line'); if(l) l.style.left = r.value+'%'; };
    r.addEventListener('input', apply); apply();
  }
  document.addEventListener('change', e => {
    const k = e.target && e.target.getAttribute && e.target.getAttribute('data-v9cmp');
    if(k){ S.cmp[k] = e.target.value; render(); }
  });
  /* кнопка «До / после» поверх обычной галереи */
  const _scrPhotos = scrPhotos;
  scrPhotos = function(){
    const html = _scrPhotos();
    if(S.secretActive) return html;
    return '<div class="row" style="margin-bottom:10px"><button class="btn btn-sm" data-act="go" data-arg="compare">'+ic('compare')+'Прогресс: до / после</button></div>'+html;
  };

  /* ═════ 6. СИНХРОНИЗАЦИЯ ПК ↔ ТЕЛЕФОН (WebRTC, без облака) ═════ */
  const SY = {pc:null, dc:null, state:'idle', info:'', code:'', buf:{}};
  const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const dec = s => JSON.parse(decodeURIComponent(escape(atob(String(s).trim().replace(/\s+/g,'')))));
  function snapshot(){
    return {tasks:DB.tasks, notes:DB.notes, events:DB.events, sections:DB.sections, topics:DB.topics, lectures:DB.lectures,
      weights:DB.weights, cards:cards(), focus:focusLog()};
  }
  function mergeBy(local, remote, key, onConflict){
    const idx = new Map(local.map(x => [x[key], x])); let added = 0;
    (remote||[]).forEach(r => { const l = idx.get(r[key]);
      if(!l){ local.push(r); idx.set(r[key], r); added++; } else if(onConflict) onConflict(l, r); });
    return added;
  }
  function applySnapshot(s){
    let added = 0;
    added += mergeBy(DB.tasks, s.tasks, 'id', (l, r) => { if(r.done && !l.done){ l.done = true; l.doneAt = r.doneAt || Date.now(); } });
    added += mergeBy(DB.notes, s.notes, 'id');
    added += mergeBy(DB.events, s.events, 'id');
    added += mergeBy(DB.sections, s.sections, 'id');
    added += mergeBy(DB.topics, s.topics, 'id');
    added += mergeBy(DB.lectures, s.lectures, 'id');
    added += mergeBy(DB.weights, s.weights, 'd');
    const cs = cards(); added += mergeBy(cs, s.cards, 'id', (l, r) => { if((r.rev||0) > (l.rev||0)) Object.assign(l, r); }); saveCards(cs);
    const fl = focusLog(); added += mergeBy(fl, s.focus, 't'); saveJSON(K_FOCUS, fl);
    migrateDB(); saveDB(); return added;
  }
  function chanSend(obj){
    if(!SY.dc || SY.dc.readyState !== 'open') return false;
    const str = JSON.stringify(obj), id = Math.random().toString(36).slice(2,8), N = 12000, n = Math.ceil(str.length / N);
    for(let i = 0; i < n; i++) SY.dc.send(JSON.stringify({t:'chunk', id, i, n, d:str.slice(i*N, (i+1)*N)}));
    return true;
  }
  function onChan(ev){
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.t !== 'chunk') return;
    const b = SY.buf[m.id] = SY.buf[m.id] || {parts:[], got:0};
    b.parts[m.i] = m.d; b.got++;
    if(b.got < m.n) return;
    delete SY.buf[m.id];
    let msg; try{ msg = JSON.parse(b.parts.join('')); }catch(e){ return; }
    if(msg.t === 'snap'){
      const added = applySnapshot(msg.data);
      SY.info = 'Получено и объединено: новых записей '+added+'.';
      toast('Синхронизация: новых записей '+added); render();
    }
  }
  function wireChan(dc){
    SY.dc = dc; dc.onmessage = onChan;
    dc.onopen = () => { SY.state = 'connected'; SY.info = 'Подключено. Отправляю данные…'; chanSend({t:'snap', data:snapshot()}); render(); };
    dc.onclose = () => { SY.state = 'idle'; SY.info = 'Соединение закрыто.'; render(); };
  }
  function newPC(){
    if(SY.pc){ try{ SY.pc.close(); }catch(e){} }
    const pc = SY.pc = new RTCPeerConnection({iceServers:[]});   /* без внешних STUN: только локальная сеть */
    pc.onconnectionstatechange = () => { if(pc.connectionState === 'failed'){ SY.state = 'idle'; SY.info = 'Не удалось соединиться. Оба устройства должны быть в одной Wi-Fi сети (без «изоляции клиентов»).'; render(); } };
    return pc;
  }
  async function gathered(pc){
    if(pc.iceGatheringState === 'complete') return;
    await new Promise(res => { const f = () => { if(pc.iceGatheringState === 'complete'){ pc.removeEventListener('icegatheringstatechange', f); res(); } }; pc.addEventListener('icegatheringstatechange', f); setTimeout(res, 5000); });
  }
  async function syncHost(){
    try{
      const pc = newPC(); wireChan(pc.createDataChannel('armi'));
      await pc.setLocalDescription(await pc.createOffer()); await gathered(pc);
      SY.state = 'offer'; SY.code = enc({type:pc.localDescription.type, sdp:pc.localDescription.sdp}); SY.info = ''; render();
    }catch(e){ SY.state = 'idle'; SY.info = 'Ошибка: '+(e.message||e); render(); }
  }
  async function syncJoin(){
    const inp = document.getElementById('sy-in'); const raw = inp ? inp.value : '';
    try{
      const offer = dec(raw); const pc = newPC();
      pc.ondatachannel = e => wireChan(e.channel);
      await pc.setRemoteDescription(offer);
      await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc);
      SY.state = 'answer'; SY.code = enc({type:pc.localDescription.type, sdp:pc.localDescription.sdp}); SY.info = ''; render();
    }catch(e){ SY.info = 'Код не подошёл: '+(e.message||e); render(); }
  }
  async function syncFinish(){
    const inp = document.getElementById('sy-in2'); const raw = inp ? inp.value : '';
    try{ await SY.pc.setRemoteDescription(dec(raw)); SY.state = 'connecting'; SY.info = 'Соединяюсь…'; render(); }
    catch(e){ SY.info = 'Ответ не подошёл: '+(e.message||e); render(); }
  }
  function syncStop(){ try{ if(SY.pc) SY.pc.close(); }catch(e){} SY.pc = SY.dc = null; SY.state = 'idle'; SY.code = ''; SY.info = ''; render(); }
  const codeBox = id => '<textarea id="'+id+'" rows="4" style="width:100%;font-size:11px;font-family:monospace" placeholder="Вставь код сюда"></textarea>';
  function scrSync(){
    const hasRTC = typeof RTCPeerConnection !== 'undefined';
    let body;
    if(!hasRTC) body = '<div class="dim">Этот браузер не поддерживает прямые соединения (WebRTC).</div>';
    else if(SY.state === 'connected') body = '<div class="row" style="gap:8px"><span class="pill on">подключено</span></div><div class="tiny" style="margin-top:8px">'+esc(SY.info)+'</div>'+
      '<div class="row wrap" style="gap:8px;margin-top:12px"><button class="btn btn-amber btn-sm" data-act="v9SyncNow">Отправить данные ещё раз</button><button class="btn btn-sm" data-act="v9SyncStop">Отключиться</button></div>';
    else if(SY.state === 'offer') body = '<div class="tiny" style="margin-bottom:6px"><b>Шаг 1.</b> Скопируй код и вставь его на втором устройстве («Принять приглашение»).</div>'+
      '<textarea readonly rows="4" id="sy-out" style="width:100%;font-size:11px;font-family:monospace">'+esc(SY.code)+'</textarea>'+
      '<button class="btn btn-sm" style="margin-top:8px" data-act="v9SyncCopy">Скопировать код</button>'+
      '<div class="tiny" style="margin:14px 0 6px"><b>Шаг 2.</b> Вставь сюда ответный код со второго устройства.</div>'+codeBox('sy-in2')+
      '<div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn btn-amber btn-sm" data-act="v9SyncFinish">Подключить</button><button class="btn btn-sm" data-act="v9SyncStop">Отмена</button></div>';
    else if(SY.state === 'answer') body = '<div class="tiny" style="margin-bottom:6px">Скопируй этот ответный код и вставь его на первом устройстве в шаге 2. Затем жди подключения.</div>'+
      '<textarea readonly rows="4" id="sy-out" style="width:100%;font-size:11px;font-family:monospace">'+esc(SY.code)+'</textarea>'+
      '<div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn btn-sm" data-act="v9SyncCopy">Скопировать код</button><button class="btn btn-sm" data-act="v9SyncStop">Отмена</button></div>';
    else body = '<div class="row wrap" style="gap:8px"><button class="btn btn-amber" data-act="v9SyncHost">'+ic('sync')+'Создать приглашение</button></div>'+
      '<div class="tiny" style="margin:16px 0 6px">Или у тебя уже есть код с другого устройства:</div>'+codeBox('sy-in')+
      '<button class="btn btn-sm" style="margin-top:8px" data-act="v9SyncJoin">Принять приглашение</button>';
    return '<div class="stack"><div style="font-size:19px;font-weight:800">Синхронизация</div>'+
      '<div class="card"><h3>'+ic('sync')+'ПК ↔ телефон<span class="h-note">напрямую, без облака</span></h3>'+body+
        (SY.info && SY.state !== 'connected' ? '<div class="tiny" style="margin-top:10px;color:var(--amber)">'+esc(SY.info)+'</div>' : '')+'</div>'+
      '<div class="card"><h3>Как это работает</h3><div class="tiny" style="line-height:1.6">Устройства соединяются напрямую по Wi-Fi: ничего не уходит на серверы, канал шифруется. Код — это «адрес» твоего устройства в сети, его нужно один раз передать на второе (сообщением самому себе, через мессенджер или вручную). Обе стороны объединяют данные: новые задачи, заметки, события, записи, вес, карточки и статистика фокуса добавляются, а выполненная задача остаётся выполненной. Удаления не переносятся, фото, музыка, видео, книги и секретная зона не синхронизируются.<br>Оба устройства должны быть в одной сети, а в роутере не должна быть включена «изоляция клиентов».</div></div></div>';
  }

  /* ═════ действия ═════ */
  Object.assign(ACTIONS, {
    v9Quick(){ openQuick(); }, v9QcTask(){ qcTask(); }, v9QcNote(){ qcNote(); },
    closeModalBtn(){ closeModal(); },
    v9Evening(){ openEvening(); }, v9EveningAI(){ eveningAI(); }, v9EveningPlan(){ eveningPlan(); },
    v9MakeCards(arg){ makeCards(arg); },
    v9Show(){ S.rv.show = true; render(); },
    v9Grade(arg){ grade(parseInt(arg, 10)); },
    v9CardDel(arg){ saveCards(cards().filter(c => c.id !== arg)); S.rv = {id:null, show:false}; render(); toast('Карточка удалена'); },
    v9CardAdd(){
      const q = (document.getElementById('cd-q')||{}).value, a = (document.getElementById('cd-a')||{}).value;
      if(!q || !q.trim() || !a || !a.trim()){ toast('Заполни вопрос и ответ'); return; }
      const all = cards(); all.push(mkCard(null, q.trim(), a.trim())); saveCards(all); render(); toast('Карточка добавлена');
    },
    v9SyncHost(){ syncHost(); }, v9SyncJoin(){ syncJoin(); }, v9SyncFinish(){ syncFinish(); }, v9SyncStop(){ syncStop(); },
    v9SyncNow(){ chanSend({t:'snap', data:snapshot()}) ? toast('Данные отправлены') : toast('Нет соединения'); },
    v9SyncCopy(){ const t = document.getElementById('sy-out'); if(!t) return; t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } toast('Код скопирован'); },
  });

  /* ═════ «Сегодня»: карточка V9 ═════ */
  const _scrHomeV9 = scrHome;
  scrHome = function(){
    const html = _scrHomeV9();
    if(S.secretActive) return html;
    const st = focusStats(), due = cardsDueList().length;
    const btn = (act, arg, icon, label, sub) => '<button class="card" data-act="'+act+'"'+(arg?' data-arg="'+arg+'"':'')+' style="text-align:left;cursor:pointer;flex:1;min-width:150px"><div class="row" style="gap:10px;align-items:center"><div class="deep-ic" style="width:38px;height:38px">'+ic(icon)+'</div><div><div style="font-size:13.5px;font-weight:700">'+label+'</div><div class="tiny">'+sub+'</div></div></div></button>';
    const block = '<div class="row wrap" style="gap:10px">'+
      btn('v9Evening', '', 'spark', 'Разбор дня', 'итог и план на завтра')+
      btn('go', 'review', 'cards', 'Повторение', due ? 'к повторению: '+due : 'карточки из лекций')+
      btn('go', 'focus', 'chart', 'Фокус', st.streak ? st.streak+' '+plural(st.streak,'день','дня','дней')+' подряд' : st.today+' мин сегодня')+
    '</div>';
    const i = html.lastIndexOf('</div>');
    return i < 0 ? html + block : html.slice(0, i) + block + html.slice(i);
  };

  /* ═════ после каждого рендера ═════ */
  const _ar = afterRender;
  afterRender = function(){
    _ar();
    const app = document.getElementById('app');
    /* на «Сегодня» и в чате свой ввод — кнопка бы перекрывала его */
    fab.style.display = (app && app.classList.contains('phone') && !S.secretActive && !['home','chat'].includes(S.screen) && !document.querySelector('.modal')) ? 'grid' : 'none';
    hydrateCompare();
  };
  const css = document.createElement('style');
  css.textContent = '.fab-q{position:fixed;right:16px;bottom:86px;width:52px;height:52px;border-radius:50%;border:none;display:none;place-items:center;font-size:28px;line-height:1;color:#0b0d11;background:var(--amber);box-shadow:0 8px 22px -6px rgba(0,0,0,.6);z-index:40;cursor:pointer}'+
    '.fab-q:active{transform:scale(.94)}'+
    'html.aurora .fab-q{background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#0a0e1f}'+
    '.app.phone .pcontent{padding-bottom:84px}';
  document.head.appendChild(css);

  api.sync = SY; api.cards = cards; api.focusStats = focusStats; api.genCloze = genCloze; api.openQuick = openQuick; api.focusLog = focusLog;
  api.applySnapshot = applySnapshot; api.snapshot = snapshot; api.cardsDue = cardsDueList;
  return api;
})();

/* ── 9. ВЕРСИЯ ── */
document.title = 'Арми 9';

render();
/* PWA: регистрация service worker (офлайн-оболочка + установка).
   file:// и окно предпросмотра (без https) — тихо пропускаем. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    const swPath = new URL('sw.js', document.baseURI).pathname;
    navigator.serviceWorker.register(swPath).catch(()=>{});
  });
}
</script></body></html>
