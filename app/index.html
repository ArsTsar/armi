<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Арми — прототип v5</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d11; --panel:#0d0f13; --panel2:#12151c; --panel3:#151922; --panel4:#1c212b;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --amber:#fbbf24; --amber2:#f59e0b; --amber3:#fcd34d;
  --t1:#e4e4e7; --t2:#a1a1aa; --t3:#71717a; --t4:#52525b;
  --red:#f87171; --em:#34d399; --teal:#2dd4bf; --rose:#fb7185; --blue:#60a5fa; --violet:#a78bfa;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--t1);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s}
select{background:var(--panel3);cursor:pointer}
select option,select optgroup{background:var(--panel3);color:var(--t1)}
input:focus,textarea:focus,select:focus{border-color:rgba(251,191,36,.5)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
::placeholder{color:var(--t4)}
a{color:var(--amber3);text-decoration:none}
a:hover{text-decoration:underline}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── layout ── */
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:240px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;user-select:none}
.logo-tile{width:36px;height:36px;border-radius:12px;background:var(--amber);color:#0b0d11;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none}
.logo-tile.sm{width:28px;height:28px;font-size:15px;border-radius:9px}
.sb-nav{flex:1;overflow-y:auto;padding:0 10px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;color:var(--t2);text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--panel3);color:var(--t1)}
.nav-item.act{background:var(--panel4);color:var(--t1)}
.nav-item span:nth-child(2){flex:1}
.group-label{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--t4);text-transform:uppercase;padding:14px 10px 6px}
.cnt{font-size:10.5px;background:var(--panel4);color:var(--t2);border-radius:99px;padding:1px 7px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.pcheader{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.narrow{max-width:860px;margin:0 auto}
.fade-in{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}

/* ── общие ── */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h-note{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--t2);background:var(--panel3);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--line2);color:var(--t1)}
.pill.on{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.4);color:var(--amber3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--t1);background:var(--panel4);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#0b0d11}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px}
.tab{flex:none;font-size:12.5px;font-weight:600;color:var(--t2);padding:6px 11px;border-radius:8px}
.tab:hover{color:var(--t1)}
.tab.on{background:var(--panel4);color:var(--t1)}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .ckb{width:20px;height:20px;flex:none;border-radius:7px;border:1.5px solid var(--t4);display:grid;place-items:center;color:transparent;transition:all .15s}
.item.done .ckb{background:var(--em);border-color:var(--em);color:#0b0d11}
.item.done .tx{color:var(--t3);text-decoration:line-through}
.item .tx{font-size:13.5px;color:var(--t1)}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--t3);margin-top:2px}
.banner{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--t2);line-height:1.55}
.banner.red{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fca5a5}
.note{font-size:12px;color:var(--t3);line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tiny{font-size:11px;color:var(--t3)}
.dim{font-size:12.5px;color:var(--t2);line-height:1.6}
.sub{font-size:13px;color:var(--t2);line-height:1.6}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.empty{padding:26px 14px;text-align:center;color:var(--t3);font-size:13px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;word-break:break-all;color:var(--t2)}
kbd{font-family:inherit;font-size:10.5px;background:rgba(255,255,255,.07);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--t2)}

/* таблицы */
.tw{width:100%;border-collapse:collapse;font-size:12.5px}
.tw th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t4);padding:6px 8px;border-bottom:1px solid var(--line2)}
.tw td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--t2);vertical-align:top}
.tw td:first-child{color:var(--t1)}
.tw tr:last-child td{border-bottom:none}

/* раскрывающиеся блоки */
details{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--t1);display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
.dbody{padding:0 16px 14px}
.ic.chev{margin-left:auto;width:14px;height:14px;transition:transform .15s;color:var(--t3)}
details[open] .ic.chev{transform:rotate(90deg)}

/* заметки-плитки */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ntile{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:12px;padding:12px 12px 10px;min-height:122px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.ntile:hover{border-color:var(--line2)}
.ntile .nt-t{font-size:13px;font-weight:700;line-height:1.35;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntile .nt-b{font-size:11.5px;color:var(--t3);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ntile .nt-m{margin-top:auto;padding-top:8px;font-size:10.5px;color:var(--t4);display:flex;align-items:center;gap:5px}
.ntile .nt-dot{width:7px;height:7px;border-radius:99px;flex:none}
.group-label.sec{color:var(--amber);display:flex;align-items:center;gap:5px}
.group-label.sec .ic{width:11px;height:11px}
.sheet-tile.sec{color:var(--amber3)}

/* видео */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.vthumb{position:relative;cursor:pointer;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:var(--panel4);display:block}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;background:rgba(0,0,0,.25);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vname{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.45}
.vframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;display:block}

/* фото (закрытая зона) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pgrid .ph{position:relative}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line2);cursor:pointer;display:block}
.pgrid .phdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;background:rgba(11,13,17,.75);color:var(--t2);display:grid;place-items:center;font-size:12px}
.pgrid .phdel:hover{color:var(--red)}

/* чат */
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;min-height:0}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{margin-left:auto;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.25)}
.msg.ai{background:var(--panel3);border:1px solid var(--line)}
.mt{font-size:10.5px;color:var(--t4);margin-top:6px}
.chatbar{padding:12px 16px 14px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.chatbar input{flex:1}
.chip{font-size:12px;color:var(--t2);background:var(--panel3);border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--t1);border-color:var(--line2)}

/* музыка */
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:16px;flex:none}
.eq span{width:3px;background:var(--amber);border-radius:2px;height:4px}
.eq.play span:nth-child(1){animation:eq .9s ease-in-out infinite}
.eq.play span:nth-child(2){animation:eq .9s .2s ease-in-out infinite}
.eq.play span:nth-child(3){animation:eq .9s .4s ease-in-out infinite}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:none}
.trow .eq{cursor:pointer}
.bar{height:3px;background:var(--panel4);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px}

/* модалки/тосты */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{width:min(460px,100%);max-height:86vh;overflow-y:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:18px;animation:fi .15s ease-out}
.modal h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--panel4);border:1px solid var(--line2);color:var(--t1);font-size:13px;font-weight:500;border-radius:12px;padding:9px 16px;z-index:200;opacity:0;transition:all .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* телефон */
.pwrap{flex:1;display:flex;flex-direction:column;height:100vh;height:100dvh;min-width:0;position:relative}
.statusbar{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12.5px;color:var(--t2)}
.pheader{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.pcontent{flex:1;overflow-y:auto;padding:4px 16px 20px}
.bottomnav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--panel);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--t3);font-size:10px;border-radius:10px}
.bn-item.act{color:var(--amber)}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel2);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--t4);margin:4px auto 10px;opacity:.5}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sheet-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;color:var(--t2);font-size:11px}
.sheet-tile.act{background:var(--panel4);color:var(--t1)}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  .pcontent .stack{gap:10px}
}
</style></head><body>
<div id="app" class="app"></div><div id="overlays"></div>

<script>

const DAYS = {

     train:['Осанка: полный блок 12–15 мин (таблица ниже)','Физра 13:00 — движение, не подвиг','Айкидо 19:00–21:00 (кисть: предупреждать партнёров)']},

  5:{type:'Пятница — силовая C', plan:'Утро: осанка-минимум. Силовая C после пар (16:40) или утром. Вечер — академия.',

  6:{type:'Суббота — бег + айкидо', plan:'Утро: осанка полный блок + бег-блок по фазе. Днём — свои дела. Вечер — айкидо.',

/* ══════════ МЕДИА-ХРАНИЛИЩЕ (IndexedDB: файлы музыки/видео/фото) ══════════ */
const IDB = {
  _p:null,
  open(){ if(!this._p) this._p = new Promise((res)=>{ try{ const rq=indexedDB.open('armi_files',2);
    rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains('files')) rq.result.createObjectStore('files'); };
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); }catch(e){ res(null); } }); return this._p; },
  async _tx(mode,fn){ const db=await this.open(); if(!db) return new Promise(r=>r(undefined));
    return new Promise((res)=>{ try{ const tx=db.transaction('files',mode); const q=fn(tx.objectStore('files'));
      tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>res(undefined); tx.onabort=()=>res(undefined); }catch(e){ res(undefined); } }); },
  put(k,b){ return this._tx('readwrite',st=>st.put(b,k)); },
  get(k){ return this._tx('readonly',st=>st.get(k)); },
  del(k){ return this._tx('readwrite',st=>st.delete(k)); },
  clear(){ return this._tx('readwrite',st=>st.clear()); },
};
const MEDIA_URLS = {};
async function mediaUrl(id){
  if(MEDIA_URLS[id]) return MEDIA_URLS[id];
  const b=await IDB.get(id); if(!b) return null;
  return MEDIA_URLS[id]=URL.createObjectURL(b);
}
async function compressImage(file, max=1600, q=.82){
  const bmp = await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*k)), h=Math.max(1,Math.round(bmp.height*k));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
  return blob||file;
}
async function mediaAdd(inp, kind, maxMB){
  const files=[...(inp.files||[])]; inp.value=''; if(!files.length) return;
  let n=0;
  for(const f of files){
    if(f.size>(maxMB||200)*1048576){ toast('«'+f.name+'» больше '+(maxMB||200)+' МБ — пропущен'); continue; }
    try{
      let blob=f;
      if(kind==='photo') blob=await compressImage(f);
      const id=uid(kind==='audio'?'aud':kind==='video'?'vid':'img');
      await IDB.put(id, blob);
      DB.media.unshift({id, kind, name:f.name.replace(/\.[^.]+$/,''), size:blob.size, type:blob.type||'', added:'сегодня', dur:0});
      n++;
    }catch(e){ toast('Не удалось добавить «'+f.name+'»'); }
  }
  saveDB(); render();
  toast(n>1?('Добавлено файлов: '+n):n?(kind==='audio'?'Трек добавлен — жми по нему':'Добавлено — файл на устройстве'):'Ничего не добавлено');
}
async function mediaDel(arg){
  if(PLAYER.fileId===arg){ PLAYER.stopAll(); PLAYER.mode=null; PLAYER.fileId=null; PLAYER.custom=null; S.music.playing=false; S.music.progress=0; }
  if(PLAYER.custom && PLAYER.custom.id===arg){ PLAYER.stopAll(); PLAYER.mode=null; PLAYER.custom=null; S.music.playing=false; S.music.progress=0; }
  await IDB.del(arg);
  if(MEDIA_URLS[arg]){ try{URL.revokeObjectURL(MEDIA_URLS[arg]);}catch(e){} delete MEDIA_URLS[arg]; }
  DB.media=DB.media.filter(m=>m.id!==arg);
  saveDB(); render(); toast('Удалено');
}

function currentTrack(){ const t=PLAYER.track(); return t||TRACKS[0]; }
const PLAYER = {
  audio:null, ctx:null, master:null, beatT:null, progT:null, mode:null, fileId:null, custom:null,
  track(){
    if(this.mode==='file'){ const m=DB.media.find(x=>x.id===this.fileId); return m?{id:m.id,title:m.name,artist:'мой файл · '+fmtSize(m.size),seconds:m.dur||0}:TRACKS[0]; }
    if(this.mode==='custom') return this.custom||TRACKS[0];
    return TRACKS.find(t=>t.id===S.music.trackId)||TRACKS[0];
  },
  ensureAudio(){
    if(this.audio) return this.audio;
    const a=new Audio();
    a.addEventListener('timeupdate',()=>{ S.music.progress=a.currentTime; this.paint(); });
    a.addEventListener('loadedmetadata',()=>{ const m=DB.media.find(x=>x.id===this.fileId);
      if(m&&a.duration&&isFinite(a.duration)&&Math.abs((m.dur||0)-a.duration)>1){ m.dur=a.duration; saveDB(); this.paint(); } });
    a.addEventListener('ended',()=>{ S.music.playing=false; S.music.progress=0; this.paint(); render(); });
    this.audio=a; return a;
  },
  playFile(id){
    this.stopAll(); this.mode='file'; this.fileId=id; this.custom=null; S.music.trackId=null;
    S.music.progress=0; S.music.playing=true; render();
    mediaUrl(id).then(u=>{ if(!u){ toast('Файл не найден'); return; }
      const a=this.ensureAudio(); a.src=u; a.play().catch(()=>toast('Нажми «Слушать» ещё раз — браузер просит жест')); this.paint(); });
  },
  playDemo(id){ this.stopAll(); this.mode=null; this.fileId=null; this.custom=null; S.music.trackId=id; S.music.progress=0; S.music.playing=true; this.startEngine(); render(); },
  playCustom(tr){ this.stopAll(); this.mode='custom'; this.custom=tr; this.fileId=null; S.music.trackId=null; S.music.progress=0; S.music.playing=true; this.startEngine(); render(); },
  toggle(){
    if(S.music.playing){ S.music.playing=false; if(this.mode==='file'&&this.audio) this.audio.pause(); this.stopEngine(); }
    else{
      if(this.mode==='file'&&this.audio&&this.audio.src){ S.music.playing=true; this.audio.play().catch(()=>{}); }
      else if(this.mode==='custom'&&this.custom){ S.music.playing=true; this.startEngine(); }
      else if(this.mode===null&&S.music.trackId){ S.music.playing=true; this.startEngine(); }
      else { this.playDemo(S.music.trackId||TRACKS[0].id); return; }
    }
    render();
  },
  stopAll(){ if(this.audio) this.audio.pause(); this.stopEngine(); },
  startEngine(){
    const tr=this.track(); this.synthStart(tr);
    clearInterval(this.progT);
    this.progT=setInterval(()=>{ if(!S.music.playing) return;
      const t=this.track(); const dur=(t&&(t.seconds||t.dur))||180;
      S.music.progress=(S.music.progress||0)+1; if(S.music.progress>=dur) S.music.progress=0;
      this.paint(); },1000);
  },
  stopEngine(){
    clearInterval(this.progT); this.progT=null; clearInterval(this.beatT); this.beatT=null;
    if(this.master){ try{ const m=this.master, ctx=this.ctx; m.gain.setTargetAtTime(0, ctx.currentTime, .06); setTimeout(()=>{try{m.disconnect();}catch(e){}},300); }catch(e){} this.master=null; }
  },
  synthStart(tr){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=this.ctx||new AC(); if(this.ctx.state==='suspended') this.ctx.resume();
      const seed=[...(tr.id||'x')].reduce((a,c)=>a+c.charCodeAt(0),0)+(tr.title||'').length;
      const base=174+((seed%6)*11);
      const penta=[0,3,5,7,10];
      const master=this.ctx.createGain(); master.gain.value=.14; master.connect(this.ctx.destination);
      const flt=this.ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=1500; flt.connect(master);
      this.master=master;
      const note=(f,t,d,v,ty)=>{ const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type=ty; o.frequency.value=f;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
        o.connect(g); g.connect(flt); o.start(t); o.stop(t+d+.05); };
      const beat=.36; let step=0;
      const tick=()=>{
        if(!S.music.playing||this.master!==master) return;
        const t=this.ctx.currentTime+.06, i=step%32;
        if(i%8===0) note(base/2, t, beat*7, .26, 'sine');
        if(i%16===8) note(base/2*1.335, t, beat*7, .18, 'sine');
        if(i%16===0) [0,3,7].forEach(s=>note(base*Math.pow(2,s/12), t, beat*15, .05, 'sine'));
        if(i%2===0&&(seed+step)%3) note(base*2*Math.pow(2,penta[(step*3+seed)%5]/12), t, beat*1.6, .07, 'triangle');
        step++;
      };
      tick(); this.beatT=setInterval(tick, beat*1000);
    }catch(e){}
  },
  paint(){
    const tr=this.track(); const dur=(tr&&(tr.seconds||tr.dur))||0;
    const mp=document.getElementById('mp-sub'); if(mp) mp.textContent=(S.music.playing?'играет':'на паузе')+' · '+fmtSec(S.music.progress||0);
    const mpt=document.getElementById('mp-title'); if(mpt&&tr) mpt.textContent=tr.title;
    const bar=document.getElementById('mbar'); if(bar&&dur) bar.style.width=Math.min(100,Math.round(100*(S.music.progress||0)/dur))+'%';
    const pos=document.getElementById('mpos'); if(pos) pos.textContent=fmtSec(S.music.progress||0);
    const tot=document.getElementById('mtot'); if(tot&&dur) tot.textContent=fmtSec(dur);
  },
};

function pf(x){ return parseFloat(String(x).replace(',','.')); }
function fmtNum(v){ const r=Math.round(v*1e6)/1e6; return r.toLocaleString('ru-RU'); }
function calcAnswer(qRaw){
  let q=' '+qRaw.toLowerCase().replace(/\s+/g,' ')+' ';
  q=q.replace(/сколько будет|сколько|посчитай|реши|чему равно|посчитать|=|\?/g,' ');
  let m=q.match(/(\d+(?:[.,]\d+)?)\s*(?:%|процент[а-я]*)\s*от\s*(\d+(?:[.,]\d+)?)/);
  if(m){ const a=pf(m[1]), b=pf(m[2]); return fmtNum(a)+'% от '+fmtNum(b)+' = '+fmtNum(a*b/100); }
  m=q.match(/(\d+(?:[.,]\d+)?)\s+на\s+(\d+(?:[.,]\d+)?)/);
  if(m && !/[+\-*/:×÷%]/.test(q)){
    const a=pf(m[1]), b=pf(m[2]);
    return fmtNum(a)+' : '+fmtNum(b)+' = '+fmtNum(a/b)+'\n(если про умножение: '+fmtNum(a)+' × '+fmtNum(b)+' = '+fmtNum(a*b)+')';
  }
  let s=q.replace(/умножить на|умножить|умножь на|умножь|произведение/g,'*')
    .replace(/разделить на|поделить на|делить на|разделить|поделить|раздели|подели|частное/g,'/')
    .replace(/плюс|прибавить/g,'+').replace(/минус|отнять/g,'-')
    .replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/:/g,'/').replace(/\^/g,'**');
  if(/^[\d+\-*/().%\s]+$/.test(s.trim()) && /\d/.test(s) && /[+\-*/]/.test(s)){
    try{
      const v=Function('"use strict";return('+s+')')();
      if(typeof v==='number'&&isFinite(v)) return qRaw.trim()+' = '+fmtNum(v);
    }catch(e){}
  }
  return null;
}
function weekOf(d){
  const days = Math.floor((d - START)/864e5);
  if(days < 0) return {w:0, ph:null};
  const w = Math.floor(days/7)+1;
  if(w > 39) return {w:39, ph:PHASES[3]};
  for(const p of PHASES) if(d >= p.a && d <= p.b) return {w, ph:p};
  return {w, ph:null};
}
function streak(){
  let s=0;
  for(let i=0;i<400;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const done = MIN5.filter((_,j)=>chkGet('m_'+dkey(d)+'_'+j)).length;
    if(done>=4) s++; else if(i>0) break; else continue;
  }
  return s;
}
function weekMatch(label,w){
  const m = label.match(/^Нед\.\s*([\d–]+)/); if(!m) return false;
  const p = m[1].split('–').map(Number);
  return w>=p[0] && w<=(p[1]||p[0]);
}

function globalSearch(q){
  const box = document.getElementById('gsres');
  q = q.trim().toLowerCase();
  if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
  const res = [
    ...DB.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,4).map(t=>({i:'task',l:t.title,s:'Задача · '+t.project,g:'tasks'})),
    ...DB.notes.filter(n=>(n.title+' '+n.content).toLowerCase().includes(q)).slice(0,4).map(n=>({i:'note',l:n.title,s:'Заметка',g:'notes'})),
    ...DB.events.filter(e=>e.title.toLowerCase().includes(q)).slice(0,3).map(e=>({i:'cal',l:e.title,s:'Событие · '+WEEKDAYS[e.day],g:'schedule'})),
    ...BOOKS.filter(b=>(b.t+' '+b.a).toLowerCase().includes(q)).slice(0,2).map(b=>({i:'book',l:b.t,s:'Книга · '+b.a,g:'fun'})),
  ].slice(0,8);
  if(!res.length){ box.style.display='block'; box.innerHTML='<div style="padding:12px" class="dim">Ничего не найдено</div>'; return; }
  box.style.display='block';
  box.innerHTML = res.map(r=>'<button style="display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)" data-act="go" data-arg="'+r.g+'">'+ic(r.i)+'<span style="min-width:0"><span style="display:block;font-size:13px;color:var(--t1)" class="tx">'+esc(r.l)+'</span><span class="tiny">'+esc(r.s)+'</span></span></button>').join('');
}

function renderScreen(){
  if(S.secretActive && S.secretScreen) return Secret.renderSecretScreen();
  switch(S.screen){
    case 'home': return scrHome();
    case 'chat': return scrChat();
    case 'notes': return scrNotes();
    case 'tasks': return scrTasks();
    case 'schedule': return scrSchedule();
    case 'train': return scrTrain();
    case 'lectures': return scrLectures();
    case 'music': return scrMusic();
    case 'video': return scrVideo();
    case 'photos': return scrPhotos();
    case 'fun': return scrFun();
    case 'settings': return scrSettings();
  }
  return '';
}

/* позиция скролла хранится между перерисовками: фильтры, правки и выбор категории не прыгают вверх */
const SCROLLMEM = {};
function scrollHost(){ return document.querySelector('.content') || document.querySelector('.pcontent'); }
function viewKey(){ return (S.secretActive&&S.secretScreen ? S.secretScreen : S.screen)+'|'+(S.noteOpen||'')+'|'+(S.secretNoteOpen||'')+'|'+(S.secretThread||''); }
function render(){
  const prev = scrollHost(); if(prev) SCROLLMEM[render._vk || ''] = prev.scrollTop;
  const app = document.getElementById('app');
  app.innerHTML = resolveView()==='pc' ? pcShell() : phoneShell();
  render._vk = viewKey();
  const host = scrollHost(); if(host) host.scrollTop = SCROLLMEM[render._vk] || 0;
  afterRender();
}
function afterRender(){
  const m=document.getElementById('msgs')||document.getElementById('smsgs')||document.getElementById('cmsgs');
  if(m) m.scrollTop=m.scrollHeight;
  hydrateMedia();
}
function checkList(prefix, items, dateK){
  const dk = dateK||dkey(new Date());
  return items.map((t,i)=>{
    const on = chkGet(prefix+'_'+dk+'_'+i);
    return '<div class="item'+(on?' done':'')+'" data-act="chk" data-arg="'+prefix+'|'+dk+'|'+i+'"><span class="ckb">'+ic('check')+'</span><span class="tx">'+esc(t)+'</span></div>';
  }).join('');
}

/* ── СЕГОДНЯ ── */

  const openTasks = DB.tasks.filter(t=>!t.done);
  const todayEvents = DB.events.filter(e=>e.day===(d.getDay()+6)%7).sort((a,b)=>a.start.localeCompare(b.start));
  const doneMin = MIN5.filter((_,j)=>chkGet('m_'+dkey(d)+'_'+j)).length;
  const doneTr = day.train.filter((_,j)=>chkGet('tr_'+dkey(d)+'_'+j)).length;
  const idea = IDEAS[Math.floor(d/864e5)%IDEAS.length];
  return '<div class="stack">'+
    (S.secretActive? '<div class="banner" style="background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.3);color:#a7f3d0"><b>Закрытая зона открыта.</b> Секретные чаты, заметки, фото и музыка появились в меню сверху, рядом с обычными разделами. <button class="btn btn-sm btn-danger" style="padding:2px 8px;margin-left:4px" onclick="Secret.panic()">Быстрый выход</button></div>' : '')+
    '<div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">'+(d.getHours()<12?'Доброе утро':d.getHours()<18?'Добрый день':'Добрый вечер')+'</div>'+
    '<div class="sub" style="margin-top:2px">'+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+'</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="v">'+(w?w+'/39':'–')+'</div><div class="l">неделя плана</div></div>'+
      '<div class="stat"><div class="v" style="font-size:15px;padding-top:4px">'+(ph?ph.name:'между фазами')+'</div><div class="l">текущая фаза</div></div>'+
      '<div class="stat"><div class="v">'+left+'</div><div class="l">'+(d<=BALL?'дней до бала':'дней до 21')+'</div></div>'+
      '<div class="stat"><div class="v">'+streak()+'</div><div class="l">дней серии</div></div>'+
    '</div>'+
    '<div class="card"><h3>'+ic('dumb')+'Сегодня по плану<span class="h-note">'+esc(day.type.split('—')[1]||'')+'</span></h3>'+
      '<div class="dim" style="margin-bottom:10px">'+esc(day.plan)+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="pill">Тренировка: '+doneTr+'/'+day.train.length+'</span><span class="pill">Минимум: '+doneMin+'/'+MIN5.length+'</span></div>'+
      checkList('tr', day.train, '')+
      '<button class="btn btn-sm mt6" data-act="go" data-arg="train">Открыть тренировки</button></div>'+
    '<div class="card"><h3>'+ic('flame')+'Минимум дня</h3>'+checkList('m', MIN5, '')+'</div>'+
    '<div class="card"><h3>'+ic('cal')+'Дальше сегодня</h3>'+
      (todayEvents.length? todayEvents.map(e=>'<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="dot" style="background:'+((KIND_STYLE[e.kind]||{}).c)+'"></span><span style="font-variant-numeric:tabular-nums;font-size:13px;color:var(--t2);width:76px;flex:none">'+e.start+'–'+e.end+'</span><span style="font-size:13px">'+esc(e.title)+'</span><span class="tiny" style="margin-left:auto">'+esc(e.place||'')+'</span></div>').join('') : '<div class="dim">Пусто — день твой</div>')+'</div>'+
    '<div class="card"><h3>'+ic('bulb')+'Идея на вечер<span class="h-note">раздел «Развитие»</span></h3><div class="sub">'+esc(idea)+'</div>'+

/* ── ЗАДАЧИ (+ разделы) ── */
const PRIO = {high:{t:'Важно',c:'var(--red)'}, normal:{t:'Обычно',c:'var(--t2)'}, low:{t:'Потом',c:'var(--t3)'}};
function scrTasks(){
  const f = S.taskFilter, sect = S.taskSect;
  let list = DB.tasks.slice();
  if(f==='active') list=list.filter(t=>!t.done);
  if(f==='done') list=list.filter(t=>t.done);
  if(sect) list=list.filter(t=>t.project===sect);
  list.sort((a,b)=>(a.done-b.done)||((PRIO[a.priority]?({high:0,normal:1,low:2}[a.priority]):1)-(PRIO[b.priority]?({high:0,normal:1,low:2}[b.priority]):1)));
  const groups = DB.sections.map(s=>({s, items:list.filter(t=>t.project===s.name)}));
  const orphan = list.filter(t=>!DB.sections.some(s=>s.name===t.project));
  const showEmpty = (f==='all' && !sect);
  return '<div class="stack">'+
    '<div class="row between wrap"><div style="font-size:19px;font-weight:800">Задачи</div><div class="row" style="gap:8px"><span class="pill">'+DB.tasks.filter(t=>!t.done).length+' открытых</span>'+
    '<button class="btn btn-amber btn-sm" data-act="taskNew">'+ic('plus')+'Задача</button></div></div>'+
    '<div class="row wrap" style="gap:6px">'+
      [['all','Все'],['active','Активные'],['done','Готово']].map(x=>'<button class="pill click'+(f===x[0]?' on':'')+'" data-act="taskFilter" data-arg="'+x[0]+'">'+x[1]+'</button>').join('')+
      '<button class="pill click" style="'+(sect?'':'opacity:.45;')+'" data-act="taskSect" data-arg="">Разделы: '+esc(sect||'все')+'</button>'+
      '<button class="tiny" data-act="sectMng" title="Добавить или убрать раздел" style="color:var(--t3);padding:4px 6px;font-size:11px">＋ раздел</button>'+
    '</div>'+
    (groups.filter(g=>g.items.length||showEmpty).map(g=>
      '<div class="card"><h3><span class="dot" style="background:'+g.s.c+'"></span>'+esc(g.s.name)+'<span class="h-note">'+(g.items.length||'пусто')+'</span></h3>'+
      (g.items.length?g.items.map(taskItem).join(''):'<div class="tiny" style="padding:4px 2px;color:var(--t4)">Задачи из этого раздела появятся здесь</div>')+'</div>'
    ).join('')+(orphan.length?'<div class="card"><h3>Без раздела</h3>'+orphan.map(taskItem).join('')+'</div>':''))+
    (!list.length&&!showEmpty?'<div class="empty">Пусто. Создай задачу или смени фильтр.</div>':'')+
  '</div>';
}
function taskItem(t){
  const pr = PRIO[t.priority]||PRIO.normal;

    '<button class="ckb" data-act="taskToggle" data-arg="'+t.id+'" aria-label="Отметить выполненной">'+ic('check')+'</button>'+
    '<span style="min-width:0;flex:1;cursor:pointer" data-act="taskEdit" data-arg="'+t.id+'"><span class="tx">'+esc(t.title)+'</span><span class="tiny" style="display:block;margin-top:1px">'+pr.t+' · '+esc(t.due)+'</span></span>'+
    '<button class="btn btn-sm" style="width:28px;height:28px;padding:0;flex:none" data-act="taskEdit" data-arg="'+t.id+'">'+ic('pen')+'</button></div>';
}

/* ── РАСПИСАНИЕ (редактируемое: сетка из чата + свои события) ── */

    body = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">'+
      WEEKDAYS.map((wd,i)=>'<div style="min-width:0"><div class="row" style="gap:5px;padding:2px 4px 6px"><span style="font-size:12px;font-weight:700;color:'+(i===today?'var(--amber)':'var(--t2)')+'">'+wd+'</span>'+(i===today?'<span class="tiny" style="color:var(--amber)">·сегодня</span>':'')+'</div>'+
        evByDay(i).map(e=>evtChip(e)).join('')+'</div>').join('')+'</div>';
  } else {
    body = '<div class="row wrap" style="gap:6px">'+WEEKDAYS.map((wd,i)=>'<button class="pill click'+(S.schedDay===i?' on':'')+'" data-act="schedDay" data-arg="'+i+'">'+wd+'</button>').join('')+'</div>'+
      (evByDay(S.schedDay).length? evByDay(S.schedDay).map(e=>evtRow(e)).join('') : '<div class="empty">В этот день пусто</div>');
  }
  return '<div class="stack">'+
    '<div class="row between wrap"><div style="font-size:19px;font-weight:800">Расписание</div>'+
    '<button class="btn btn-amber btn-sm" data-act="evtNew">'+ic('plus')+'Событие</button></div>'+
    '<div class="tabs">'+[['week','Сетка недели'],['day','День (список)']].map(x=>'<button class="tab'+(S.schedView===x[0]?' on':'')+'" data-act="schedView" data-arg="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="card">'+body+'</div>'+
    '<div class="tiny">Сетка собрана из плана тренировок, айкидо, физры и академии (импорт из GLM-чата) — и теперь редактируемая: нажми на событие, чтобы изменить или удалить, «+ Событие» добавляет своё.</div>'+
    '<button class="tiny" data-act="evtRestore" style="color:var(--t3);text-align:left;padding:2px 4px">↺ вернуть исходную сетку из чата (свои события сохранятся)</button>'+
  '</div>';
}
function evtChip(e){

const FUN_TABS = [['fact','Факт'],['book','Книга'],['idea','Идея'],['mix','Сюрприз']];

    '<div style="font-size:16.5px;font-weight:600;line-height:1.6;margin-top:10px">'+esc(FACTS[S.funFact%FACTS.length])+'</div>'+

  } else if(tab==='book'){
    const p = S.funBook && BOOKS.find(b=>b.id===S.funBook) ? {book:BOOKS.find(b=>b.id===S.funBook), reason:S.funReason} : pickBook();

    body = '<div class="card" style="padding:20px 18px"><div class="tiny" style="letter-spacing:.08em;text-transform:uppercase">'+ic('book').replace('class="ic"','class="ic" style="width:12px;height:12px;vertical-align:-2px"')+' Книга под тебя · подобрала локальная нейронка</div>'+
    '<div style="font-size:18px;font-weight:800;margin-top:10px">'+esc(p.book.t)+'</div>'+
    '<div class="sub" style="margin-top:2px">'+esc(p.book.a)+'</div>'+
    '<div class="dim mt10" style="line-height:1.65">'+esc(p.book.why)+'</div>'+
    '<div class="note mt10">Почему тебе: '+esc(p.reason)+'</div>'+
    '<div class="row between mt14"><span class="tiny">Всего в библиотеке: '+BOOKS.length+'</span><button class="btn btn-amber btn-sm" data-act="funNext" data-arg="book">'+ic('book')+'Другая книга</button></div></div>';
  } else {
    body = '<div class="card" style="padding:20px 18px"><div class="tiny" style="letter-spacing:.08em;text-transform:uppercase">Идея на вечер</div>'+
    '<div style="font-size:16.5px;font-weight:600;line-height:1.6;margin-top:10px">'+esc(IDEAS[S.funIdea%IDEAS.length])+'</div>'+

  }
  return '<div class="stack">'+
    '<div><div style="font-size:19px;font-weight:800">Развлечения и саморазвитие</div><div class="tiny mt6">Факты, книги под твой контекст и идеи на вечер — всё остаётся здесь, ничего не удаляется. Работает офлайн, подбор — локально.</div></div>'+
    '<div class="tabs">'+FUN_TABS.map(t=>'<button class="tab'+(S.funTab===t[0]?' on':'')+'" data-act="funTab" data-arg="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+

    '<details><summary>Вся библиотека · '+BOOKS.length+' книг '+chev()+'</summary><div class="dbody">'+

function localAnswer(q){
  const has = s => q.toLowerCase().includes(s);
  const d=new Date(), {w,ph}=weekOf(d), day=DAYS[d.getDay()], online=S.aiMode==='online';
  const pre = online?'[облако · развёрнуто]\n\n':'';
  const calc = calcAnswer(q);
  if(calc) return pre+calc;
  if(has('который час')||has('сколько времени')) return pre+'Сейчас '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'.';
  if(has('какое числ')||has('какая дат')) return pre+'Сегодня '+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  if(has('сколько дней до бала')) return pre+'До бала (4.04.2027) — '+Math.max(0,Math.round((BALL-d)/864e5))+' дн.';
  if(has('сколько дней до 21')) return pre+'До 21 года (6.07.2027) — '+Math.max(0,Math.round((BIRTH-d)/864e5))+' дн.';
  if(has('спасиб')) return 'Всегда пожалуйста.';
  if(has('как дела')) return 'По плану: '+dayLow(day.type)+'. Открытых задач: '+DB.tasks.filter(x=>!x.done).length+'. А у тебя?';
  if(has('что умеешь')||has('умеешь')) return 'Считаю в чате («100 на 5», «сколько будет 2+2×2», «25% от 4000»), знаю время и дату, веду план и тренировки («что сегодня?», «неделя и фаза»), задачи, расписание, протокол кисти, факты, книги и идеи. Секретный контур — по двойному клику на логотип.';
  if(has('факт')){
    const f = FACTS[Math.floor(Math.random()*FACTS.length)];
    return (online?'[облако · развёрнуто]\n\n':'')+'Держи факт:\n'+f+'\n\nЕщё — в разделе «Развитие», там их '+FACTS.length+'.';
  }
  if(has('книг')){
    const p = pickBook();
    return (online?'[облако · развёрнуто]\n\n':'')+'Под твою неделю подойдёт:\n«'+p.book.t+'» — '+p.book.a+'.\n'+p.book.why+'\nПолная подборка — раздел «Развитие».';
  }
  if(has('идея')){
    const i = IDEAS[Math.floor(Math.random()*IDEAS.length)];
    return (online?'[облако · развёрнуто]\n\n':'')+'Идея на вечер:\n'+i+'\nЕщё — в разделе «Развитие».';
  }
  if(has('сегодня')||has('план на день')){
    return (online?'[облако · развёрнуто]\n\n':'')+'Сегодня '+dayLow(day.type)+'.\n'+day.train.map(x=>'— '+x).join('\n')+'\n\nПорядок сенсея: вис 2×60 с → «парашютист» → разводка → остальное. После — отметь галочки в разделе «Тренировки», серия сегодня: '+streak()+' дн.';
  }
  if(has('недел')||has('фаз')){
    return 'Неделя '+(w||'–')+' из 39 · '+(ph?ph.name:'между фазами')+'.\nБлижайшие вехи: тесты фазы — нед. 8 (29.11), бал — 4.04.2027, 21 год — 6.07.2027.\nСегодня: '+dayLow(day.type)+'.';
  }
  if(has('кист')){
    return 'Протокол кисти:\n— макивара СТОП до снимка\n— травмпункт при больнице скорой помощи: рентген по ОМС, без записи, бесплатно\n— после вердикта: 20–30% силы, первые две костяшки, запястье прямое, 2–3 мин через день.\nПолная версия — «Тренировки» → вкладка «Кисть».';
  }
  if(has('привет')||has('здрав')){
    return 'Привет! План на сегодня: '+dayLow(day.type)+'. Открытых задач: '+DB.tasks.filter(x=>!x.done).length+'. Спроси «что сегодня?» или открой «Тренировки».';
  }
  if(has('задач')){
    const open = DB.tasks.filter(x=>!x.done);
    return 'Открытых задач: '+open.length+'.\n'+open.slice(0,5).map(t=>'— '+t.title+' ('+t.project+')').join('\n')+(open.length>5?'\n…и ещё '+(open.length-5):'')+'\nРаздел «Задачи» — там же управление своими разделами.';
  }
  if(has('расписан')){
    return 'Расписание на сегодня:\n'+DB.events.filter(e=>e.day===(d.getDay()+6)%7).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>e.start+'–'+e.end+' '+e.title).join('\n')+'\nТеперь его можно править: нажми на событие в разделе «Расписание».';
  }
  return 'Такого я пока не знаю — я офлайн-прототип и отвечаю без интернета.\nУверенно умею:\n— считать: «100 на 5», «сколько будет 2+2×2», «25% от 4000»\n— время и дата: «который час», «какое число»\n— план: «что сегодня?», «неделя и фаза», «кисть»\n— задачи, расписание, факты, книги, идеи\nСейчас открытых задач: '+DB.tasks.filter(x=>!x.done).length+'. Спроси что-нибудь из этого.';
}
async function doChatSend(preset){
  const inp = document.getElementById('chat-in');
  const q = (preset!==undefined? preset : (inp?inp.value.trim():''));
  if(!q) return;
  CHAT.push({id:uid('c'), role:'user', content:q, time:nowHM()});
  saveJSON('armi_chat', CHAT);
  if(inp) inp.value='';
  render();
  setTimeout(async()=>{
    CHAT.push({id:uid('c'), role:'ai', content:localAnswer(q), time:nowHM(), local:S.aiMode==='offline', cloud:S.aiMode==='online'});
    saveJSON('armi_chat', CHAT);
    render();
  }, 450);
}

/* ══════════ СЕКРЕТНЫЙ РЕЖИМ ══════════
   Закрытые разделы живут в том же интерфейсе, что и открытый Арми: после входа
   в меню рядом с обычными появляются «Чаты», «Заметки», «Фото», «Музыка»,
   «Второй контур» и «Синхронизация» закрытой зоны. Отдельного окна нет.
   Шифрование: AES-256-GCM, ключ из пароля (PBKDF2, 150k итераций).
   Мастер-ключ хранится в двух слотах (пароль + код восстановления) — как в LUKS.
   Пароль-приманка открывает правдоподобную «пустую» зону.
   Синхронизация ПК↔телефон — отдельным ключом, только по явному разрешению. */
const Secret = (() => {
const B = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
};
async function derive(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sha(s){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return B.enc(d);
}
const META_K='armi_sec_meta', DATA_K='armi_sec_data', DECOY_K='armi_decoy_data', SYNC_K='armi_sec_sync';
function meta(){ return loadJSON(META_K, null); }
function status(){ return {configured: !!meta()}; }

let MK=null;            /* мастер-ключ в памяти после разблокировки */
let DATA=null;          /* расшифрованные секретные данные */
let MODE='real';        /* real | decoy */
let LOCK_T=null;

const DECOY_DEFAULT = {
  notes:[{id:'d1', title:'Пароль от вайфая', content:'home_2026_net', tags:['дом'], updatedAt:'окт'}],
  chats:[{id:'dc1', title:'Личное', msgs:[{role:'ai', content:'Привет! Это закрытая зона.', time:'09:00'}]}],
  photos:[], music:[], contour:null, created:new Date().toISOString(),
};
function freshData(){
  return { notes:[], chats:[{id:uid('sc'), title:'Личное', msgs:[{role:'ai', content:'Секретный чат. История хранится только в зашифрованном контуре и не покидает устройство.', time:nowHM()}]}],
    photos:[], music:[{id:'sm1', title:'Ночной плейлист', artist:'закрытая зона', seconds:240}], contour:{model:'GLM-4.6 · мощная', key:'', msgs:[]}, created:new Date().toISOString() };
}
function data(){ return MODE==='decoy' ? loadJSON(DECOY_K, DECOY_DEFAULT) : DATA; }
async function persistData(){
  if(MODE!=='real' || !MK) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey('raw', MK, 'AES-GCM', false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(DATA)));
  saveJSON(DATA_K, {iv:B.enc(iv), ct:B.enc(ct)});
}
async function decryptData(mk){
  const blob = loadJSON(DATA_K, null); if(!blob) return freshData();
  const key = await crypto.subtle.importKey('raw', mk, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(blob.iv)}, key, B.dec(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function openSlot(secret, slot){
  try{
    const key = await derive(secret, B.dec(slot.salt));
    const mk = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(slot.iv)}, key, B.dec(slot.ct));
    return new Uint8Array(mk);
  }catch(e){ return null; }
}

/* ── ВХОД (шлюз) ── */
function openGate(){ if(S.secretActive) return; status().configured ? loginModal() : setupModal(); }
function loginModal(){
  modal('<h3>'+ic('lock')+' Вход в закрытый режим</h3><div class="tiny" style="margin:4px 0 12px">Зона не видна в интерфейсе. Неверный пароль = вход невозможен.</div>'+

  '<div id="sg-err" class="banner red mt10" style="display:none"></div>'+

}
async function tryLogin(){
  const pass = document.getElementById('sg-pass').value; if(!pass) return;
  const m = meta(); if(!m){ closeModal(); return; }
  let mk = await openSlot(pass, m.slots.pass);
  if(mk){ await enterReal(mk); return; }
  /* пароль-приманка: открывает правдоподобную «пустую» зону */
  if(m.decoy && (await sha(m.decoy.salt + pass)) === m.decoy.vhash){ await enterDecoy(); return; }
  const err = document.getElementById('sg-err');

  modal('<h3>'+ic('key')+' Вход по коду восстановления</h3><div class="tiny" style="margin:4px 0 12px">Код показывался один раз при настройке. С ним можно задать новый пароль, данные сохранятся.</div>'+

  const code = document.getElementById('sr-code').value.trim(); const m=meta(); if(!m||!code) return;

}
function newPassModal(fromRecovery){
  modal('<h3>Новый пароль</h3>'+(fromRecovery?'<div class="tiny" style="margin:4px 0 12px">Данные расшифрованы кодом восстановления. Задай новый пароль — старый больше не работает.</div>':'')+
  '<input id="np1" type="password" placeholder="Новый пароль" autocomplete="off">'+
  '<input id="np2" type="password" placeholder="Ещё раз" autocomplete="off" style="margin-top:8px">'+

async function setNewPass(){
  const p1=document.getElementById('np1').value, p2=document.getElementById('np2').value, err=document.getElementById('np-err');
  if(p1.length<4){ err.style.display='block'; err.textContent='Минимум 4 символа'; return; }
  if(p1!==p2){ err.style.display='block'; err.textContent='Пароли не совпадают'; return; }
  const m = meta();
  m.slots.pass = await mkSlot(p1);
  saveJSON(META_K, m);
  await enterReal(MK);
}
async function mkSlot(secret){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await derive(secret, salt);
  const mk = MK || crypto.getRandomValues(new Uint8Array(32));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, mk);
  return {salt:B.enc(salt), iv:B.enc(iv), ct:B.enc(ct)};
}

async function setupStep2(){
  const p1=document.getElementById('su1').value, p2=document.getElementById('su2').value, decoy=document.getElementById('su-decoy').value;
  const err=document.getElementById('su-err');

  const rec2 = Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>(b%36).toString(36)).join('').toUpperCase().match(/.{3}/g).join('-');

  '<button class="btn mt14" style="width:100%" onclick="Secret.setupStep3()">'+ic('check')+' Я записал код</button>');
}
async function setupStep3(){
  const sync = B.enc(crypto.getRandomValues(new Uint8Array(32)));

  modal('<h3>'+ic('sync')+' Ключ синхронизации</h3>'+

  '<div class="code" style="font-size:11px">'+sync+'</div>'+
  '<button class="btn btn-amber mt14" style="width:100%" onclick="Secret.setupFinish()">Готово — войти в зону</button>');

async function setupFinish(){
  const dsalt = crypto.randomUUID();

    slots:{ pass: await mkSlot(Secret._pass), rec: await mkSlot(Secret._rec) },

async function enterReal(mk){

/* ── ЭКСПОРТ / ИМПОРТ (синхронизация) ── */
async function exportBackup(){
  if(MODE!=='real'){ toast('Экспорт недоступен'); return; }
  const syncKey = store.getItem(SYNC_K); if(!syncKey){ toast('Ключ синхронизации не найден'); return; }
  await persistData();
  const m = meta();
  const payload = { meta:m, data: loadJSON(DATA_K, null) };
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await derive(syncKey, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(payload)));
  const out = { app:'armi', v:3, kind:'secret-backup', salt:B.enc(salt), iv:B.enc(iv), ct:B.enc(ct) };
  const blob = new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='armi-secret-backup.armisecret'; a.click();
  toast('Зашифрованный бэкап скачан');
}
function importModal(){
  modal('<h3>'+ic('up')+' Импорт секретного бэкапа</h3>'+
  '<div class="tiny" style="margin:4px 0 12px">Файл .armisecret с другого устройства + ключ синхронизации. Текущие секретные данные будут заменены.</div>'+
  '<input type="file" id="si-file" accept=".armisecret,.json" style="padding:7px">'+
  '<input id="si-key" placeholder="Ключ синхронизации" style="margin-top:8px" autocomplete="off">'+

  '<div class="row mt14" style="gap:8px"><button class="btn btn-amber" style="flex:1" onclick="Secret.importRun()">Расшифровать и заменить</button><button class="btn" onclick="modalBack()">Отмена</button></div>');
}
async function importRun(){
  const err=document.getElementById('si-err');
  const f=document.getElementById('si-file').files[0], keyStr=document.getElementById('si-key').value.trim();
  const fail=t=>{ err.style.display='block'; err.textContent=t; };
  if(!f) return fail('Выбери файл');
  if(!keyStr) return fail('Введи ключ синхронизации');
  let out; try{ out = JSON.parse(await f.text()); }catch(e){ return fail('Файл повреждён'); }
  if(out.kind!=='secret-backup') return fail('Это не бэкап закрытого режима');
  try{
    const key = await derive(keyStr, B.dec(out.salt));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:B.dec(out.iv)}, key, B.dec(out.ct));
    const payload = JSON.parse(new TextDecoder().decode(pt));
    saveJSON(META_K, payload.meta); saveJSON(DATA_K, payload.data);
    closeModal(); toast('Импортировано. Войди паролем с того устройства');
    loginModal();
  }catch(e){ return fail('Ключ не подходит или файл повреждён'); }
}

function scPhotos(){
  const d = data();
  return '<div class="stack">'+
    '<div class="row between wrap"><div style="font-size:19px;font-weight:800">Фото</div>'+
    '<label class="btn btn-amber btn-sm" style="cursor:pointer">'+ic('up')+'Добавить фото<input type="file" accept="image/*" style="display:none" onchange="Secret.photoAdd(this)"></label></div>'+
    (d.photos.length? '<div class="pgrid">'+d.photos.map(p=>'<div class="ph"><img src="'+p.d+'" alt="" data-act="photoView" data-arg="'+p.id+'"><button class="phdel" data-act="photoDel" data-arg="'+p.id+'">✕</button></div>').join('')+'</div>' : '<div class="empty">Пусто. Добавь фото — оно сожмётся и зашифруется.</div>')+
    '<div class="tiny">Фото хранятся зашифрованными внутри зоны: галерея телефона и другие приложения их не видят. Лимит браузерного хранилища ~5 МБ (несколько десятков сжатых фото); в нативной версии лимита нет.</div></div>';
}
async function photoAdd(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  try{
    const rd = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    const img = await new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=rd; });
    if(!img){ toast('Не удалось прочитать файл'); return; }
    const max=1280, k=Math.min(1, max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    data().photos.unshift({id:uid('p'), d:cv.toDataURL('image/jpeg',0.72), t:new Date().toISOString()});
    await persistData(); render(); toast('Фото зашифровано и сохранено');
  }catch(e){ toast('Слишком большой файл'); }
}
async function photoDel(arg){
  const d=data(); d.photos=d.photos.filter(p=>p.id!==arg);
  await persistData(); render();
}
function photoView(arg){
  const p=data().photos.find(x=>x.id===arg); if(!p) return;
  modal('<h3>'+ic('img')+'Фото</h3><img src="'+p.d+'" style="width:100%;border-radius:12px;margin-top:8px;display:block"><button class="btn mt14" style="width:100%" onclick="modalBack()">Закрыть</button>');
}

/* ── ВТОРОЙ КОНТУР ── */
function scContour(){
  if(MODE==='decoy'){ return '<div class="stack"><div style="font-size:19px;font-weight:800">Второй контур</div><div class="empty">Не настроен. Здесь подключается мощная модель по личному ключу.</div></div>'; }
  const c=data().contour;
  return '<div class="stack">'+
  '<div class="banner">Зона внутри закрытого режима: мощная нейросеть доступна только отсюда. Кто возьмёт твой телефон или сядет за ПК — в обычном интерфейсе её не найдёт и твоим платным доступом не воспользуется.</div>'+
  '<div class="card"><h3>'+ic('zap')+'Модель</h3><div class="tabs">'+
    ['GLM-4.6 · мощная','Claude-класс','GPT-класс','DeepSeek-R1'].map(m=>'<button class="tab'+(c.model===m?' on':'')+'" onclick="Secret.setModel(\''+m+'\')">'+m+'</button>').join('')+'</div>'+
  '<input id="ct-key" type="password" placeholder="Личный API-ключ (хранится зашифрованным)" value="'+esc(c.key||'')+'" style="margin-top:10px" autocomplete="off">'+
  '<div class="row mt10" style="gap:8px"><button class="btn btn-amber btn-sm" onclick="Secret.keySave()">'+ic('check')+'Сохранить ключ</button><button class="btn btn-sm" onclick="Secret.keyTest()">'+ic('wifi')+'Проверить связь</button></div>'+
  '<div id="ct-status" class="tiny mt6">'+(c.key?'ключ сохранён · оплата с твоего личного счёта':'ключ не задан')+'</div></div>'+
  '<div class="card" style="display:flex;flex-direction:column;height:min(50vh,460px);padding:0">'+
    '<div class="msgs" id="cmsgs" style="padding:14px">'+(c.msgs.length?c.msgs.map(m=>msgHTML(m)).join(''):'<div class="dim" style="margin:auto">Диалог с мощной моделью. История — только в зашифрованном контуре.</div>')+'</div>'+
    '<div class="chatbar" style="border-top:1px solid var(--line)"><input id="ct-in" placeholder="Сложный вопрос…" onkeydown="if(event.key===\'Enter\')Secret.contourSend()"><button class="btn btn-amber" style="width:42px;height:40px;padding:0" onclick="Secret.contourSend()">'+ic('zap')+'</button></div></div>'+
  '<div class="note">Оплата — только с твоего личного ключа. Корпоративный кошелёк и «router ai» не подключены и не будут.</div></div>';
}
async function setModel(m){ data().contour.model=m; await persistData(); render(); }
async function keySave(){ data().contour.key=document.getElementById('ct-key').value.trim(); await persistData(); render(); toast('Ключ сохранён в зашифрованном виде'); }
function keyTest(){
  const st=document.getElementById('ct-status'); st.textContent='проверяю…';
  setTimeout(()=>{ st.innerHTML='<span style="color:var(--em)">200 OK · связь есть (демо)</span>'; }, 700);
}
async function contourSend(){
  const inp=document.getElementById('ct-in'); const q=inp?inp.value.trim():''; if(!q) return;
  const c=data().contour;
  c.msgs.push({role:'user', content:q, time:nowHM()});
  const reply='['+c.model+' · второй контур]\n\nЗапрос ушёл с твоего личного ключа, ответ вернулся только в зашифрованную зону.\n\nПо сути (демо-прототип): это самая мощная модель — сюда отправляй то, что локальная не тянет: длинный контекст, сложный код, анализ файлов из закрытых заметок.';
  await persistData(); render();
  const m=document.getElementById('cmsgs'); if(m) m.scrollTop=m.scrollHeight;
  setTimeout(async()=>{ c.msgs.push({role:'ai', content:reply, time:nowHM()}); await persistData(); render();
    const m2=document.getElementById('cmsgs'); if(m2) m2.scrollTop=m2.scrollHeight; }, 600);
}

function scSync(){
  if(MODE==='decoy'){ return '<div class="stack"><div style="font-size:19px;font-weight:800">Синхронизация</div><div class="empty">Не настроена.</div></div>'; }

  return '<div class="stack">'+
  '<div class="note">Секретные данные синхронизируются <b>только по явному разрешению</b>: ты сам скачиваешь зашифрованный файл и сам вводишь ключ на другом устройстве. Автоматической отправки куда-либо нет и не будет.</div>'+
  '<div class="card"><h3>'+ic('key')+'Ключ синхронизации</h3><div class="code" style="font-size:10.5px" id="sync-key">'+(Secret._syncShown? sync : '••••••••••••••••••••••••••••••••')+'</div>'+
  '<div class="row mt10" style="gap:8px"><button class="btn btn-sm" onclick="Secret.syncToggle()">'+ic('eye')+(Secret._syncShown?'Скрыть':'Показать')+'</button><button class="btn btn-sm" onclick="Secret.syncCopy()">'+ic('copy')+'Скопировать</button></div></div>'+
  '<div class="card"><h3>'+ic('down')+'Перенос</h3><div class="row wrap" style="gap:8px">'+
  '<button class="btn btn-amber btn-sm" onclick="Secret.exportBackup()">'+ic('down')+'Скачать бэкап</button>'+
  '<button class="btn btn-sm" onclick="Secret.importModal()">'+ic('up')+'Импортировать</button></div>'+
  '<div class="tiny mt10">Файл зашифрован ключом синхронизации. На другом устройстве: закрытый режим → синхронизация → импорт → войти своим паролем.</div></div></div>';
}
function syncToggle(){ Secret._syncShown=!Secret._syncShown; render(); }
function syncCopy(){
  const k=store.getItem(SYNC_K); if(!k) return;
  (navigator.clipboard?navigator.clipboard.writeText(k):Promise.reject()).then(()=>toast('Ключ скопирован')).catch(()=>{ modal('<h3>Ключ синхронизации</h3><div class="code mt10" style="font-size:10.5px">'+k+'</div><button class="btn mt10" style="width:100%" onclick="modalBack()">Закрыть</button>'); });
}
