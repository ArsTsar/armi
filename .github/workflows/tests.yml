name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Установить зависимости и Chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: "Автотесты (без сети): smoke, облако, хранилище, секретная зона, XSS, функции"
        working-directory: tests
        run: npm test
      - name: "Сборка из src/ совпадает с app/index.html"
        run: node src/build.js --check
      - name: Проверка синтаксиса index.html
        run: |
          node -e "const s=require('fs').readFileSync('app/index.html','utf8');const m=[...s.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)];m.forEach(x=>new Function(x[1]));console.log('ok',m.length)"
